<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalam Business</title>
<meta name="description" content="Kalam Business: Business English for Arabic speakers. Read and listen to the book, learn the phrases, practise, and role-play real work situations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#18233F; --ink-2:#4A5673; --muted:#7A849B;
  --paper:#F5F6FA; --card:#FFFFFF; --line:#E2E5EE;
  --cobalt:#3552C9; --cobalt-soft:#E6EAFB;
  --mint:#2FA88E; --mint-soft:#DDF3EC;
  --saffron:#E9A93A; --saffron-soft:#FBF0DA;
  --rose:#D9677B; --rose-soft:#FBE6EA;
  --good:#23915B; --good-soft:#DDF3E6; --bad:#C2413A; --bad-soft:#F9E1DF;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-lg:26px; --r-md:16px; --r-sm:11px;
  --lift:0 1px 2px rgba(24,35,63,.05),0 10px 30px -12px rgba(24,35,63,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E9ECF5;--ink-2:#B7BFD3;--muted:#8C95AC;--paper:#0F1424;--card:#171E33;--line:#27304A;
  --cobalt:#7F96FF;--cobalt-soft:#1E2850;--mint:#4FD0B3;--mint-soft:#133A33;--saffron:#F2C064;--saffron-soft:#3A2F17;
  --rose:#F08A9C;--rose-soft:#3D1F27;--good:#54CE8C;--good-soft:#143524;--bad:#F07B72;--bad-soft:#3F1E1C;
  --lift:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--ink:#E9ECF5;--ink-2:#B7BFD3;--muted:#8C95AC;--paper:#0F1424;--card:#171E33;--line:#27304A;
  --cobalt:#7F96FF;--cobalt-soft:#1E2850;--mint:#4FD0B3;--mint-soft:#133A33;--saffron:#F2C064;--saffron-soft:#3A2F17;
  --rose:#F08A9C;--rose-soft:#3D1F27;--good:#54CE8C;--good-soft:#143524;--bad:#F07B72;--bad-soft:#3F1E1C;
  --lift:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
[hidden]{display:none!important}

/* nav */
.nav{position:sticky;top:10px;z-index:20;margin:10px auto 0;max-width:1120px;padding-inline:16px}
.nav-in{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 14px;box-shadow:var(--lift)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.links{display:flex;gap:2px;margin-inline:auto}
.links a{text-decoration:none;font-weight:600;font-size:15px;color:var(--ink-2);padding:7px 13px;border-radius:999px}
.links a[aria-current="page"]{background:var(--cobalt-soft);color:var(--cobalt)}
.stats{display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:5px 11px;border-radius:999px;background:var(--paper);font-variant-numeric:tabular-nums}
.stat.x{color:var(--saffron)} .stat.s{color:var(--mint)}
.stat svg{width:15px;height:15px}
@media (max-width:760px){.links{display:none}.stats{margin-inline-start:auto}}
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
  .tabbar a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--cobalt);background:var(--cobalt-soft)}
  body{padding-bottom:78px}
}

/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--paper)}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.chip.lv{background:var(--mint-soft);border-color:transparent;color:var(--mint)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding-block:48px 28px}
.hero h1{font-size:clamp(38px,6.2vw,68px);font-weight:800}
.hero h1 .l2{display:block;color:var(--cobalt)}
.hero .sub{font-size:19px;color:var(--ink-2);margin:18px 0 6px;max-width:34ch}
.hero .sub-ar{color:var(--muted);font-size:17px;margin:0 0 26px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-art{position:relative}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:28px}.hero-art{order:-1;max-width:420px;margin-inline:auto}}

/* dive-in cards */
.sec{padding-block:36px}
.sec-head{text-align:center;max-width:620px;margin:0 auto 26px}
.sec-head h2{font-size:clamp(28px,4vw,40px)}
.sec-head p{color:var(--ink-2);margin:10px 0 0}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.way{position:relative;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:6px;min-height:230px;overflow:hidden}
.way .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.way .ic svg{width:24px;height:24px}
.way h3{font-size:24px}
.way p{margin:0;color:var(--ink-2);font-size:15px}
.way .ar{color:var(--muted);font-size:14px}
.way .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:14px}
.way:hover{border-color:currentColor}
.t-cobalt{color:var(--cobalt)} .t-mint{color:var(--mint)} .t-saffron{color:var(--saffron)} .t-rose{color:var(--rose)}
.way h3,.way p{color:var(--ink)}
.way p{color:var(--ink-2)}

/* page head */
.phead{padding-block:34px 18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin-bottom:18px}
.phead h1{font-size:clamp(34px,5vw,54px);font-weight:800}
.phead p{color:var(--ink-2);max-width:56ch;margin:12px 0 0;font-size:17px}
.phead .ar{color:var(--muted);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* lesson cards */
.group{margin-top:26px}
.group-h{display:flex;align-items:baseline;gap:10px;border-inline-start:4px solid var(--mint);padding-inline-start:10px;margin-bottom:14px}
.group-h b{font-family:var(--display);font-size:22px}
.group-h span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.lcard .art{aspect-ratio:16/10;position:relative}
.lcard .art svg{width:100%;height:100%;display:block}
.lcard .badge{position:absolute;top:12px;padding:3px 10px;border-radius:999px;background:var(--card);font-weight:700;font-size:12px}
.lcard .badge.l{left:12px;color:var(--mint)} .lcard .badge.n{right:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.lcard h3{font-size:21px}
.lcard .ar{color:var(--muted);font-size:15px}
.lcard p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.lcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;font-size:14px;color:var(--muted)}
.lcard .go{font-weight:700;color:var(--cobalt);background:var(--cobalt-soft);padding:6px 14px;border-radius:999px}
.lcard.done .go{background:var(--good-soft);color:var(--good)}
.lcard.soon{opacity:.7}
.lcard.soon .go{background:var(--paper);color:var(--muted)}

/* path */
.path{position:relative;max-width:760px;margin:10px auto 0}
.path::before{content:"";position:absolute;inset:0 auto 0 27px;border-inline-start:2px dashed var(--line)}
.stage-h{position:relative;display:inline-flex;align-items:center;gap:8px;margin:26px 0 12px 58px;font-weight:700;font-size:14px;color:var(--saffron);background:var(--saffron-soft);padding:5px 12px;border-radius:999px}
.step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.step .dot{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink-2)}
.step.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.step.next .dot{border-color:var(--cobalt);color:var(--cobalt)}
.step .box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;text-decoration:none}
.step .box small{color:var(--muted);display:block;font-weight:600;font-size:13px}
.step .box b{font-family:var(--display);font-size:18px}
.step.soon .box{opacity:.6}

/* lesson page */
.lhero{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:center;padding-block:28px 12px}
.lhero .art{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10}
.lhero .art svg{width:100%;height:100%;display:block}
@media (max-width:760px){.lhero{grid-template-columns:1fr}.lhero .art{display:none}.ltabs{top:70px}.player{top:122px}}
.ltabs{position:sticky;top:78px;z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--paper);padding-block:10px;margin-bottom:6px;scrollbar-width:none}
.ltabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.ltabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ltabs button .ok{color:var(--good)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:24px}
@media (max-width:560px){.panel{padding:16px}}

/* read & listen */
.player{position:sticky;top:142px;z-index:4;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:10px 14px;margin-bottom:18px}
.player .pp{width:44px;height:44px;border-radius:50%;border:0;background:var(--saffron);color:#1b1405;display:grid;place-items:center}
.player .pp svg{width:20px;height:20px}
.player .ttl{font-weight:700;font-size:15px;line-height:1.3}
.player .bar{height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:6px;cursor:pointer;position:relative}
.player .bar i{position:absolute;inset:0 auto 0 0;background:var(--saffron);border-radius:9px}
.player .tm{font-size:13px;font-variant-numeric:tabular-nums;opacity:.8}
.player .sp{border:1px solid rgba(255,255,255,.3);background:none;color:inherit;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.tracks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tracks button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;font-size:14px;text-align:start}
.tracks button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.reader{font-size:18px;line-height:1.75;max-width:70ch}
.reader h4{font-family:var(--display);font-size:20px;margin:26px 0 8px}
.reader .ln{display:block;padding:6px 10px;margin-inline:-10px;border-radius:10px;cursor:pointer;transition:background .2s}
.reader .ln:hover{background:var(--paper)}
.reader .ln.now{background:var(--saffron-soft);box-shadow:inset 3px 0 0 var(--saffron)}
.reader .ln .who{font-weight:700;color:var(--cobalt);margin-inline-end:4px}
.reader .blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--muted);height:1em;vertical-align:-2px}
.reader .note{color:var(--muted);font-size:15px}
.hint{display:flex;gap:10px;background:var(--mint-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:15px;margin-bottom:16px}

/* practice player (learn / quiz / match / talk) */
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .35s}
.kicker{font-size:14px;color:var(--muted);font-weight:600}
.phrase{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 4px}
.phrase h2{font-size:clamp(26px,4.4vw,36px);font-weight:650}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--saffron-soft);color:var(--saffron);display:grid;place-items:center}
.say svg{width:22px;height:22px}
.meaning{font-size:20px;font-weight:600;margin-bottom:14px}
.example{background:var(--paper);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.example mark{background:var(--saffron-soft);color:inherit;border-radius:4px;padding:0 3px}
.tip{border-inline-start:3px solid var(--mint);padding-inline-start:12px;color:var(--ink-2);font-size:15px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.q{font-size:20px;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:13px 16px;text-align:left;font-size:17px}
.opt.arx{text-align:right;direction:rtl;font-family:var(--ar)}
.opt:hover:not(:disabled){border-color:var(--cobalt)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.gap{display:inline-block;min-width:72px;border-bottom:2px solid var(--cobalt);text-align:center;color:var(--cobalt)}
.built{min-height:56px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.w{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-size:16px}
.w:disabled{opacity:.25}
.fb{border-radius:var(--r-md);padding:12px 14px;margin-top:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:12px;min-height:54px;font-size:16px;transition:opacity .25s,transform .25s}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.96)}
.tile.shake{animation:sh .3s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-weight:800;color:var(--saffron);font-variant-numeric:tabular-nums}
.scene{background:var(--paper);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px}
.chat{display:grid;gap:10px;margin-bottom:6px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:17px}
.msg small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.them{justify-self:start;background:var(--paper);border-top-left-radius:4px}
.msg.you{justify-self:end;background:var(--cobalt);color:#fff;border-top-right-radius:4px}
.msg.you small{color:inherit;opacity:.8}
.done-box{text-align:center;display:grid;justify-items:center;gap:10px;padding-block:10px}
.done-box h2{font-size:32px}
.score{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.score div{background:var(--paper);border-radius:var(--r-md);padding:10px 18px;min-width:110px}
.score b{display:block;font-family:var(--display);font-size:26px}
.score span{font-size:13px;color:var(--muted)}

/* phrasebook */
.pb{display:grid;gap:10px}
.pbrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px}
.pbrow b{font-size:17px;font-weight:600}
.empty{text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:40px 16px}
footer{margin-top:40px;border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

const READING_PHONE=[{"title": "1. Story One — Phone Interview (p. 9–11)", "src": "audio/phone/book-p9.mp3", "lines": [{"k": "p", "t": 21.23, "s": "I got a phone call from Susan Reason, who works in Human Resources at [the company]. She was calling me at home in the evening to do a screening interview. She needed to ask me some preliminary questions to decide if I would be invited for a face-to-face interview."}, {"k": "p", "t": 21.23, "s": "8 PM"}, {"k": "p", "t": 29.44, "s": "Susan: Hello, Mr. Allen. My name is Susan, from [the company]. I'm wondering if you've got time to answer a few questions about your application."}, {"k": "p", "t": 29.44, "s": "Mr. Allen: I see. Well, I'm actually just about to sit down for dinner, Miss Susan. Do you mind if I call you back in half an hour?"}, {"k": "p", "t": 29.44, "s": "Susan: No, that's fine. I'm in the office for another two hours. The number is ___."}, {"k": "p", "t": 29.44, "s": "Half an hour later"}, {"k": "p", "t": 60.99, "s": "Mr. Allen: Thanks for calling me back — I mean, thanks for waiting."}, {"k": "p", "t": 63.76, "s": "Susan: Now, just to start off with a general question about your background: can you tell me a little about yourself?"}, {"k": "p", "t": 63.76, "s": "Mr. Allen: I am an enthusiastic engineering college graduate with freelance experience. I have completed several client projects, including small consulting and research jobs, and delivered each job on budget and before the deadline. I'd describe myself as a dynamic team player, self-disciplined and resourceful, with the ability to adapt well to new situations, and I thrive on new challenges."}, {"k": "p", "t": 98.18, "s": "Susan: That's interesting. So what are you looking for in your first job?"}, {"k": "p", "t": 103.3, "s": "Mr. Allen: I've been honing my skills for a few years now, and first and foremost I'm looking for a position where I can exercise those skills. I'm definitely looking for a position where I can grow. Professional development is something that's really important to me, since I hope to take on managerial responsibilities in the future."}, {"k": "p", "t": 119.41, "s": "Susan: Can you tell me a little about your salary expectations for this position?"}, {"k": "p", "t": 132.98, "s": "Mr. Allen: Well, I'm looking for somewhere between $3,000 and $5,000 for this role. But for me, benefits matter as well. Your training programs, the commuter benefits and other perks could definitely allow me to be a bit flexible with salary."}, {"k": "p", "t": 132.98, "s": "Susan: OK, thank you so much for your time. Have you got any last questions?"}, {"k": "p", "t": 132.98, "s": "Mr. Allen: Yes — what are the next steps in the interview process?"}, {"k": "p", "t": 132.98, "s": "Susan: Well, if you are shortlisted, we will contact you for a panel interview within the next few days."}, {"k": "p", "t": 154.6, "s": "Mr. Allen: Thanks for talking to me today. Thanks for your time. Goodbye, Susan."}]}, {"title": "2. Asking to delay the interview & speaking about yourself (p. 12–17)", "src": "audio/phone/book-p12.mp3", "lines": [{"k": "h", "s": "Asking to delay the interview"}, {"k": "p", "t": 22.36, "s": "Is it OK if I call you back? I'm just in the middle of something."}, {"k": "p", "t": 22.36, "s": "I'm so glad you called, but I'm a little busy at the moment. Is it OK to call back in about thirty minutes?"}, {"k": "p", "t": 22.36, "s": "I'm a little tied up just now. Is it OK if I call you back?"}, {"k": "p", "t": 27.34, "s": "If it's OK with you, I'd like to call you back when I've finished eating."}, {"k": "h", "s": "Speaking about yourself — useful sentences"}, {"k": "p", "t": 34.8, "s": "I have the ability to deal with ___."}, {"k": "p", "t": 37.96, "s": "I am hard-working and regularly set firm goals for myself."}, {"k": "p", "t": 42.67, "s": "I can adapt well to new situations."}, {"k": "p", "t": 46.29, "s": "I have an aggressive approach to problem-solving."}, {"k": "p", "t": 50.35, "s": "I am goal-oriented and ambitious; I welcome goals and stretch targets because I really enjoy challenging work."}, {"k": "p", "t": 57.83, "s": "I have a constant desire to improve my skills and knowledge and to advance in my career."}, {"k": "p", "t": 67.03, "s": "I am an energetic team player. Working in a team with a collaborative spirit is very important to me."}, {"k": "p", "t": 72.18, "s": "I have a competitive nature."}, {"k": "p", "t": 75.3, "s": "I can work well under pressure."}, {"k": "p", "t": 78.48, "s": "I am conscientious, reliable and punctual."}, {"k": "p", "t": 83.0, "s": "I demonstrate a strong work ethic, pay attention to detail, and show commitment and purpose."}, {"k": "p", "t": 89.67, "s": "I'm known for being able to solve problems quickly."}, {"k": "p", "t": 93.73, "s": "I am a quick learner. I can do new things and take on new responsibilities easily, just by watching or following instructions, as I easily absorb new information and apply it to my work."}, {"k": "p", "t": 105.78, "s": "I'm a people-oriented and cooperative individual. I volunteer to help my co-workers and my team achieve our strategic objectives."}, {"k": "p", "t": 115.65, "s": "I am a resourceful individual with the ability to overcome problems and to make do with what is available to create a solution."}, {"k": "p", "t": 124.48, "s": "I am a creative thinker."}, {"k": "p", "t": 127.34, "s": "I am a risk-taker. I have confidence in my ability to make decisions quickly and easily, and I am comfortable in the face of uncertainty."}, {"k": "p", "t": 136.69, "s": "I am detail-oriented; I pay attention to all the details of my job."}, {"k": "p", "t": 142.06, "s": "I am self-motivated."}, {"k": "p", "t": 144.85, "s": "I am a problem-solver: I make decisions and resolve issues using critical-thinking and analytical skills."}, {"k": "p", "t": 152.39, "s": "I have a keen ability to research and explore, so my solutions are based on facts and studies rather than guesses."}, {"k": "p", "t": 161.25, "s": "I am a self-starter."}, {"k": "p", "t": 163.96, "s": "I am sensitive to the needs of ___."}, {"k": "p", "t": 163.96, "s": "I am a meticulous planner and organizer."}, {"k": "p", "t": 169.81, "s": "I have a sincere interest in ___."}, {"k": "p", "t": 172.83, "s": "I am an effective team member / team player."}, {"k": "p", "t": 176.63, "s": "I am a customer-focused individual. I have a sincere interest in helping my customers with a positive attitude, and I demonstrate a willingness to give the customer the best service possible."}, {"k": "p", "t": 189.14, "s": "I always thrive on challenges."}, {"k": "p", "t": 195.49, "s": "I can work independently. I am capable of working without supervision."}, {"k": "p", "t": 199.52, "s": "I have long-range vision."}, {"k": "p", "t": 202.47, "s": "I am a motivational leader."}, {"k": "p", "t": 205.48, "s": "I am the type of manager who always delegates effectively."}, {"k": "p", "t": 210.26, "s": "I possess the right management and leadership skills to take a team forward and consistently achieve difficult targets."}, {"k": "p", "t": 218.5, "s": "I am commercially focused and I have the confidence to deal quickly with challenging situations."}, {"k": "p", "t": 225.36, "s": "I am an enterprising and dynamic manager, with a results orientation and dedication to making crucial decisions to get things done."}, {"k": "p", "t": 233.89, "s": "My ability to anticipate problems and explore alternative solutions has made me a decisive leader."}, {"k": "p", "t": 245.53, "s": "I am determined and self-disciplined. I always make sure each task is completed according to schedule."}, {"k": "h", "s": "Sample answers (p. 16–17)"}, {"k": "p", "t": 250.55, "s": "I describe myself as a motivational leader and assertive communicator, with long-range vision and an aggressive approach to solving problems and achieving targets."}, {"k": "p", "t": 264.0, "s": "I'm an effective team member with a sincere interest in helping my team thrive and excel. I can also work well independently, with the power of my competitive nature. I'm a self-starter, problem-solver and detail-oriented."}, {"k": "p", "t": 280.06, "s": "I am also self-disciplined, with a high level of confidence in my ability to perform under the pressure of deadlines and competitive environments."}, {"k": "p", "t": 288.99, "s": "I describe myself as a resourceful, self-motivated and enthusiastic individual who is sensitive to the needs of customers. I am also a risk-taker and creative thinker with superb interpersonal skills."}, {"k": "p", "t": 308.27, "s": "As a manager, I'm a meticulous organizer and delegator. I organize my working week in advance and prepare for any potential problems that might occur. I also have the ability to delegate tasks to the right member of the team."}, {"k": "p", "t": 325.56, "s": "I am a motivational leader with superb interpersonal skills. I encourage positivity and provide empowerment in the workplace. I always work with my team to jointly agree on goals and create an environment where credit and rewards are shared and agreed upon."}, {"k": "p", "t": 333.74, "s": "I am an enterprising and dynamic manager with a results orientation and dedication to making crucial decisions to get things done. I'm always prepared to work in a situation that is filled with risks and uncertainties."}, {"k": "p", "t": 350.87, "s": "If I had to describe myself in a few words, it would be that I am a hard-working professional, dedicated and committed to achieving the strategic aims and objectives of my employer through strong management skills."}, {"k": "p", "t": 365.14, "s": "I've been working towards a position in management for a number of years now. I pride myself on setting high standards and on my ability not only to motivate and lead my team but also to inspire them to be the best they can be, so we consistently improve the company we're working for. Finally, my desire to continually grow and improve means I will never sit still or stagnate in a management role, and I will always look to develop personally and professionally."}]}, {"title": "3. Speaking about previous jobs (p. 18–20)", "src": "audio/phone/book-p18.mp3", "lines": [{"k": "h", "s": "Useful phrases (fill in the blank)"}, {"k": "p", "t": 5.71, "s": "My responsibilities are divided between ___ and ___."}, {"k": "p", "t": 9.01, "s": "I'm managing ___."}, {"k": "p", "t": 11.0, "s": "Most of my time is spent focusing on ___."}, {"k": "p", "t": 14.9, "s": "I was responsible for the day-to-day ___."}, {"k": "p", "t": 18.33, "s": "I have spent five years as ___."}, {"k": "p", "t": 21.44, "s": "My experience includes a variety of ___."}, {"k": "p", "t": 25.29, "s": "I was a senior ___."}, {"k": "p", "t": 27.6, "s": "I supervised ___."}, {"k": "p", "t": 29.98, "s": "I have some strong work experience that will help me with this job if I'm successful."}, {"k": "p", "t": 38.05, "s": "I was in charge of ___, ensuring that ___."}, {"k": "p", "t": 44.7, "s": "I previously worked as ___. In my role, I was responsible for ___."}, {"k": "p", "t": 48.43, "s": "From my experience with my last job, I've learned a lot about how to ___."}, {"k": "p", "t": 57.23, "s": "I developed excellent skills working as ___. I'm now excellent at handling ___."}, {"k": "p", "t": 60.24, "s": "My years of experience have prepared me well for this position."}, {"k": "p", "t": 67.21, "s": "Some of my current responsibilities focus on ___."}, {"k": "p", "t": 72.61, "s": "For the last ___ years, I've worked as ___. I was responsible for ___, and I was able to ___."}, {"k": "p", "t": 82.81, "s": "I'm currently ___. I always say my job is to ___. One of my favorite tasks is ___."}, {"k": "p", "t": 90.67, "s": "My current roles and responsibilities are focused on ___. I'm also responsible for ___, as well as ___."}, {"k": "h", "s": "Sample answers"}, {"k": "p", "t": 101.99, "s": "I have some strong work experience that will help me with this job if I'm successful. I worked for ___ years at ___. That helped me gain confidence talking to the public, and also showed me that this is a job where I will need to work hard. I also understood the importance of giving accurate information to customers, and how to be attentive, helpful and considerate."}, {"k": "p", "t": 129.14, "s": "I previously worked as a marketing manager at an agency. In my role, I was responsible for directing a team of six and pulling together strategies and plans to maximize the marketing efforts of the company."}, {"k": "p", "t": 138.6, "s": "I have previously worked as a product associate responsible for handling operations and logistics. I worked closely with our marketing and sales teams to roll out critical marketing campaigns. The customer response was phenomenal, and we were able to increase sales by 15%."}, {"k": "p", "t": 158.07, "s": "When I started my last job, I only had a basic understanding of the fundamentals of SEO, but now I have learned how to run a successful PPC campaign and effectively use social media pages."}, {"k": "p", "t": 169.59, "s": "In my current role, I'm responsible for all brand content — from defining the content style guide, voice and tone, to producing website content, ad copy, blog and landing-page copy, and writing and sending email copy for marketing and sales campaigns. A blog post I recently wrote has just reached 1,000 organic visits, resulting in 19 leads and 6 sales to organizations with 200+ employees."}]}, {"title": "4. Why are you looking for a new job? (p. 21–24)", "src": "audio/phone/book-p21.mp3", "lines": [{"k": "h", "s": "The questions"}, {"k": "p", "t": 7.43, "s": "Why do you want this job? · Why do you want to work here?"}, {"k": "p", "t": 11.96, "s": "Why did you leave your last job? · Why the change?"}, {"k": "h", "s": "Short reasons"}, {"k": "p", "t": 16.54, "s": "I am looking for a company that values me, my skills and my experience more."}, {"k": "p", "t": 16.54, "s": "I'm searching for better compensation."}, {"k": "p", "t": 26.77, "s": "I want a more senior role."}, {"k": "p", "t": 29.74, "s": "I am ready for a new challenge."}, {"k": "p", "t": 32.77, "s": "My role changed over time and I was no longer doing what I was interested in."}, {"k": "p", "t": 38.36, "s": "I want to develop and explore different interests or skills."}, {"k": "p", "t": 43.08, "s": "I'd like different job duties."}, {"k": "p", "t": 46.17, "s": "I want to work in a different field or industry."}, {"k": "p", "t": 50.08, "s": "I didn't feel I had any more opportunity to grow or further my career, so I decided to look for a change."}, {"k": "p", "t": 57.91, "s": "My boss and I have different work styles, values or priorities."}, {"k": "p", "t": 63.39, "s": "I thrive more in a different kind of work environment / I want to find a healthier, non-toxic environment."}, {"k": "p", "t": 71.07, "s": "My company is pursuing a different strategy, restructuring, or being acquired by or merged with another organization."}, {"k": "p", "t": 79.3, "s": "I am looking for an employer that provides more training, development or feedback."}, {"k": "p", "t": 85.73, "s": "I reassessed my career goals and decided my current role no longer fits them."}, {"k": "p", "t": 91.72, "s": "I'm searching for a hybrid, remote or in-office setup, or hours my current job doesn't allow."}, {"k": "p", "t": 98.31, "s": "I love my role and co-workers, but I've come to a point where there are no longer growth opportunities for me there."}, {"k": "p", "t": 105.62, "s": "I am relocating for non-work reasons (family, etc.)."}, {"k": "h", "s": "Sample answers"}, {"k": "p", "t": 117.1, "s": "During my three years at ___, I had the opportunity to develop a strong skill set in ___. It was a great learning experience, and I enjoyed contributing to the team. Now I'm ready to join a company that values my skills and allows me to use them more fully."}, {"k": "p", "t": 134.58, "s": "I realized the leadership of my team was going in a different direction, and I'm interested in working in a more collaborative environment. It was a hard decision to make, because I love the mission of the company, but I ultimately think this is the right choice."}, {"k": "p", "t": 145.17, "s": "I'm ready for the next challenge in my career. I loved the people I worked with and the projects I worked on, but at some point I realized I wasn't being challenged the way I used to be. Rather than let myself get too comfortable, I decided to pursue a position where I can continue to grow."}, {"k": "p", "t": 190.07, "s": "I realized that my true passion is working as ___. I've always loved ___, but decided to take my career in a different direction. Now I'm ready to pursue ___, and I'm particularly excited by the possibility of working with ___."}, {"k": "p", "t": 190.07, "s": "In my last role, the company suffered some financial hardships and had to eliminate my job, along with many others. I'm grateful for my time in that role, as it gave me the opportunity to increase my knowledge while forging lifelong bonds with my colleagues."}, {"k": "p", "t": 190.07, "s": "I've learned a lot in my current role, but now I'm looking to take on more responsibility, as I want to continue developing my skills and abilities — particularly my management abilities. I'm excited that this role provides the opportunity to build out a team rather than only being the sole contributor."}]}, {"title": "5. Salary requirements (p. 25–28)", "src": "audio/phone/book-p25.mp3", "lines": [{"k": "h", "s": "Giving a range"}, {"k": "p", "t": 5.81, "s": "From what I know about the position, I think somewhere in the area of ___ to ___ is a fair figure."}, {"k": "p", "t": 10.73, "s": "Given the responsibilities of the position, I think somewhere between ___ and ___."}, {"k": "p", "t": 34.11, "s": "It's an exciting opportunity and I truly believe I'm the person for the job. I'm really excited by the challenges you described; ___ to ___ seems like the right starting salary. There's a lot to take on, and I'm confident I can succeed in the role."}, {"k": "p", "t": 44.42, "s": "Well, I am certainly flexible. I am looking to receive between ___ and ___. Due to my skill set and experience level, I feel that this is a comparable and appropriate range for my work."}, {"k": "p", "t": 55.8, "s": "I was hoping for something more in the ___ to ___ range, but I'm definitely open to negotiating based on the entire compensation package."}, {"k": "p", "t": 62.43, "s": "I was digging around and saw that the current range for my position (and seniority) is somewhere between ___ and ___ in this industry. This seems reasonable."}, {"k": "p", "t": 73.69, "s": "Let me start by stating how grateful I am for the benefits this job offers, such as generous paid time off and health benefits. That being said, I am expecting my salary for this position to fall between ___ and ___ annually. My rich background in ___ will play a key role in strengthening the organization."}, {"k": "p", "t": 108.14, "s": "Thank you for asking. I feel that a salary between ___ and ___ is in line with the industry average and reflects my skills and experience level well. I am, however, flexible and open to hearing the company's compensation expectations for this position."}, {"k": "p", "t": 115.67, "s": "Taking into account my experience and the skills I mentioned earlier, which would be very helpful to the team, I'm looking for somewhere between ___ and ___ for this role. But for me, benefits definitely matter as well. Your training programs, the commuter benefits and other perks could definitely allow me to be a bit flexible with salary."}, {"k": "h", "s": "Avoiding giving a salary figure"}, {"k": "p", "t": 155.09, "s": "At this point in my job search, I'm focusing on finding the position that's the best fit for my skills and career. Once I've done that, I'm willing to consider an offer that you feel is fair for the role."}, {"k": "p", "t": 167.35, "s": "Perhaps you could give me an idea of the pay range for this post?"}, {"k": "p", "t": 179.5, "s": "I'm interested in finding a job that is a good fit for me. Actually, I don't have a specific number in mind, so I'd feel more comfortable if you could give me an idea of the salary range."}, {"k": "p", "t": 185.14, "s": "I want this move to be a big step forward for me in terms of both responsibility and compensation. I don't have a specific figure, so could you give me an idea of the current salary for this position?"}, {"k": "p", "t": 201.43, "s": "I'm currently earning a base salary of ___. I don't have a specific number in mind that I'm targeting for this next position, though, and I'm willing to consider an offer that you feel is fair."}, {"k": "h", "s": "For fresh graduates"}, {"k": "p", "t": 209.92, "s": "As a fresh graduate, I want to start my career, upgrade my knowledge and skills, and contribute to the company. I also need to become financially independent, so I will accept what you offer as per the company rules."}, {"k": "p", "t": 232.24, "s": "My first priority is to gain knowledge and improve my skills. I don't have any expectations about salary, but I want to become financially independent, so I will accept as per company standards."}, {"k": "p", "t": 241.75, "s": "I care so much about this job and I'm willing to do my best to succeed with you, so I accept the starting salary of this job, with the availability of benefits and a raise afterwards."}, {"k": "p", "t": 252.87, "s": "I'm more interested in finding a position that's a good fit for my skills and interests. I'm confident that you're offering a salary that's competitive in the current market."}]}, {"title": "6. What attracted you to this position? & Do you have any questions? (p. 29–31)", "src": "audio/phone/book-p29.mp3", "lines": [{"k": "h", "s": "The questions"}, {"k": "p", "t": 12.2, "s": "Why did you choose our company? · Why do you want this job?"}, {"k": "h", "s": "Sample answers"}, {"k": "p", "t": 16.68, "s": "I've always been a fan of X Co.'s products, and your focus on quality is what drew me and other fans to your products."}, {"k": "p", "t": 24.79, "s": "I've followed X Co. on social media for a while, and I've always loved how you interact with your clients, so I was psyched when I came across this posting. I know deep down that I could add special value to a company I already admire."}, {"k": "p", "t": 42.93, "s": "I'm very passionate about ___ and would be thrilled to work for an organization that subscribes to the same core values I believe in. X Company has played an important role throughout history in supporting ___; it's a great honour to be part of that."}, {"k": "p", "t": 64.74, "s": "I'm a big fan of your company. I follow your work and I can see your impact on ___, and that actually inspired me to apply for the job. I love working with a team to achieve a common goal, and I know my background in ___ has prepared me for this role. I look forward to becoming a valued contributor to this phenomenal team."}, {"k": "p", "t": 89.82, "s": "I read an article a few months back on the outreach your company does with ___, and I remember feeling excited about your company's success. That excitement grew when I saw there was a job opening in my field here. I would really love to come to work each day knowing that I'm helping to make a difference in ___ through my work here."}, {"k": "p", "t": 109.57, "s": "I've seen your company consistently listed as one of the top places to work. I've read employee testimonials and heard of your enthusiasm for encouraging employee growth through education, training and vast resources. I would love to join your innovative team, continue to create great work, and grow within the company by learning new skills."}, {"k": "p", "t": 109.57, "s": "I've heard of your reputation in the industry, and I would be proud to work for a company with such an excellent track record and a strong example of leadership in the industry."}, {"k": "p", "t": 130.34, "s": "I have a friend who works in the accounting department. He told me that the culture here is top-notch, and that management supports continuing education and learning on the job while rewarding hard work. Based on his assessment and encouragement, I think I would fit in perfectly with the team here and make an immediate impact."}, {"k": "p", "t": 130.34, "s": "I first found your company several years ago, and I was inspired by the tone and style of your brand. You market yourself to a millennial audience, which I can relate to. After following you and watching your job openings for several years while working my way up at a smaller company, I believe I am now ready to join your exceptional team, enhancing and driving a brand that is a natural extension of my own beliefs."}, {"k": "p", "t": 165.88, "s": "I understand that I am a fresher, but I have always wanted to be part of your organization's workforce, as it promises to be a place where the learning curve is great and hard work is appreciated. This is one of the biggest reasons your organization tops my priority list; I've always looked for organizations like yours to kick-start my career. I assure you that I have the zeal to give 100% to my work and make a noteworthy contribution to this organization."}, {"k": "p", "t": 211.08, "s": "I like the job description, and I also sense that my experience makes me an outstanding match for the job. The position excites me because ___ is my passion, and of course an opportunity at a highly reputed firm like yours is no less than a dream come true."}, {"k": "h", "s": "\"Do you have any questions for me?\""}, {"k": "p", "t": 223.11, "s": "The interviewer may also ask: *Is there anything you need to know while I'm on the line? · Are there any questions I can answer for you before we say goodbye?*"}, {"k": "p", "t": 223.11, "s": "Good questions to ask:"}, {"k": "p", "t": 227.5, "s": "What attributes would I need to be successful in this position?"}, {"k": "p", "t": 231.79, "s": "What gaps are you looking to fill with this role?"}, {"k": "p", "t": 235.35, "s": "Can you tell me about the team I would be part of?"}, {"k": "p", "t": 239.07, "s": "What are the biggest challenges I would face in this job?"}, {"k": "p", "t": 243.22, "s": "What is the most important indicator of success in this position?"}, {"k": "p", "t": 248.29, "s": "What's the career path for someone in this role at this company?"}, {"k": "p", "t": 252.81, "s": "Can you describe your onboarding process?"}, {"k": "p", "t": 256.28, "s": "What metrics or goals would you use to evaluate my performance?"}, {"k": "p", "t": 260.99, "s": "How would you describe the company culture?"}, {"k": "p", "t": 264.38, "s": "How would you describe the ideal candidate?"}, {"k": "p", "t": 267.9, "s": "How does this position contribute to the company overall?"}, {"k": "p", "t": 272.17, "s": "What learning and professional development opportunities are available to your employees?"}, {"k": "p", "t": 278.09, "s": "What is your favorite thing about working for the company?"}, {"k": "p", "t": 282.1, "s": "What are the company's most important values?"}, {"k": "p", "t": 285.82, "s": "What are the next steps in the interview process?"}, {"k": "p", "t": 289.63, "s": "Is there anything else I can provide you with that would be helpful?"}, {"k": "p", "t": 294.06, "s": "What is the one thing I can do to help your company succeed?"}]}];

  const draw=()=>{
    const R=L.reading[cur];
    p.innerHTML=`<div class="hint"><span>🎧</span><span>Press play and follow the text. The line being read lights up; tap any line to jump to it.<br><span class="ar">دوس تشغيل وتابع النص. السطر اللي بيتقري بيتلوّن، واضغط على أي سطر تروحله.</span></span></div>
     <div class="tracks">${L.reading.map((r,i)=>`<button data-k="${i}" aria-pressed="${i===cur}">Part ${i+1}: ${esc(r.title.replace(/^\d+\.\s*/,""))}</button>`).join("")}</div>
     <div class="player"><button class="pp" id="pp" aria-label="Play">${PLAY}</button>
      <div><div class="ttl">${esc(R.title.replace(/^\d+\.\s*/,""))}</div><div class="bar" id="bar"><i id="fill" style="width:0"></i></div></div>
      <div style="display:grid;gap:4px;justify-items:end"><span class="tm" id="tm">0:00</span><button class="sp" id="sp">1×</button></div></div>
     <div class="reader" id="reader">${R.lines.map((l,i)=>l.k==="h"?`<h4>${esc(l.s)}</h4>`:`<span class="ln" data-i="${i}" ${l.t!=null?`data-t="${l.t}"`:""}>${fmtLine(l.s)}</span>`).join("")}</div>
     <div class="actions"><button class="btn" id="go">Next: learn the phrases</button></div>`;
    stopAudio(); AUD=new Audio(R.src); AUD.preload="metadata";
    const pp=p.querySelector("#pp"), fill=p.querySelector("#fill"), tm=p.querySelector("#tm"), lines=[...p.querySelectorAll(".ln[data-t]")];
    let lastNow=null;
    const loop=()=>{ if(!AUD)return; const t=AUD.currentTime, d=AUD.duration||1;
      fill.style.width=(t/d*100)+"%"; tm.textContent=`${fmt(t)} / ${fmt(AUD.duration)}`;
      let now=null; for(const el of lines){ if(+el.dataset.t<=t+.25) now=el; else break }
      if(now!==lastNow){ lastNow&&lastNow.classList.remove("now"); if(now){now.classList.add("now"); const r=now.getBoundingClientRect(); if(r.top<200||r.bottom>innerHeight-40) now.scrollIntoView({block:"center",behavior:"smooth"})} lastNow=now }
      rafId=requestAnimationFrame(loop)};
    AUD.onplay=()=>{pp.innerHTML=PAUSE;pp.setAttribute("aria-label","Pause");loop()};
    AUD.onpause=()=>{pp.innerHTML=PLAY;pp.setAttribute("aria-label","Play");cancelAnimationFrame(rafId)};
    AUD.onended=()=>{S.read[L.id]=true;save(); if(cur<L.reading.length-1){cur++;draw();AUD.play().catch(()=>{})}};
    AUD.onloadedmetadata=()=>tm.textContent=`0:00 / ${fmt(AUD.duration)}`;
    pp.onclick=()=>AUD.paused?AUD.play().catch(()=>{}):AUD.pause();
    const rates=[1,.85,.75,1.15]; let ri=0;
    p.querySelector("#sp").onclick=e=>{ri=(ri+1)%rates.length;AUD.playbackRate=rates[ri];e.target.textContent=rates[ri]+"×"};
    p.querySelector("#bar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); if(AUD.duration)AUD.currentTime=(e.clientX-r.left)/r.width*AUD.duration};
    lines.forEach(el=>el.onclick=()=>{AUD.currentTime=Math.max(0,+el.dataset.t-.2);AUD.play().catch(()=>{})});
    p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    p.querySelector("#go").onclick=()=>{S.read[L.id]=true;save();nextTab()};
  };
  draw();
}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>', PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function fmtLine(s){
  let h=esc(s).replace(/_{3}/g,'<span class="blank" aria-label="blank"></span>').replace(/\[the company\]/g,"<em>[the company]</em>");
  const m=h.match(/^(Susan|Mr\. Allen):\s*/); if(m) h=`<span class="who">${m[1]}:</span>`+h.slice(m[0].length);
  return h;
}

/* ---------- learn ---------- */
function learnTab(p){
  let i=0;
  const draw=()=>{const c=L.cards[i];
    p.innerHTML=`<div class="prog"><i style="width:${(i+1)/L.cards.length*100}%"></i></div>
     <span class="kicker">Phrase ${i+1} of ${L.cards.length} · <span class="ar">عبارة ${i+1} من ${L.cards.length}</span></span>
     <div class="phrase"><h2>${esc(c.en)}</h2>${c.clip?`<button class="say" id="sp" aria-label="Listen from the book">${SPK}</button>`:""}</div>
     <div class="meaning ar">${esc(c.ar)}</div>
     <div class="example"><span class="kicker">Example</span><div>${c.ex}</div></div>
     <p class="tip ar">${esc(c.tip)}</p>
     <div class="actions">${i?'<button class="btn alt" id="bk">Back</button>':""}<button class="btn" id="go">${i<L.cards.length-1?"Next phrase":"Practise these"}</button></div>`;
    const sp=p.querySelector("#sp"); if(sp){sp.onclick=()=>play(c)}
    if(i||tab==="learn") play(c);
    p.querySelector("#go").onclick=()=>{if(i<L.cards.length-1){i++;draw()}else nextTab()};
    const bk=p.querySelector("#bk"); if(bk)bk.onclick=()=>{i--;draw()};
  };
  draw();
}

/* ---------- quiz ---------- */
let SC={};
function quizTab(p){
  let i=0; SC={quiz:0};
  const draw=()=>{const q=L.quiz[i], last=i===L.quiz.length-1;
    const top=`<div class="prog"><i style="width:${i/L.quiz.length*100}%"></i></div><span class="kicker">Question ${i+1} of ${L.quiz.length}</span>`;
    const fb=(ok)=>{if(ok)SC.quiz++; const b=p.querySelector("#fb"); b.hidden=false; b.className="fb "+(ok?"good":"bad");
      b.innerHTML=`<b>${ok?"Correct!":"Not quite"}</b><span class="ar">${esc(q.why)}</span>`; const g=p.querySelector("#go"); g.hidden=false; g.focus();
      g.onclick=()=>{if(last){p.innerHTML=`<div class="done-box"><h2>${SC.quiz} / ${L.quiz.length}</h2><p class="ar">${SC.quiz===L.quiz.length?"ممتاز! كله صح.":"كويس! راجع العبارات اللي غلطت فيها."}</p><div class="actions" style="justify-content:center"><button class="btn alt" id="again">Try again</button><button class="btn" id="nx">Play the match game</button></div></div>`;p.querySelector("#again").onclick=()=>quizTab(p);p.querySelector("#nx").onclick=nextTab}else{i++;draw()}}};
    if(q.type==="order"){ let built=[]; const bank=shuffle(q.words.map((w,k)=>({w,k})));
      p.innerHTML=`${top}<p class="q">Put the words in order</p><div class="built" id="bt"></div><div class="bank" id="bk"></div><div id="fb" hidden></div><div class="actions"><button class="btn" id="ck" disabled>Check</button><button class="btn" id="go" hidden>${last?"See score":"Next"}</button></div>`;
      const d=()=>{p.querySelector("#bt").innerHTML=built.map((b,j)=>`<button class="w" data-j="${j}">${esc(b.w)}</button>`).join("");
        p.querySelector("#bk").innerHTML=bank.map(b=>`<button class="w" data-k="${b.k}" ${built.includes(b)?"disabled":""}>${esc(b.w)}</button>`).join("");
        p.querySelectorAll("#bt .w").forEach(x=>x.onclick=()=>{built.splice(+x.dataset.j,1);d()});
        p.querySelectorAll("#bk .w").forEach(x=>x.onclick=()=>{built.push(bank.find(b=>b.k==x.dataset.k));d()});
        p.querySelector("#ck").disabled=built.length!==q.words.length};
      d(); p.querySelector("#ck").onclick=function(){this.hidden=true;p.querySelectorAll(".w").forEach(w=>w.disabled=true);const ok=built.map(b=>b.w).join(" ")===q.answer;fb(ok);if(!ok)p.querySelector("#fb").innerHTML+=`<div style="margin-top:6px">${esc(q.answer)}</div>`};
      return; }
    const prompt=q.type==="gap"?`<p class="q">${esc(q.sentence).replace("___",'<span class="gap">?</span>')}</p>`:`<p class="q ar">${esc(q.q)}</p>`;
    const arx=/[؀-ۿ]/.test(q.options[0]);
    p.innerHTML=`${top}${prompt}<div class="opts">${q.options.map((o,k)=>`<button class="opt ${arx?"arx":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb" hidden></div><div class="actions"><button class="btn" id="go" hidden>${last?"See score":"Next"}</button></div>`;
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.answer;
      p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
      if(q.type==="gap")p.querySelector(".gap").textContent=q.options[q.answer]; fb(ok)});
  };
  draw();
}

/* ---------- match game ---------- */
function matchTab(p){
  const pairs=L.match.map((x,k)=>({en:x[0],ar:x[1],k})), left=shuffle(pairs), right=shuffle(pairs);
  let sel=null,found=0,t0=Date.now(),miss=0;
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="kicker">Match each word with its meaning, fast</span><p class="q ar" style="margin-top:2px">وصّل كل كلمة بمعناها بأسرع وقت</p></div><span class="timer" id="tmr">0.0s</span></div>
   <div class="board"><div class="col">${left.map(x=>`<button class="tile" data-k="${x.k}" data-s="en">${esc(x.en)}</button>`).join("")}</div><div class="col">${right.map(x=>`<button class="tile ar" data-k="${x.k}" data-s="ar">${esc(x.ar)}</button>`).join("")}</div></div>`;
  clearInterval(tick); tick=setInterval(()=>{const e=document.getElementById("tmr"); if(!e){clearInterval(tick);return} e.textContent=((Date.now()-t0)/1000).toFixed(1)+"s"},100);
  p.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
    if(sel.dataset.k===b.dataset.k){[sel,b].forEach(x=>x.classList.add("gone"));found++;sel=null;
      if(found===pairs.length){clearInterval(tick);const s=(Date.now()-t0)/1000;SC.time=s;
        setTimeout(()=>{p.innerHTML=`<div class="done-box"><h2>${s.toFixed(1)}s</h2><p>${miss} mistakes · ${s<20?"Lightning fast ⚡":"Try to beat your time!"}</p><div class="actions" style="justify-content:center"><button class="btn alt" id="again">Play again</button><button class="btn" id="nx">Role-play</button></div></div>`;p.querySelector("#again").onclick=()=>matchTab(p);p.querySelector("#nx").onclick=nextTab},400)}}
    else{miss++;const a=sel;[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("shake")});setTimeout(()=>[a,b].forEach(x=>x.classList.remove("shake")),320);sel=null}});
}

/* ---------- role-play ---------- */
function talkTab(p){
  const turns=L.roleplay.turns; let hist=[],idx=0,good=0; const total=turns.filter(t=>t.you).length;
  const draw=()=>{while(idx<turns.length&&turns[idx].them){hist.push({w:"them",t:turns[idx].them});idx++}
    const cur=turns[idx];
    p.innerHTML=`<div class="scene"><span class="kicker">The situation</span><div class="ar">${esc(L.roleplay.scene)}</div></div>
     <div class="chat">${hist.map(h=>`<div class="msg ${h.w}"><small>${h.w==="them"?"Them":"You"}</small>${esc(h.t)}</div>`).join("")}</div>
     ${cur?`<p class="kicker" style="margin-top:14px">What do you say?</p><div class="opts">${shuffle(cur.you.map((o,k)=>({...o,k}))).map(o=>`<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div>`:""}
     <div id="fb" hidden></div><div class="actions"><button class="btn" id="go" ${cur?"hidden":""}>${cur?"Continue":"Finish the lesson"}</button></div>`;
    if(!cur){p.querySelector("#go").onclick=()=>finish(p,good,total);return}
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=cur.you[+b.dataset.k];
      p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(cur.you[+x.dataset.k].ok)x.classList.add("right")}); if(!o.ok)b.classList.add("wrong"); else good++;
      const f=p.querySelector("#fb");f.hidden=false;f.className="fb "+(o.ok?"good":"bad");f.innerHTML=`<b>${o.ok?"Great answer":"There's a better reply"}</b><span class="ar">${esc(o.fb)}</span>`;
      const g=p.querySelector("#go");g.hidden=false;g.focus();g.onclick=()=>{hist.push({w:"you",t:cur.you.find(x=>x.ok).t});idx++;draw()}});
  };
  draw();
}
function finish(p,good,total){
  const first=!S.done[L.id], gain=20+(SC.quiz||0)*5+good*5+((SC.time||99)<20?10:0);
  S.xp+=gain; S.done[L.id]=true; bump(); save(); stats();
  const nxt=real().find(l=>!S.done[l.id]);
  p.innerHTML=`<div class="done-box"><h2>Lesson complete 🎉</h2><p class="ar">برافو! خلّصت «${esc(L.ar)}»${first?"، والعبارات اتضافت لـ My phrases.":"."}</p>
   <div class="score"><div><b>+${gain}</b><span>XP</span></div><div><b>${SC.quiz??"–"}/${L.quiz.length}</b><span>Practice</span></div><div><b>${SC.time?SC.time.toFixed(1)+"s":"–"}</b><span>Match game</span></div><div><b>${good}/${total}</b><span>Role-play</span></div></div>
   <div class="actions" style="justify-content:center">${nxt?`<a class="btn" href="#/lesson/${nxt.id}">Next lesson: ${esc(nxt.title)}</a>`:`<a class="btn" href="#/path">Back to the path</a>`}</div></div>`;
}

route();
</script>
