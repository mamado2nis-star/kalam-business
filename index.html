57.9],"OK.":[258.35,259.16],"(Step 2) Apologize and commit to a fix.":[259.61,262.54],"I apologize for the delay, and I am committed to making things right. The shipment will arrive on Monday.":[262.99,270.17],"Sorry, these things happen.":[270.62,272.26],"Maybe it will come.":[272.71,274.03],"(Step 3) Close the email.":[274.48,276.31],"Please let me know if there's anything else we can do to make things right. Best regards,":[276.76,282.12],"Don't complain again.":[282.57,283.96],"Bye.":[284.41,285.09]},"em3":{"Heba is the IT security officer at a pharmaceutical company in 6th of October City.":[0.0,6.65],"On Sunday morning, twelve employees received a fake email. It looked like it came from IT: \"Your password expires today. Click here.\"":[7.1,16.32],"It was phishing. Two people clicked the link and typed their passwords.":[16.77,20.84],"Heba acted fast. She reset both passwords and checked the servers for ransomware. Nothing was encrypted — the backups were safe.":[21.29,30.15],"Then she wrote to all staff: \"It's important to note that IT will never ask for your password by email.\"":[30.6,37.17],"\"As a result of this attack, we will turn on multi-factor authentication for every account.\"":[37.62,43.67],"\"All laptops must install the new security patch by EOD today.\"":[44.12,48.62],"\"Please don't hesitate to reach out if you have any questions.\" And she ended with \"Best regards, Heba\".":[49.07,55.46],"Next, she wrote a formal letter to the company's bank, because one of the two users worked in finance.":[55.91,62.46],"\"Could you please confirm that you've received this message?\" she wrote. This time, she ended with \"Sincerely\".":[62.91,69.41],"The bank confirmed in twenty minutes. No money moved, and on Monday, every employee had a two-minute training on how to spot phishing.":[69.86,78.65],"phishing":[79.1,79.89],"ransomware":[80.34,81.28],"backup":[81.73,82.52],"patch":[82.97,83.67],"MFA (multi-factor authentication)":[84.12,86.85],"What is Heba's job?":[87.3,88.78],"IT security officer at a pharmaceutical company.":[89.23,93.13],"What did the fake email say?":[93.58,95.34],"\"Your password expires today. Click here.\"":[95.79,98.49],"What kind of attack was it?":[98.94,100.4],"Phishing.":[100.85,101.64],"How many people typed their passwords?":[102.09,104.28],"Two people.":[104.73,105.68],"Were the backups safe?":[106.13,107.41],"Yes, nothing was encrypted — the backups were safe.":[107.86,111.22],"Will IT ever ask for your password by email?":[111.67,114.75],"Never. It's important to note that.":[115.2,117.19],"What will happen as a result of the attack?":[117.64,120.13],"Multi-factor authentication for every account.":[120.58,123.66],"When must the patch be installed?":[124.11,125.93],"By EOD — by the end of the day today.":[126.38,128.59],"How did she close the email to staff?":[129.04,131.24],"\"Best regards\" — friendly but professional.":[131.69,134.41],"Why did she write to the bank?":[134.86,136.45],"Because one of the two users worked in finance.":[136.9,139.76],"What did she ask the bank?":[140.21,141.74],"\"Could you please confirm that you've received this message?\"":[142.19,145.55],"How did she close the formal letter?":[146.0,148.06],"\"Sincerely\" — more formal.":[148.51,150.27],"Did any money move?":[150.72,152.0],"No. And on Monday everyone had phishing training.":[152.45,155.62],"Best regards,":[156.07,157.29],"Sincerely,":[157.74,158.78],"Please don't hesitate to reach out if you have any questions.":[159.23,162.72],"Could you please confirm that you've received this message?":[163.17,166.39],"EOD — end of day":[166.84,168.09],"It's important to note that":[168.54,170.11],"As a result,":[170.56,171.66],"For your information":[172.11,173.5],"Finish your items":[173.95,175.27],"Fix your issue":[175.72,176.92],"Cheers,":[177.37,178.2],"See you later,":[178.65,179.71],"The shipment was late. As a result, we missed the deadline.":[180.16,183.85],"Please don't hesitate to reach out":[184.3,186.43],"ASAP":[186.88,187.96],"EOD":[188.41,189.08],"FYI":[189.53,190.46],"TBD":[190.91,191.9],"OOO":[192.35,193.03],"ETA":[193.48,194.15],"(1) He's emailing a new client for the first time. Which closing?":[194.6,198.77],"Cheers mate,":[199.22,200.22],"Later,":[200.67,201.43],"(2) He wants the report today before he leaves. Which line?":[201.88,205.72],"Could you please send the report by EOD?":[206.17,208.67],"Send it NOW.":[209.12,210.13],"Send it sometime.":[210.58,211.82],"(3) He wants to connect two ideas: the supplier was late, so the launch moved.":[212.27,217.62],"The supplier was late. As a result, we moved the launch.":[218.07,221.59],"The supplier was late. For instance, we moved the launch.":[222.04,225.49],"The supplier was late. Similarly, we moved the launch.":[225.94,229.22]},"em4":{"Ziad sells solar systems to farms in Minya. The farmers love free power in the day, but at night their pumps still run on diesel.":[0.0,9.24],"Ziad found a company that makes battery energy storage systems — big lithium batteries in a container.":[9.69,16.68],"He wrote to their sales director: \"I wanted to take a moment to introduce myself. I'm Ziad, and my company has installed solar on sixty farms.\"":[17.13,27.25],"\"I believe there may be potential synergies between our organizations: we have the farms, and you have the batteries.\"":[27.7,35.23],"They met in Cairo. The director liked the idea, and they agreed on a pilot farm.":[35.68,41.25],"The next day, Ziad wrote again: \"I wanted to follow up on our meeting. As per our recent discussion, we will start with one farm: 200 kWh of storage and a hybrid inverter.\"":[41.7,55.05],"\"To keep the momentum going, I'd like to propose the following next steps: a site visit next week, then a price offer.\"":[55.5,63.72],"\"Could you kindly provide the following information? The cycle life of the batteries, the warranty, and the delivery time.\"":[64.17,72.26],"\"We appreciate your prompt attention to this matter.\"":[72.71,75.71],"Three months later, the pilot farm ran its pumps all night on solar energy stored in the batteries.":[76.16,82.56],"The farmer saved 60% on diesel — and his neighbours started calling Ziad.":[83.01,88.39],"BESS (battery energy storage system)":[88.84,91.21],"kWh":[91.66,92.94],"hybrid inverter":[93.39,94.73],"cycle life":[95.18,96.25],"diesel savings":[96.7,97.92],"Where are Ziad's customers?":[98.37,100.1],"On farms in Minya.":[100.55,101.98],"What runs the pumps at night?":[102.43,104.18],"Diesel — the sun is gone.":[104.63,106.27],"What does the other company make?":[106.72,108.61],"Battery energy storage systems.":[109.06,111.33],"How did Ziad start his first email?":[111.78,114.11],"\"I wanted to take a moment to introduce myself.\"":[114.56,117.46],"What synergies did he see?":[117.91,119.59],"He has the farms, and they have the batteries.":[120.04,122.62],"What did they agree in Cairo?":[123.07,124.81],"A pilot farm.":[125.26,126.45],"How much storage for the pilot?":[126.9,128.73],"200 kWh, with a hybrid inverter.":[129.18,132.59],"How did he write about the meeting?":[133.04,134.86],"\"I wanted to follow up on our meeting. As per our recent discussion…\"":[135.31,139.65],"Why did he propose next steps?":[140.1,142.0],"To keep the momentum going.":[142.45,144.26],"What information did he ask for?":[144.71,146.78],"Cycle life, warranty and delivery time.":[147.23,150.01],"What did he appreciate?":[150.46,151.92],"Their prompt attention to this matter.":[152.37,154.43],"How much diesel did the farmer save?":[154.88,157.02],"Could you kindly provide the following information?":[157.47,160.34],"We appreciate your prompt attention to this matter.":[160.79,163.76],"I wanted to take a moment to introduce myself.":[164.21,166.96],"There may be potential synergies between our organizations.":[167.41,171.25],"I wanted to follow up on our meeting.":[171.7,173.78],"To keep the momentum going, I'd like to propose the following next steps.":[174.23,179.09],"As per our recent discussion":[179.54,181.44],"Send prices.":[181.89,183.05],"What's the price, man?":[183.5,184.85],"As per our recent discussion, please find the quotation attached.":[185.3,189.61],"I wanted to follow up on our meeting":[190.06,192.14],"Answer quickly.":[192.59,193.74],"Whatever.":[194.19,195.03],"inquiry":[195.48,196.26],"quotation":[196.71,197.68],"proposal":[198.13,199.05],"follow up":[199.5,200.46],"bulk purchase":[200.91,202.06],"warranty":[202.51,203.4],"(Step 1) Open the follow-up email.":[203.85,206.33],"I hope you're doing well. I wanted to follow up on our meeting on Monday.":[206.78,211.17],"Did you forget me?":[211.62,212.89],"Why didn't you call?":[213.34,214.61],"(Step 2) Suggest what happens next.":[215.06,217.45],"Tell me what to do.":[217.9,219.12],"Let's wait.":[219.57,220.52],"(Step 3) Mention the quotation.":[220.97,223.1],"As per our recent discussion, please find the detailed quotation attached.":[223.55,228.62],"Price is in file.":[229.07,230.41],"Look at the attachment.":[230.86,232.25]},"em5":{"Salma is the service coordinator at a company that maintains UPS systems. She manages sixty annual maintenance contracts.":[0.0,9.13],"A bank's UPS needs new batteries. To replace them safely, the UPS must go to maintenance bypass for four hours.":[9.58,18.33],"Nobody likes a shutdown, so Salma wrote carefully: \"Here are my proposed dates and times: Friday the 10th from 6 a.m., or Saturday the 11th from 10 p.m.\"":[18.78,31.3],"\"Please let me know which option works best for you.\" The bank chose Friday morning.":[31.75,36.81],"The battery replacement went perfectly. The team finished in three hours.":[37.26,41.97],"The next week, Salma sent an email to all customers: \"We're excited to announce our new 24/7 hotline for UPS emergencies.\"":[42.42,52.7],"She also added a short survey: \"Your input is invaluable. Tell us how we can serve you better.\"":[53.15,59.65],"But one customer, a plastics factory, had not paid for its preventive maintenance visit two months ago.":[60.1,67.18],"Salma didn't get angry. She wrote: \"This is a gentle reminder that your invoice remains unpaid.\"":[67.63,74.37],"\"Please kindly arrange for the payment by the end of the month.\"":[74.82,78.59],"She ended with \"Thank you for your business.\" The payment arrived four days later.":[79.04,84.04],"AMC (annual maintenance contract)":[84.49,86.78],"preventive maintenance (PM)":[87.23,89.31],"battery replacement":[89.76,91.18],"maintenance bypass":[91.63,93.1],"24/7 hotline":[93.55,95.86],"What does Salma's company maintain?":[96.31,98.38],"UPS systems — sixty annual contracts.":[98.83,102.09],"What does the bank's UPS need?":[102.54,104.57],"New batteries.":[105.02,106.08],"How long must the UPS be on bypass?":[106.53,109.07],"Four hours.":[109.52,110.61],"Did Salma choose the date herself?":[111.06,113.14],"No, she sent proposed dates and times.":[113.59,116.12],"What did she ask the bank?":[116.57,118.1],"Which option works best for them.":[118.55,120.42],"Which option did the bank choose?":[120.87,122.88],"Friday morning.":[123.33,124.44],"How long did the job take?":[124.89,126.63],"Three hours — one hour early.":[127.08,128.99],"What were they excited to announce?":[129.44,131.39],"A new 24/7 hotline for UPS emergencies.":[131.84,136.34],"Why did she add a survey?":[136.79,138.36],"Because customers' input is invaluable.":[138.81,141.52],"Who didn't pay?":[141.97,143.07],"A plastics factory.":[143.52,144.87],"Was her reminder angry?":[145.32,146.9],"No, it was a gentle reminder.":[147.35,149.43],"How did she end the email?":[149.88,151.55],"\"Thank you for your business.\"":[152.0,153.59],"When did the payment arrive?":[154.04,155.68],"Four days later.":[156.13,157.36],"Here are my proposed dates and times.":[157.81,160.12],"Please let me know which option works best for you.":[160.57,163.44],"We're excited to announce":[163.89,165.53],"Your input is invaluable.":[165.98,167.95],"This is a gentle reminder that your invoice remains unpaid.":[168.4,172.63],"Please kindly arrange for the payment.":[173.08,175.31],"Thank you for your business.":[175.76,177.34],"You didn't pay!":[177.79,178.85],"Pay or else.":[179.3,180.35],"Your input is invaluable in helping us improve.":[180.8,184.26],"Please let me know which option works best":[184.71,187.19],"Meeting tomorrow 9am. Come.":[187.64,190.08],"I'd like to request a meeting. Here are my proposed dates and times.":[190.53,194.84],"When are you free? Any time.":[195.29,197.07],"invoice":[197.52,198.34],"due date":[198.79,199.69],"outstanding":[200.14,201.15],"survey":[201.6,202.39],"announce":[202.84,203.66],"appointment":[204.11,205.04],"(Step 1) Open the reminder.":[205.49,207.51],"I hope this email finds you well. This is a gentle reminder that invoice #204 remains unpaid.":[207.96,215.71],"You owe us money.":[216.16,217.38],"Hi, pay please.":[217.83,219.11],"(Step 2) Ask for payment.":[219.56,221.42],"Please kindly arrange for the payment at your earliest convenience via bank transfer.":[221.87,227.43],"Pay today or we stop working.":[227.88,229.91],"If you want, you can pay.":[230.36,231.91],"(Step 3) Close the email.":[232.36,234.19],"If you have already made the payment, please ignore this message. Thank you for your business.":[234.64,240.33],"We are waiting.":[240.78,241.74],"Bye.":[242.19,242.87]},"em6":{"Adel has worked for eight years with UPS systems and solar inverters. He wants to join a company that designs its own products.":[0.0,9.14],"One day, he got an email: \"We're excited to invite you to our upcoming event: the Egypt Energy exhibition, booth 12.\"":[9.59,18.13],"At booth 12, a company was showing a new hybrid inverter. It could run from solar, batteries or the grid — and switch between them in milliseconds.":[18.58,28.86],"Adel asked so many good questions that the product manager gave him her card.":[29.31,34.51],"A week later, she wrote again: \"This is just a friendly reminder that the deadline for our field engineer position is fast approaching.\"":[34.96,43.71],"Adel sent his CV the same evening: \"I am writing to express my interest in the position of senior field engineer.\"":[44.16,52.1],"\"With eight years of UPS and inverter experience, I believe I would be a great fit for the role.\"":[52.55,59.19],"\"Thank you for considering my application.\"":[59.64,62.24],"The HR manager replied: \"I wanted to acknowledge receipt of your message. The team will review it this week.\"":[62.69,70.1],"Two days later: \"Would you be available for a 15–20 minute call on Thursday?\"":[70.55,75.6],"On the call, they asked him to explain how a hybrid inverter works off-grid. Adel explained it clearly — and in simple English.":[76.05,84.79],"He got the job.":[85.24,86.5],"exhibition booth":[86.95,88.24],"hybrid inverter":[88.69,90.03],"demo":[90.48,91.2],"grid":[91.65,92.37],"off-grid":[92.82,93.75],"How long has Adel worked with UPS and inverters?":[94.2,97.64],"Eight years.":[98.09,99.05],"What was he invited to?":[99.5,101.01],"The Egypt Energy exhibition, booth 12.":[101.46,104.26],"What was shown at booth 12?":[104.71,106.4],"A new hybrid inverter.":[106.85,108.43],"What can the inverter run from?":[108.88,110.7],"Solar, batteries or the grid.":[111.15,112.99],"Why did the product manager give him her card?":[113.44,116.19],"Because he asked so many good questions.":[116.64,118.87],"What was the friendly reminder about?":[119.32,121.61],"The deadline for the position was fast approaching.":[122.06,125.02],"When did he send his CV?":[125.47,127.14],"The same evening.":[127.59,128.77],"How did his email begin?":[129.22,130.95],"\"I am writing to express my interest in the position.\"":[131.4,134.47],"Why is he a great fit?":[134.92,136.42],"Eight years of UPS and inverter experience.":[136.87,140.34],"What did HR do first?":[140.79,142.5],"Acknowledged receipt of his message.":[142.95,145.15],"How long was the call?":[145.6,147.06],"15 to 20 minutes.":[147.51,149.12],"What did he explain on the call?":[149.57,151.4],"How a hybrid inverter works off-grid.":[151.85,154.33],"Did he get the job?":[154.78,156.11],"Yes, he did!":[156.56,157.56],"We're excited to invite you to our upcoming event.":[158.01,161.11],"This is just a friendly reminder that the deadline is fast approaching.":[161.56,166.03],"I am writing to express my interest in the position.":[166.48,169.56],"I believe I would be a great fit for the role.":[170.01,172.69],"Thank you for considering my application.":[173.14,175.64],"I wanted to acknowledge receipt of your message.":[176.09,178.89],"Would you be available for a 15–20 minute call?":[179.34,182.33],"I want job.":[182.78,183.91],"I am writing to express my interest in the Sales Engineer position.":[184.36,188.57],"Hire me please.":[189.02,190.25],"The deadline is fast approaching on Friday.":[190.7,193.39],"Thank you for considering my application":[193.84,196.34],"Give me a job.":[196.79,197.99],"Would you be available for a 15–20 minute call next week?":[198.44,202.13],"Call me now.":[202.58,203.57],"RSVP":[204.02,205.22],"deadline":[205.67,206.53],"cover letter":[206.98,207.89],"résumé":[208.34,209.21],"networking":[209.66,210.63],"acknowledge":[211.08,212.02],"(Step 1) First sentence.":[212.47,214.16],"I am writing to express my interest in the Social Media Coordinator position advertised on LinkedIn.":[214.61,221.52],"I saw your job. I want it.":[221.97,223.7],"Hello, are you hiring?":[224.15,225.57],"(Step 2) Show why you fit.":[226.02,227.71],"In my previous role, I increased engagement by 25%, so I believe I would be a great fit for the role.":[228.16,235.97],"I use Facebook every day.":[236.42,238.15],"I'm the best.":[238.6,239.62],"(Step 3) Close.":[240.07,241.41],"Please find my résumé attached. Thank you for considering my application. Sincerely,":[241.86,247.96],"Waiting your call.":[248.41,249.65],"Thanks bye":[250.1,251.11]},"ex1":{"Sherif is interviewing for director of engineering at a large telecom company.":[0.0,5.4],"The CEO began, \"I've heard great things about your work on the Smart Village data centre.\"":[5.85,11.56],"\"Thank you,\" said Sherif. \"I started as a site electrician twenty years ago, and I worked my way up to my current role.\"":[12.01,19.7],"\"I have a diverse background in the industry: power, cooling, networks — and a few years in sales.\"":[20.15,26.73],"Then he told the story. The data centre was a Tier III project, and the client wanted it running in forty days.":[27.18,34.82],"It was a complex project with many moving parts: two generators, four UPS modules, six chillers, fire suppression and three hundred racks.":[35.27,45.78],"Every supplier had a different schedule. The generators arrived late, and the chillers arrived early with no place to put them.":[46.23,54.35],"Sherif held a stand-up meeting every morning at seven. Every problem had an owner and a deadline.":[54.8,61.3],"For commissioning, his team tested everything with load banks: they cut the utility power again and again and watched the UPS and generators take over.":[61.75,72.42],"The handover was on day thirty-nine. The client signed two more sites, and it had a significant impact on the company's bottom line.":[72.86,81.61],"\"In the same year, I led my team to exceed sales targets by thirty percent.\"":[82.06,87.17],"At the end, Sherif said, \"I'd like to reiterate my enthusiasm for the role. I'd love to build your next ten sites.\"":[87.62,95.46],"Tier III":[95.91,97.11],"commissioning":[97.56,98.46],"fire suppression":[98.91,100.08],"load bank":[100.53,101.47],"handover":[101.92,102.83],"What role is Sherif interviewing for?":[103.28,105.41],"Director of engineering at a telecom company.":[105.86,108.97],"What has the CEO heard?":[109.42,111.02],"Great things about his work on the Smart Village data centre.":[111.47,115.26],"How did Sherif start?":[115.71,117.1],"As a site electrician. He worked his way up.":[117.55,120.56],"Is his background narrow?":[121.01,122.53],"No, it's diverse: power, cooling, networks and sales.":[122.98,126.84],"How many days did the client give him?":[127.29,129.49],"Forty days.":[129.94,131.03],"Was it a simple project?":[131.48,133.12],"No. It was a complex project with many moving parts.":[133.57,137.33],"Which equipment arrived late?":[137.78,139.56],"The generators.":[140.01,141.2],"When was the daily meeting?":[141.65,143.22],"Every morning at seven.":[143.67,145.1],"What did they test with during commissioning?":[145.55,147.78],"Load banks — they cut the power again and again.":[148.23,151.15],"When was the handover?":[151.6,153.06],"On day thirty-nine — one day early.":[153.51,156.01],"What was the impact on the company?":[156.46,158.52],"A significant impact on the bottom line — two more sites.":[158.97,162.67],"What did he want to reiterate?":[163.12,164.89],"His enthusiasm for the role.":[165.34,167.31],"I've heard great things about your work.":[167.76,169.93],"I worked my way up to my current role.":[170.38,172.66],"It had a significant impact on the company's bottom line.":[173.11,176.77],"It was a complex project with many moving parts.":[177.22,180.38],"I'd like to reiterate my enthusiasm for the role.":[180.83,184.06],"I have a diverse background in the industry.":[184.51,187.1],"I led my team to exceed sales targets.":[187.55,190.16],"I started as an analyst and worked my way up to manager.":[190.61,194.4],"It was a complex project with many moving parts":[194.85,198.01],"No. Bye.":[198.46,199.45],"I'd like to reiterate my enthusiasm for the role and how well my experience fits it.":[199.9,205.52],"When will I get the salary?":[205.97,207.65],"I worked in many places.":[208.1,209.83],"I have a diverse background in sales, and I led my team to exceed targets.":[210.28,215.43],"I worked for 15 years.":[215.88,217.6],"bottom line":[218.05,219.08],"entry-level":[219.53,220.5],"track record":[220.95,221.94],"reiterate":[222.39,223.36],"asset":[223.81,224.58],"revenue":[225.03,225.85],"Can you tell us about your background in the industry?":[226.3,229.51],"I have a diverse background. I started as an entry-level analyst and worked my way up to product manager, launching several successful products.":[229.96,240.34],"It's on my LinkedIn.":[240.79,242.21],"I've done everything.":[242.66,244.03],"Tell us about a challenging project.":[244.48,246.77],"It was a complex project with many moving parts. I set a clear plan and checked in with all teams regularly.":[247.22,254.92],"All my projects are easy.":[255.37,257.12],"It failed, so I left.":[257.57,259.05],"Is there anything else you'd like us to know?":[259.5,262.14],"I'd like to reiterate my enthusiasm for this role. I believe my experience aligns well with it.":[262.59,269.35],"No.":[269.8,270.46],"How many days off do I get?":[270.91,272.52]},"ex2":{"Nour is a data-centre engineer at a bank in Cairo. Her team runs 120 servers in two rooms.":[0.0,7.55],"In July, two database servers in rack 7 started shutting down every afternoon at about 3 p.m.":[8.0,15.83],"The software team said, \"It's the hardware.\" The hardware vendor said, \"It's your software.\" Everyone was angry.":[16.28,23.39],"Nour stayed calm and composed. She avoided getting defensive or personal and said, \"Let's find the root cause first.\"":[23.84,31.94],"She checked the server logs. Every shutdown had the same message: thermal shutdown — CPU over temperature.":[32.39,39.75],"So it wasn't the software. The servers were overheating.":[40.2,43.68],"She measured the air in front of the rack: 38°C. It should be below 27.":[44.13,50.07],"The root cause was simple. The empty spaces in the rack had no blanking panels, so hot air from the back came round to the front. And one server fan had failed.":[50.52,61.86],"Nour explained it clearly, both verbally in the meeting and in writing, in a short report with photos.":[62.31,69.28],"Then she proposed a win-win solution: the vendor replaced the fan under warranty, facilities installed blanking panels and cold-aisle containment, and the software team moved its heavy batch job to 2 a.m.":[69.73,84.49],"In one week, the project was back on track. There were no shutdowns for ninety days — and her manager called her a natural leader.":[84.94,93.25],"rack":[93.7,94.39],"thermal shutdown":[94.84,96.07],"blanking panel":[96.52,97.64],"cold-aisle containment":[98.09,99.66],"under warranty":[100.11,101.29],"batch job":[101.74,102.8],"Where does Nour work?":[103.25,104.47],"In the data centre of a bank in Cairo.":[104.92,107.58],"When did the servers shut down?":[108.03,109.86],"Every afternoon at about 3 p.m.":[110.31,112.84],"Did the teams agree?":[113.29,114.59],"No. The software team blamed the hardware, and the vendor blamed the software.":[115.04,119.98],"Did Nour get angry too?":[120.43,121.99],"No. She stayed calm and composed.":[122.44,124.63],"Did she get personal?":[125.08,126.44],"No, she avoided getting defensive or personal.":[126.89,130.06],"What did she want to find first?":[130.51,132.29],"The root cause.":[132.74,133.89],"What did the logs say?":[134.34,135.7],"Thermal shutdown — CPU over temperature.":[136.15,139.31],"Was it a software problem?":[139.76,141.46],"No. The servers were overheating.":[141.91,144.07],"How hot was the air in front of the rack?":[144.52,146.88],"38°C — it should be below 27.":[147.33,150.92],"Why was hot air coming to the front?":[151.37,153.49],"Because there were no blanking panels in the empty spaces.":[153.94,157.53],"How did she explain it?":[157.98,159.32],"Clearly, both verbally in the meeting and in writing, with photos.":[159.77,163.94],"Who paid for the new fan?":[164.39,165.92],"Nobody — the vendor replaced it under warranty. A win-win solution.":[166.37,170.89],"When does the batch job run now?":[171.34,173.33],"At 2 a.m., when the servers are cooler and less busy.":[173.78,177.61],"What did her manager call her?":[178.06,179.85],"A natural leader — the project was back on track in one week.":[180.3,184.47],"I consider myself a natural leader.":[184.92,187.52],"I can express myself clearly, both verbally and in writing.":[187.97,191.95],"I try to understand the root cause of the problem.":[192.4,195.33],"I try to stay calm and composed.":[195.78,197.93],"I avoid getting defensive or personal.":[198.38,201.06],"I always strive for a win-win solution.":[201.51,203.93],"We were able to get the project back on track.":[204.38,207.15],"I ignore him.":[207.6,208.71],"I try to understand his perspective, stay professional, and look for a win-win solution.":[209.16,214.95],"I complain to the manager immediately.":[215.4,217.91],"I avoid getting defensive or personal":[218.36,221.04],"I told him he was wrong.":[221.49,223.11],"I listened carefully and empathized with his situation.":[223.56,227.38],"I hung up.":[227.83,228.79],"root cause":[229.24,230.3],"composed":[230.75,231.66],"defensive":[232.11,233.11],"win-win":[233.56,234.39],"stakeholders":[234.84,235.97],"back on track":[236.42,237.56],"How would you describe yourself?":[238.01,239.9],"I consider myself a natural leader. I can express myself clearly, both verbally and in writing, and I'm highly organized.":[240.35,249.03],"I'm a nice guy.":[249.48,250.72],"Ask my friends.":[251.17,252.4],"How do you handle a project that's behind schedule?":[252.85,255.77],"I stay calm, find the root cause, and set clear goals and weekly meetings to get the project back on track.":[256.22,263.34],"I panic.":[263.79,264.71],"I blame the team.":[265.16,266.46],"And if you disagree with your manager?":[266.91,269.03],"I try to understand their perspective, avoid getting defensive or personal, and look for a win-win solution.":[269.48,276.81],"I do it my way anyway.":[277.26,278.91],"I quit.":[279.36,280.2]},"ex3":{"Youssef is the O&M manager at a 50 MW solar plant in Benban, near Aswan. His team keeps 150,000 panels and 20 inverters running.":[0.0,12.55],"In April, the plant produced 18% less energy than planned. The owners wanted answers — fast.":[13.0,19.97],"Youssef didn't guess. He took a data-driven approach and compared every inverter and every string in the monitoring system.":[20.42,28.27],"The data showed three problems. First, a sandstorm had covered the panels with dust.":[28.72,34.54],"Second, twelve strings were producing zero current. Their fuses had blown.":[34.99,39.9],"Third, inverter 14 kept tripping with an insulation fault. Water had got into a DC junction box, and a cable was damaged.":[40.35,49.58],"There were too many jobs, so he analyzed the urgency and importance of each task.":[50.03,55.44],"He focused on the 20% of tasks that had the greatest impact. Inverter 14 came first, because one inverter is 5% of the whole plant.":[55.89,66.11],"He also implemented a daily check-in meeting: fifteen minutes at 7 a.m., before the sun gets too hot.":[66.56,74.06],"Youssef stays current by reading industry news and publications, so he knew about robots that clean panels without water. He proposed a pilot.":[74.51,84.4],"He keeps an eye on the market, too. Panel prices were falling, so replacing the damaged modules was cheap.":[84.85,92.5],"By the end of May, the plant was back to 99% of its target.":[92.95,97.37],"O&M":[97.82,98.73],"inverter":[99.18,100.03],"string":[100.48,101.28],"insulation fault":[101.73,103.04],"junction box":[103.49,104.74],"SCADA / monitoring":[105.19,106.82],"Where is Youssef's plant?":[107.27,108.8],"In Benban, near Aswan.":[109.25,110.87],"How big is it?":[111.32,112.44],"50 MW — 150,000 panels and 20 inverters.":[112.89,118.11],"How much less energy did it produce in April?":[118.56,121.42],"18% less than planned.":[121.87,123.86],"Did Youssef guess the problem?":[124.31,126.15],"No. He took a data-driven approach.":[126.6,129.01],"What covered the panels?":[129.46,130.94],"Dust from a sandstorm.":[131.39,132.82],"Why were twelve strings producing zero current?":[133.27,135.97],"Because their fuses had blown.":[136.42,138.27],"What fault did inverter 14 show?":[138.72,140.97],"An insulation fault — water had got into a DC junction box.":[141.42,145.86],"Did he do every job at the same time?":[146.31,148.72],"No. He analyzed the urgency and importance of each task.":[149.17,153.09],"Why did inverter 14 come first?":[153.54,155.81],"Because it had the greatest impact — one inverter is 5% of the plant.":[156.26,161.1],"When is the daily check-in meeting?":[161.55,163.6],"At 7 a.m., for fifteen minutes, before the sun gets too hot.":[164.05,168.55],"How does he stay current?":[169.0,170.43],"By reading industry news and publications.":[170.88,173.95],"What do the new robots clean with?":[174.4,176.39],"No water at all — they clean panels dry.":[176.84,179.58],"Why was replacing the modules cheap?":[180.03,182.34],"He keeps an eye on the market — panel prices were falling.":[182.79,186.55],"Where was the plant by the end of May?":[187.0,189.08],"Back to 99% of its target.":[189.53,192.0],"I stay current by reading industry news and publications.":[192.45,196.16],"I keep an eye on the market.":[196.61,198.39],"I took a data-driven approach.":[198.84,200.87],"I implemented a daily check-in meeting.":[201.32,203.88],"I analyze the urgency and importance of each task.":[204.33,207.82],"I focus on the 20% of tasks that have the greatest impact.":[208.27,212.6],"My long-term goal is to advance to a leadership position.":[213.05,216.89],"I don't need to.":[217.34,218.42],"I read industry news, attend webinars, and follow key influencers on social media.":[218.87,225.09],"My friends tell me.":[225.54,226.82],"I took a data-driven approach":[227.27,229.31],"I set clear goals and regular check-ins.":[229.76,232.27],"I work alone.":[232.72,233.88],"I extend every deadline.":[234.33,236.14],"stay current":[236.59,237.64],"webinar":[238.09,238.94],"newsletter":[239.39,240.27],"data-driven":[240.72,241.73],"priority":[242.18,243.11],"check-in":[243.56,244.4],"How do you keep up to date with changes in the industry?":[244.85,247.97],"I stay current by reading industry news, attending webinars and conferences, and staying active in my professional network.":[248.42,256.67],"Google.":[257.12,257.84],"I don't have time.":[258.29,259.54],"How do you handle competing priorities?":[259.99,262.42],"I analyze the urgency and importance of each task, make a plan, and keep my team and stakeholders informed.":[262.87,270.67],"I do whatever my boss says first.":[271.12,273.17],"I work until midnight.":[273.62,275.2],"What are your long-term career goals?":[275.65,277.75],"My long-term goal is to advance to a leadership position, and this role lets me take on more responsibility.":[278.2,285.5],"To have your job.":[285.95,287.27],"I'll see.":[287.72,288.61]},"ff1":{"Ahmed majored in electronics and communications. Today he repairs control cards at a maintenance company in Alexandria.":[0.0,9.09],"One morning, a juice factory called. Their filling line had stopped. The main control card was dead, and every hour cost them 50,000 pounds.":[9.54,20.12],"The manufacturer said, \"That card is discontinued. A new controller takes twelve weeks and costs 4,000 dollars.\"":[20.57,28.76],"Ahmed went to the factory. Before he touched anything, he asked, \"Do you mind if I take notes while we're speaking?\"":[29.21,36.24],"The operators told him everything: the card had failed right after a power cut.":[36.69,41.77],"Ahmed really enjoys analyzing situations and solving problems. Back at the lab, he checked the card under a microscope.":[42.22,51.05],"He found two swollen capacitors in the power section and a burnt optocoupler on an input channel. A voltage spike had hit the card.":[51.5,60.62],"The factory had no drawings, so it was up to him to adapt the repair to the parts he could find in the market.":[61.07,67.85],"He replaced the parts and tested the card for 24 hours on a test bench. The line was running again in two days — not twelve weeks.":[68.3,77.68],"But Ahmed always keeps an eye on the big picture: \"If we don't fix the cause, the card will fail again.\" So he suggested a surge protector and a small UPS for the control panel.":[78.13,90.69],"Then he told the factory manager, \"There's something else I can bring to the table: I can repair and test a spare card, so you always have one on the shelf.\"":[91.14,101.0],"For Ahmed, this is the best part of the job — putting his knowledge into practice.":[101.45,106.78],"control card / PCB":[107.23,109.36],"discontinued":[109.81,111.03],"capacitor":[111.48,112.39],"optocoupler":[112.84,113.96],"voltage spike / surge":[114.41,116.31],"test bench":[116.76,117.77],"What did Ahmed major in?":[118.22,119.89],"He majored in electronics and communications.":[120.34,123.57],"What kind of factory called?":[124.02,125.61],"A juice factory — its filling line had stopped.":[126.06,128.97],"How much did every hour cost?":[129.42,131.35],"50,000 pounds every hour!":[131.8,133.93],"Could they buy a new card?":[134.38,136.01],"No. The card is discontinued. A new controller takes twelve weeks.":[136.46,141.09],"What did Ahmed do before he touched anything?":[141.54,144.21],"He asked, \"Do you mind if I take notes?\" and listened to the operators.":[144.66,149.27],"When did the card fail?":[149.72,151.23],"Right after a power cut.":[151.68,153.2],"Does Ahmed enjoy this kind of problem?":[153.65,156.35],"Yes! He really enjoys analyzing situations and solving problems.":[156.8,161.43],"What did he find?":[161.88,163.1],"Two swollen capacitors and a burnt optocoupler.":[163.55,167.01],"What hit the card?":[167.46,168.73],"A voltage spike.":[169.18,170.44],"Were there drawings for the card?":[170.89,172.61],"No. It was up to him to adapt the repair to the parts in the market.":[173.06,177.29],"How long did the test run?":[177.74,179.48],"24 hours on a test bench.":[179.93,182.13],"How long was the line stopped?":[182.58,184.42],"Two days — not twelve weeks.":[184.87,186.59],"Why did he suggest a surge protector?":[187.04,189.39],"He keeps an eye on the big  Now she is in her first job interview.":[0.0,6.44],"\"Your grades are good, but not excellent,\" said the manager. \"Why?\"":[6.89,11.0],"\"I think my grades reflect my work in the subjects I love, like power systems,\" Laila said. \"But grades are not necessarily a good indication of what I can achieve.\"":[11.45,23.22],"\"I have two internships under my belt.\" The first was in a transformer workshop. She helped with oil tests and learned how heat and moisture damage a transformer.":[23.67,34.66],"The second was on telecom tower sites. She checked rectifiers, batteries and small generators in the desert heat.":[35.11,42.99],"In her free time, Laila volunteers. \"It allows me to serve my community,\" she said.":[43.44,49.44],"Last summer, her team installed a solar water pump for a village school. They had almost no money and no crane. It was not an easy feat, but they managed to succeed.":[49.89,61.15],"\"And I have always been a voracious reader,\" she added. \"I read manuals for fun!\"":[61.6,67.06],"Then the manager asked, \"Tell me about a mistake.\"":[67.51,70.64],"\"On a tower site, I labelled two battery cables the wrong way round. My supervisor found it before power-up.\"":[71.09,78.77],"\"I didn't hide it. I told the team, fixed the labels and made a checklist. I learned how to take ownership of my actions.\"":[79.22,87.29],"The manager wrote one word in his notes: honest.":[87.74,90.87],"transformer":[91.32,92.36],"oil test":[92.81,93.79],"telecom tower site":[94.24,95.65],"rectifier":[96.1,97.16],"solar water pump":[97.61,98.93],"What did Laila study?":[99.38,100.79],"Electrical power engineering, in Assiut.":[101.24,103.94],"Are her grades excellent?":[104.39,105.88],"Good, but not excellent.":[106.33,107.81],"Are grades everything?":[108.26,109.73],"No. They're not necessarily a good indication of what she can achieve.":[110.18,114.62],"How many internships does she have under her belt?":[115.07,117.86],"Two internships.":[118.31,119.44],"What did sh  resistance.":[8.95,19.63],"When a battery starts to get weak, its internal resistance goes up. The sensor sees it months before the battery fails.":[20.08,28.07],"Her days are usually quite varied. On Monday, she talks to the engineers about the firmware. On Tuesday, she visits a data centre for a field test.":[28.52,38.67],"Every morning, she has a short call with the factory to ensure they stay on schedule.":[39.12,44.58],"The launch was a success. Three banks bought the sensors in the first month, and one found forty weak batteries before a power cut.":[45.03,53.57],"But after four years, Rania feels she has reached a plateau in her growth.":[54.02,58.78],"Now the company wants a new operations manager for the monitoring centre — a room with big screens and a dashboard for every customer's batteries.":[59.23,69.04],"In her internal interview, Rania said, \"In this role, I would oversee the day-to-day operations of the monitoring centre.\"":[69.49,77.63],"\"I built this product, so I'm eager to leverage my expertise to make the service even better.\"":[78.08,84.06],"\"And honestly, this role aligns perfectly with my career goals.\"":[84.51,88.73],"battery monitoring system":[89.18,90.91],"internal resistance":[91.36,92.9],"sensor":[93.35,94.18],"dashboard":[94.63,95.58],"firmware":[96.03,96.84],"field test":[97.29,98.39],"What is Rania in charge of?":[98.84,100.71],"Managing the creation and release of new products.":[101.16,104.47],"What is her latest product?":[104.92,106.62],"A small sensor for every battery in a UPS.":[107.07,110.31],"What does the sensor measure?":[110.76,112.31],"Voltage, temperature and internal resistance.":[112.76,115.96],"What happens to internal resistance when a battery gets weak?":[116.41,120.34],"It goes up.":[120.79,121.72],"Are her days all the same?":[122.17,123.87],"No, they're usually quite varied.":[124.32,126.32],"Why does she call the factory every morning?":[126.77,129.17],"To ensure they stay on schedule.":[129.62,131.7]," tion and release of new products, and the upkeep of existing ones.":[233.0,241.43],"You know my role already.":[241.88,243.56],"I do products.":[244.01,245.25],"What's one weakness you're working on?":[245.7,247.85],"I can get overwhelmed by large projects, so I now use project-management tools and delegate more.":[248.3,255.21],"None.":[255.66,256.33],"My team is weak, not me.":[256.78,258.59],"Why are you interested in this new position?":[259.04,261.63],"I've reached a plateau in my current role, and I'm eager to take on more responsibility. It aligns perfectly with my career goals.":[262.08,270.96],"More money.":[271.41,272.32],"Everyone else applied.":[272.77,274.33]},"in2":{"Hany is an applications engineer at a company that sells and repairs VFDs — variable frequency drives for big motors.":[0.0,8.9],"He's going for a promotion to service manager, and he has a proven track record of delivering results.":[9.35,15.87],"One accomplishment that stands out in his mind is a farm in Wadi El Natrun. Its ten irrigation pumps started at full speed with star-delta starters.":[16.32,26.97],"Every start hit the pipes like a hammer — water hammer — and two pipes burst in one summer. The electricity bill was huge, too.":[27.42,36.01],"Hany installed a VFD on each pump. Now the pumps start slowly and keep the pressure constant.":[36.46,43.13],"When a pump runs 20% slower, it uses about half the power. The farm's bill fell by 35%, and no pipe burst again.":[43.58,53.3],"The project was completed on time and under budget, and it generated a 25% increase in orders from other farms nearby.":[53.75,62.86],"Then a hospital called. The VFDs on its chillers and big air-handling units kept tripping at night with an overvoltage fault.":[63.31,71.87],"Hany read the fault log. The drives were stopping the huge fans too quickly, so the motors were pushing energy back into the drives.":[72.32,81.28],"He set a longer deceleration time, added a braking resistor, and cleaned the drives' cooling fans, which were full of dust.":[81.73,90.39],"The trips stopped, and the operating theatres stayed cool all summer. That year, his team exceeded its sales targets by 20%.":[90.84,99.95],"Hany believes new ideas are crucial for growth. His next idea: remote monitoring for every drive, so faults are fixed before they stop a pump.":[100.4,110.83],"His experience and skills align very well with the new role.":[111.28,115.32],"VFD (variable frequency drive)":[115.77,118.48],"star-delta starter":[118.93,120.4],"water hammer":[120.85,121.84],"overvoltage trip":[122.29,123.68],"deceleration time":[124.13,125.64],"braking resistor":[126.09,127.44],"chiller / AHU":[127.89,129.54],"What does Hany work with?":[129.99,131.55],"VFDs — variable frequency drives for big motors.":[132.0,136.01],"What role is he going for?":[136.46,138.16],"Service manager — it's a promotion.":[138.61,140.83],"Does he have a good track record?":[141.28,143.07],"Yes, a proven track record of delivering results.":[143.52,146.8],"Which accomplishment stands out in his mind?":[147.25,149.79],"The farm in Wadi El Natrun with ten irrigation pumps.":[150.24,154.12],"How did the pumps start before?":[154.57,156.42],"At full speed, with star-delta starters.":[156.87,159.58],"What is water hammer?":[160.03,161.39],"The hit in the pipes when a pump starts or stops too fast. Two pipes burst!":[161.84,166.77],"How do the pumps start with a VFD?":[167.22,169.46],"Slowly — and the pressure stays constant.":[169.91,172.23],"If a pump runs 20% slower, how much power does it use?":[172.68,177.05],"About half the power.":[177.5,178.92],"How much did the bill fall?":[179.37,181.05],"By 35%.":[181.5,183.06],"Was the project late or over budget?":[183.51,185.83],"No. It was completed on time and under budget.":[186.28,189.17],"What did the project generate?":[189.62,191.39],"A 25% increase in orders from nearby farms.":[191.84,195.92],"What fault did the hospital drives show?":[196.37,198.77],"An overvoltage fault — function sayFind(t){ if(typeof SAY==="undefined")return null; const c=sclean(t), c2=sclean(String(t).replace(/…/g,""));
  const lvs=[VOICE].concat(Object.keys(SAY).filter(x=>x!==VOICE)), gid=(typeof L!=="undefined"&&L)?L.id:null;
  for(const lv of lvs){ const S2=SAY[lv]; if(!S2)continue; for(const k of [gid].concat(Object.keys(S2))){ const m=k&&S2[k]; if(m&&(m[c]||m[c2])) return [lv+"/"+k].concat(m[c]||m[c2]) } } return null }

  const a=SAYA[f[0]]||(SAYA[f[0]]=Object.assign(new Audio("audio/say/"+f[0]+".mp3"),{preload:"auto"})); SAYCUR=a;

  if(a.readyState>=1) go(); else a.addEventListener("loadedmetadata",go,{once:true}); return true }

function tabsFor(l){return ALL_TABS.filter(([k])=>k==="words"?WORDS[l.id]:k==="story"?STORY[l.id]:k==="upgrade"?UPGRADE[l.id]:true)}
let L,tab,tick;
function lesson(id,t){
  L=LESSONS.find(l=>l.id===id&&!l.soon); if(!L){location.hash="#/lessons";return}
  TABS=tabsFor(L);
  tab=TABS.some(x=>x[0]===t)?t:"read";
  const c=chapter(L.chapter), n=LESSONS.indexOf(L)+1;
  app.innerHTML=`<div class="wrap">
   <section class="lhero"><div>
     <a class="back" href="#/lessons">← Lessons</a>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="chip lv">${c.level}</span><span class="chip">Chapter ${c.n} · ${c.title}</span><span class="chip">Lesson ${n}</span></div>
     <h1 style="font-size:clamp(30px,4.6vw,46px);font-weight:800">${esc(L.title)}</h1>
     <p class="ar" style="color:var(--muted);font-size:18px;margin:6px 0 0">${esc(L.ar)}</p>
     <p style="color:var(--ink-2);margin:10px 0 0">${esc(L.desc)}</p>
   </div><div class="art">${art(L.art)}</div></section>
   <div class="ltabs" role="tablist">${TABS.map(([k,e])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${["words","story","upgrade"].includes(k)?'<span class="new">New</span>':""}${e}${k==="read"&&S.read[L.id]||k==="talk"&&S.done[L.id]?' <span class="ok">✓</span>':""}</button>`).join("")}</div>
   <div class="panel" id="panel"></div></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{history.replaceState(null,"",`#/lesson/${L.id}/${b.dataset.t}`);setTab(b.dataset.t)});
  setTab(tab);
}
function setTab(t){
  tab=t; stopAudio(); clearInterval(tick);
  app.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  const sel=app.querySelector(`[data-t="${t}"]`); if(sel&&sel.scrollIntoView) sel.scrollIntoView({inline:"center",block:"nearest"});
  const p=document.getElementById("panel");
  ({read:readTab,learn:learnTab,words:wordsTab,story:storyTab,quiz:quizTab,upgrade:upgradeTab,match:matchTab,talk:talkTab})[t](p);
}
function nextTab(){const i=TABS.findIndex(x=>x[0]===tab); if(i<TABS.length-1){history.replaceState(null,"",`#/lesson/${L.id}/${TABS[i+1][0]}`);setTab(TABS[i+1][0]);document.querySelector(".ltabs").scrollIntoView({block:"start"})}}

/* ---------- read & listen ---------- */
let AUD=null, rafId=0;
function stopAudio(){ stopSay(); if(AUD){AUD.pause();AUD=null} cancelAnimationFrame(rafId); if(CLIP){CLIP.pause();CLIP=null} if(typeof SEG!=="undefined"&&SEG){SEG.pause();SEG=null} }
const fmt=s=>isFinite(s)?`${s/60|0}:${String(s%60|0).padStart(2,"0")}`:"0:00";
function readTab(p){
  let cur=0;
  const draw=()=>{
    const R=L.reading[cur];
    p.innerHTML=`<div class="hint"><span>🎧</span><span>Press play and follow the text. The line being read lights up; tap any line to jump to it.<br><span class="ar">دوس تشغيل وتابع النص. السطر اللي بيتقري بيتلوّن، واضغط على أي سطر تروحله.</span></span></div>
     <div class="tracks">${L.reading.map((r,i)=>`<button data-k="${i}" aria-pressed="${i===cur}">Part ${i+1}: ${esc(r.title.replace(/^\d+\.\s*/,""))}</button>`).join("")}</div>
     <div class="player"><button class="pp" id="pp" aria-label="Play">${PLAY}</button>
      <div><div class="ttl">${esc(R.title.replace(/^\d+\.\s*/,""))}</div><div class="bar" id="bar"><i id="fill" style="width:0"></i></div></div>
      <div style="display:grid;gap:4px;justify-items:end"><span class="tm" id="tm">0:00</span><button class="sp" id="sp">1×</button></div></div>
     <div class="reader" id="reader">${R.lines.map((l,i)=>l.k==="h"?`<h4>${esc(l.s)}</h4>`:`<span class="ln" data-i="${i}" ${l.t!=null?`data-t="${l.t}"`:""}>${fmtLine(l.s)}</span>`).join("")}</div>
     <div class="actions"><button class="btn" id="go">Next: learn the phrases</button></div>`;
    stopAudio(); const A=new Audio(R.src); AUD=A; A.preload="metadata";
    const pp=p.querySelector("#pp"), fill=p.querySelector("#fill"), tm=p.querySelector("#tm"), lines=[...p.querySelectorAll(".ln[data-t]")];
    let lastNow=null;
    const loop=()=>{ if(AUD!==A)return; const t=A.currentTime, d=A.duration||1;
      fill.style.width=(t/d*100)+"%"; tm.textContent=`${fmt(t)} / ${fmt(A.duration)}`;
      let now=null; for(const el of lines){ if(+el.dataset.t<=t+.25) now=el; else break }
      if(now!==lastNow){ lastNow&&lastNow.classList.remove("now"); if(now){now.classList.add("now"); const r=now.getBoundingClientRect(); if(r.top<200||r.bottom>innerHeight-40) now.scrollIntoView({block:"center",behavior:"smooth"})} lastNow=now }
      rafId=requestAnimationFrame(loop)};
    A.onplay=()=>{pp.innerHTML=PAUSE;pp.setAttribute("aria-label","Pause");loop()};
    A.onpause=()=>{pp.innerHTML=PLAY;pp.setAttribute("aria-label","Play");cancelAnimationFrame(rafId)};
    A.onended=()=>{S.read[L.id]=true;save(); if(cur<L.reading.length-1){cur++;draw();AUD&&AUD.play().catch(()=>{})}};
    A.onloadedmetadata=()=>tm.textContent=`0:00 / ${fmt(A.duration)}`;
    pp.onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
    const rates=[1,.85,.75,1.15]; let ri=0;
    p.querySelector("#sp").onclick=e=>{ri=(ri+1)%rates.length;A.playbackRate=rates[ri];e.target.textContent=rates[ri]+"×"};
    p.querySelector("#bar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); if(A.duration)A.currentTime=(e.clientX-r.left)/r.width*A.duration};
    lines.forEach(el=>el.onclick=()=>{A.currentTime=Math.max(0,+el.dataset.t-.2);A.play().catch(()=>{})});
    p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    p.querySelector("#go").onclick=()=>{S.read[L.id]=true;save();nextTab()};
  };
  draw();
}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>', PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function fmtLine(s){
  let h=esc(s).replace(/_{3}/g,'<span class="blank" aria-label="blank"></span>').replace(/\[the company\]/g,"<em>[the company]</em>");
  const m=h.match(/^([A-Z][A-Za-z.\- ]{1,26}):\s+/); if(m) h=`<span class="who">${m[1]}:</span> `+h.slice(m[0].length);
  return h;
}

/* ---------- learn ---------- */
function learnTab(p){
  let i=0;
  const draw=()=>{const c=L.cards[i];
    p.innerHTML=`<div class="prog"><i style="width:${(i+1)/L.cards.length*100}%"></i></div>
     <span class="kicker">Phrase ${i+1} of ${L.cards.length} · <span class="ar">عبارة ${i+1} من ${L.cards.length}</span></span>
     <div class="phrase"><h2>${esc(c.en)}</h2>${c.clip?`<button class="say" id="sp" aria-label="Listen from the book" title="From the book">${SPK}</button>`:""}${spk(c.en,"big")}</div>
     ${sayFind(c.en)?`<p class="say-note">🟡 Book audio · 🔵 Clear pronunciation, a little slower <span class="ar">— الأصفر من الكتاب، والأزرق نطق واضح وأبطأ</span></p>`:""}
     <div class="meaning ar">${esc(c.ar)}</div>
     <div class="example"><span class="kicker">Example</span><div>${c.ex}</div></div>
     <p class="tip ar">${esc(c.tip)}</p>
     <div class="actions">${i?'<button class="btn alt" id="bk">Back</button>':""}<button class="btn" id="go">${i<L.cards.length-1?"Next phrase":"Keep going"}</button></div>
     ${phraseBank()}`;
    const sp=p.querySelector("#sp"); if(sp){sp.onclick=()=>play(c)}
    bindBank(p);
    if(i||tab==="learn") play(c);
    p.querySelector("#go").onclick=()=>{if(i<L.cards.length-1){i++;draw()}else nextTab()};

/* ---------- quiz ---------- */
let SC={};
function quizTab(p){
  let i=0; SC={quiz:0};
  const draw=()=>{const q=L.quiz[i], last=i===L.quiz.length-1;
    const top=`<div class="prog"><i style="width:${i/L.quiz.length*100}%"></i></div><span class="kicker">Question ${i+1} of ${L.quiz.length}</span>`;
    const fb=(ok)=>{if(ok)SC.quiz++; const b=p.querySelector("#fb"); b.hidden=false; b.className="fb "+(ok?"good":"bad");
      b.innerHTML=`<b>${ok?"Correct!":"Not quite"}</b><span class="ar">${esc(q.why)}</span>`; const g=p.querySelector("#go"); g.hidden=false; g.focus();
      g.onclick=()=>{if(last){p.innerHTML=`<div class="done-box"><h2>${SC.quiz} / ${L.quiz.length}</h2><p class="ar">${SC.quiz===L.quiz.length?"ممتاز! كله صح.":"كويس! راجع العبارات اللي غلطت فيها."}</p><div class="actions" style="justify-content:center"><button class="btn alt" id="again">Try again</button><button class="btn" id="nx">Play the match game</button></div></div>`;p.querySelector("#again").onclick=()=>quizTab(p);p.querySelector("#nx").onclick=nextTab}else{i++;draw()}}};
    if(q.type==="order"){ let built=[]; const bank=shuffle(q.words.map((w,k)=>({w,k})));
      p.innerHTML=`${top}<p class="q">Put the words in order</p><div class="built" id="bt"></div><div class="bank" id="bk"></div><div id="fb" hidden></div><div class="actions"><button class="btn" id="ck" disabled>Check</button><button class="btn" id="go" hidden>${last?"See score":"Next"}</button></div>`;
      const d=()=>{p.querySelector("#bt").innerHTML=built.map((b,j)=>`<button class="w" data-j="${j}">${esc(b.w)}</button>`).join("");
        p.querySelector("#bk").innerHTML=bank.map(b=>`<button class="w" data-k="${b.k}" ${built.includes(b)?"disabled":""}>${esc(b.w)}</button>`).join("");
        p.querySelectorAll("#bt .w").forEach(x=>x.onclick=()=>{built.splice(+x.dataset.j,1);d()});
        p.querySelectorAll("#bk .w").forEach(x=>x.onclick=()=>{built.push(bank.find(b=>b.k==x.dataset.k));d()});
        p.querySelector("#ck").disabled=built.length!==q.words.length};
      d(); p.querySelector("#ck").onclick=function(){this.hidden=true;p.querySelectorAll(".w").forEach(w=>w.disabled=true);const ok=built.map(b=>b.w).join(" ")===q.answer;fb(ok);p.querySelector("#fb").innerHTML+=`<div style="margin-top:6px">${esc(q.answer)} ${spk(q.answer)}</div>`;sayPlay(q.answer)};
      return; }
    const prompt=q.type==="gap"?`<p class="q">${esc(q.sentence).replace("___",'<span class="gap">?</span>')}</p>`:`<p class="q ${/[؀-ۿ]/.test(q.q)?"ar":""}">${esc(q.q)} ${spk(q.q)}</p>`;
    const arx=/[؀-ۿ]/.test(q.options[0]);
    p.innerHTML=`${top}${prompt}<div class="opts">${q.options.map((o,k)=>`<button class="opt ${arx?"arx":""}" data-k="${k}">${esc(o)}${q.type==="mcq"?spk(o):""}</button>`).join("")}</div><div id="fb" hidden></div><div class="actions"><button class="btn" id="go" hidden>${last?"See score":"Next"}</button></div>`;
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.answer;
      p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
      if(q.type==="gap"){p.querySelector(".gap").textContent=q.options[q.answer]; const full=q.sentence.replace(/_{2,}/,q.options[q.answer]); fb(ok); p.querySelector("#fb").innerHTML+=spk(full); sayPlay(full)} else fb(ok)});
  };
  draw();
}

/* ---------- match game ---------- */
function matchTab(p){
  const pairs=L.match.map((x,k)=>({en:x[0],ar:x[1],k})), left=shuffle(pairs), right=shuffle(pairs);
  let sel=null,found=0,t0=Date.now(),miss=0;
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="kicker">Match each word with its meaning, fast</span><p class="q ar" style="margin-top:2px">وصّل كل كلمة بمعناها بأسرع وقت</p></div><span class="timer" id="tmr">0.0s</span></div>
   <div class="board"><div class="col">${left.map(x=>`<button class="tile" data-k="${x.k}" data-s="en">${esc(x.en)}</button>`).join("")}</div><div class="col">${right.map(x=>`<button class="tile ar" data-k="${x.k}" data-s="ar">${esc(x.ar)}</button>`).join("")}</div></div>`;
  clearInterval(tick); tick=setInterval(()=>{const e=document.getElementById("tmr"); if(!e){clearInterval(tick);return} e.textContent=((Date.now()-t0)/1000).toFixed(1)+"s"},100);
  p.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
    if(sel.dataset.k===b.dataset.k){sayPlay(pairs[+b.dataset.k].en);[sel,b].forEach(x=>x.classList.add("gone"));found++;sel=null;
      if(found===pairs.length){clearInterval(tick);const s=(Date.now()-t0)/1000;SC.time=s;
        setTimeout(()=>{p.innerHTML=`<div class="done-box"><h2>${s.toFixed(1)}s</h2><p>${miss} mistakes · ${s<20?"Lightning fast ⚡":"Try to beat your time!"}</p><div class="actions" style="justify-content:center"><button class="btn alt" id="again">Play again</button><button class="btn" id="nx">Role-play</button></div></div>`;p.querySelector("#again").onclick=()=>matchTab(p);p.querySelector("#nx").onclick=nextTab},400)}}
    else{miss++;const a=sel;[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("shake")});setTimeout(()=>[a,b].forEach(x=>x.classList.remove("shake")),320);sel=null}});
}

/* ---------- role-play ---------- */
function talkTab(p){
  const turns=L.roleplay.turns; let hist=[],idx=0,good=0; const total=turns.filter(t=>t.you).length;
  const draw=()=>{while(idx<turns.length&&turns[idx].them){hist.push({w:"them",t:turns[idx].them});idx++}
    const cur=turns[idx];
    p.innerHTML=`<div class="scene"><span class="kicker">The situation</span><div class="ar">${esc(L.roleplay.scene)}</div></div>
     <div class="chat">${hist.map(h=>`<div class="msg ${h.w}"><small>${h.w==="them"?"Them":"You"} ${spk(h.t)}</small>${esc(h.t)}</div>`).join("")}</div>
     ${cur?`<p class="kicker" style="margin-top:14px">What do you say?</p><div class="opts">${shuffle(cur.you.map((o,k)=>({...o,k}))).map(o=>`<button class="opt" data-k="${o.k}">${esc(o.t)}${spk(o.t)}</button>`).join("")}</div>`:""}
     <div id="fb" hidden></div><div class="actions"><button class="btn" id="go" ${cur?"hidden":""}>${cur?"Continue":"Finish the lesson"}</button></div>`;
    const lastThem=hist.length&&hist[hist.length-1]; if(lastThem&&lastThem.w==="them"&&!lastThem.said){lastThem.said=1; sayPlay(lastThem.t)}
    if(!cur){p.querySelector("#go").onclick=()=>finish(p,good,total);return}
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=cur.you[+b.dataset.k];
      p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(cur.you[+x.dataset.k].ok)x.classList.add("right")}); if(!o.ok)b.classList.add("wrong"); else good++;
      const f=p.querySelector("#fb");f.hidden=false;f.className="fb "+(o.ok?"good":"bad");f.innerHTML=`<b>${o.ok?"Great answer":"There's a better reply"}</b><span class="ar">${esc(o.fb)}</span>`;
      const g=p.querySelector("#go");g.hidden=false;g.focus();g.onclick=()=>{hist.push({w:"you",t:cur.you.find(x=>x.ok).t});idx++;draw()}});
  };
  draw();
}

/* ---------- phrase bank: every line from the book pages, playable from the book audio ---------- */
let SEG=null;
function playSeg(src,t,t2){ if(SEG){SEG.pause()} if(CLIP){CLIP.pause();CLIP=null}
  const a=new Audio(src); SEG=a; a.currentTime=Math.max(0,t-.15);
  a.play().catch(()=>{}); if(t2) a.ontimeupdate=()=>{ if(a.currentTime>=t2+.2){a.pause()} } }
function bankItems(){
  return (L.reading||[]).flatMap(r=>{const ps=r.lines.filter(l=>l.k==="p");
    return ps.map((l,i)=>({src:r.src,t:l.t,t2:(ps.slice(i+1).find(n=>n.t>l.t)||{}).t,s:l.s,sec:r.title}))
      .filter(x=>x.s.split(/\s+/).length<=28 && !/^(Subject|Dear|Best regards|Warm regards|Sincerely)/.test(x.s))});
}
function phraseBank(){
  const items=bankItems(); if(!items.length) return "";
  return `<details class="bank-all"><summary>📚 All phrases from these pages <span class="chip">${items.length}</span><span class="ar" style="color:var(--muted);font-size:14px">كل الجمل اللي في الصفحات دي، بصوت الكتاب</span></summary>
   <div class="bank-list">${items.map((x,i)=>`<div class="bank-row"><button class="say sm" data-b="${i}" aria-label="Listen">${SPK}</button><span>${fmtLine(x.s)}</span></div>`).join("")}</div></details>`;
}
function bindBank(p){ const items=bankItems(); p.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const x=items[+b.dataset.b]; playSeg(x.src,x.t,x.t2)}); }

/* ---------- mini story (AJ Hoge style: story, then many quick questions) ---------- */
function storyTab(p){
  const st=STORY[L.id]; let step=0, qi=0, right=0; const words=(WORDS[L.id]||[]).map(w=>w.w).concat(L.cards.map(c=>c.en.replace(/[.…,?]+$/,"").split(" ").slice(0,4).join(" ")));
  const WL=st.words||(WORDS[L.id]||[]).map(w=>w.w);
  const hl=s=>{let h=esc(s); WL.forEach(w=>{const pat=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/[-\s]+/g,"[-\\s]?"); const re=new RegExp("\\b("+pat+"\\w*)","i"); h=h.replace(re,'<mark>$1</mark>')}); return h};
  const draw=()=>{
    if(step===0){ p.innerHTML=`<div class="story-hero"><span class="kicker">Mini story · AJ Hoge method</span><h2>${st.icon?st.icon+" ":""}${esc(st.title)}</h2><p class="ar" style="color:var(--muted)">${esc(st.ar)}</p><p>${esc(st.scene)}</p>
        ${st.tech?`<div class="techw"><span class="kicker">Tech words in this story · كلمات فنية</span><div class="chips">${st.tech.map(([e,a])=>`<span class="chip"><b>${esc(e)} ${spk(e)}</b><span class="ar">${esc(a)}</span></span>`).join("")}</div></div>`:""}</div>
       ${voicePick()}<div class="hint"><span>💡</span><span>Read the story once. Then answer lots of quick, easy questions — fast, without thinking too much. The repetition is what makes the words stick.<br><span class="ar">اقرا القصة مرة، وبعدين جاوب بسرعة على أسئلة كتير سهلة. التكرار هو اللي بيثبّت الكلمات.</span></span></div>
       ${sayFind(st.lines[0])?`<div class="story-play"><button class="btn" id="lsn">${PLAY} Listen to the story</button><span class="ar" style="color:var(--muted)">اسمع القصة واتابع السطر اللي بيتقري — واضغط على أي سطر تسمعه لوحده</span></div>`:""}
       <div class="story">${st.lines.map((l,i)=>`<p data-li="${i}">${hl(l)}</p>`).join("")}</div>
       <div class="actions"><button class="btn" id="go">Start the questions</button></div>`;
      const ps=[...p.querySelectorAll(".story p")], lb=p.querySelector("#lsn"); let run=false;
      const mark=i=>ps.forEach((x,j)=>x.classList.toggle("on",j===i));
      const playFrom=i=>{ if(!run||i>=ps.length){run=false;mark(-1);if(lb)lb.innerHTML=PLAY+" Listen again";return} mark(i); ps[i].scrollIntoView({block:"nearest",behavior:"smooth"}); sayPlay(st.lines[i],()=>setTimeout(()=>playFrom(i+1),250)) };
      if(lb) lb.onclick=()=>{ if(run){run=false;stopSay();mark(-1);lb.innerHTML=PLAY+" Listen to the story";return} run=true; lb.innerHTML=PAUSE+" Stop"; playFrom(0) };
      ps.forEach((x,i)=>x.onclick=()=>{ run=false; if(lb)lb.innerHTML=PLAY+" Listen to the story"; mark(i); sayPlay(st.lines[i],()=>mark(-1)) });
      p.querySelector("#go").onclick=()=>{run=false;stopSay();step=1;draw()}; return }
    if(step===1){ const q=st.qa[qi];
      p.innerHTML=`<div class="prog"><i style="width:${qi/st.qa.length*100}%"></i></div><span class="kicker">Question ${qi+1} of ${st.qa.length} · answer fast!</span>
       <p class="q" style="font-size:24px">${esc(q.q)} ${spk(q.q)}</p><div class="opts two">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
       <div id="fb" hidden></div><div class="actions"><button class="btn" id="go" hidden>Next</button></div>`;
      p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.k; if(ok)right++;
        p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.k)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
        const f=p.querySelector("#fb");f.hidden=false;f.className="fb "+(ok?"good":"bad");f.innerHTML=`<b>${ok?"Yes!":"Not quite"}</b><span>${hl(q.a)} ${spk(q.a)}</span>`; sayPlay(q.a);
        const g=p.querySelector("#go");g.hidden=false;g.focus();g.onclick=()=>{qi++; if(qi<st.qa.length)draw(); else {step=2;draw()}}});
      sayPlay(q.q); return }
    p.innerHTML=`<div class="done-box"><h2>${right} / ${st.qa.length}</h2><p>You just used the lesson's words ${st.qa.length*2}+ times.</p></div>
     <div class="hint"><span>🎤</span><span><b>Point of view:</b> ${esc(st.pov)}<br><span class="ar">احكي القصة بصوت عالي كأنك انت ${esc(st.hero||"Karim")}.</span></span></div>
     <div class="actions"><button class="btn alt" id="again">Read again</button><button class="btn" id="nx">Practise</button></div>`;
    p.querySelector("#again").onclick=()=>{step=0;qi=0;right=0;draw()}; p.querySelector("#nx").onclick=nextTab;
  }; draw();
}

/* ---------- say it like a pro ---------- */
function upgradeTab(p){
  const it=UPGRADE[L.id]; let i=0, good=0;
  const draw=()=>{ if(i>=it.length){p.innerHTML=`<div class="done-box"><h2>${good} / ${it.length}</h2><p>Upgraded sentences sound natural at work.</p><div class="actions" style="justify-content:center"><button class="btn alt" id="again">Again</button><button class="btn" id="nx">Match game</button></div></div>`;p.querySelector("#again").onclick=()=>upgradeTab(p);p.querySelector("#nx").onclick=nextTab;return}
    const u=it[i];
    p.innerHTML=`<div class="prog"><i style="width:${i/it.length*100}%"></i></div><span class="kicker">Say it like a pro · ${i+1} of ${it.length}</span>
     <div class="plain"><span class="kicker">What we often say</span><div class="bad-say">“${esc(u.plain)}” ${spk(u.plain)}</div><div class="ar" style="color:var(--muted)">${esc(u.ar)}</div></div>
     <p class="q">Which one sounds natural at work?</p>
     <div class="opts">${u.pro.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}${spk(o)}</button>`).join("")}</div>
     <div id="fb" hidden></div><div class="actions"><button class="btn" id="go" hidden>Next</button></div>`;
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===u.a; sayPlay(u.pro[u.a]); if(ok)good++;
      p.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===u.a)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
      const f=p.querySelector("#fb");f.hidden=false;f.className="fb "+(ok?"good":"bad");f.innerHTML=`<b>${ok?"That's how pros say it":"The natural version is highlighted"}</b><span class="ar">${esc(u.why)}</span>`;
      const g=p.querySelector("#go");g.hidden=false;g.focus();g.onclick=()=>{i++;draw()}}); };
  draw();
}

/* ---------- stories from your field ---------- */
function storyCards(n){return Object.entries(STORY).slice(0,n||99).map(([id,st])=>{const l=LESSONS.find(x=>x.id===id); if(!l)return "";
  return `<a class="scard" href="#/lesson/${id}/story"><span class="sico">${st.icon||"📖"}</span><span class="kicker">${esc(st.field||"")}</span><h3>${esc(st.title)}</h3><p class="ar">${esc(st.ar)}</p>
   <p class="sl">Words from: <b>${esc(l.title)}</b></p><span class="smeta">${st.qa.length} quick questions · ${S.done[id]?"✓ lesson done":"hero: "+esc(st.hero||"")}</span></a>`}).join("")}
function storiesPage(){
  app.innerHTML=`<div class="wrap"><section class="phead"><a class="back" href="#/">← Home</a><h1>Stories from your field</h1>
   <p>Short stories from real technical work — UPS, servers, solar plants, control cards and VFDs. Each one reuses the phrases of a book lesson, then asks lots of quick questions so the words stick (the AJ Hoge mini-story method).</p>
   <p class="ar">قصص قصيرة من شغلك الحقيقي. كل قصة فيها عبارات درس من الكتاب، وبعدها أسئلة سريعة كتير عشان الكلمات تثبت.</p>${voicePick()}</section>
   <div class="sgrid">${storyCards()}</div></div>`;
}

/* ---------- office talk decoder ---------- */
function decoder(){
  let f="all";
  const draw=()=>{const list=JARGON.filter(j=>f==="all"||j.ch===f);
   app.innerHTML=`<div class="wrap"><section class="phead"><a class="back" href="#/">← Home</a><h1>Office talk</h1>
    <p>The English people really use at work today — in chats, emails and meetings — and what it actually means.</p><p class="ar">الكلام اللي بيتقال في الشركات فعلًا، ومعناه الحقيقي بالمصري.</p>${voicePick()}
    <div class="filters">${[["all","All"],["chat","💬 Chat"],["email","✉️ Email"],["meeting","👥 Meeting"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${k===f}">${t}</button>`).join("")}</div></section>
    <div class="jar">${list.map(j=>`<button class="jcard" aria-expanded="false"><span class="jt">${esc(j.t)} ${spk(j.t)}</span><span class="jm">${esc(j.m)}</span><span class="ja ar">${esc(j.ar)}</span><span class="je">“${esc(j.eg)}” ${spk(j.eg)}</span><span class="jhint">Tap to see the meaning</span></button>`).join("")}</div></div>`;
   app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;draw()});
   app.querySelectorAll(".jcard").forEach(b=>b.onclick=()=>b.setAttribute("aria-expanded",b.getAttribute("aria-expanded")==="true"?"false":"true"));
  }; draw();
}

function finish(p,good,total){
  const first=!S.done[L.id], gain=20+(SC.quiz||0)*5+good*5+((SC.time||99)<20?10:0);
  S.xp+=gain; S.done[L.id]=true; bump(); save(); stats();
  const nxt=real().find(l=>!S.done[l.id]);
  p.innerHTML=`<div class="done-box"><h2>Lesson complete 🎉</h2><p class="ar">برافو! خلّصت «${esc(L.ar)}»${first?"، والعبارات اتضافت لـ My phrases.":"."}</p>
   <div class="score"><div><b>+${gain}</b><span>XP</span></div><div><b>${SC.quiz??"–"}/${L.quiz.length}</b><span>Practice</span></div><div><b>${SC.time?SC.time.toFixed(1)+"s":"–"}</b><span>Match game</span></div><div><b>${good}/${total}</b><span>Role-play</span></div></div>
   <div class="actions" style="justify-content:center">${nxt?`<a class="btn" href="#/lesson/${nxt.id}">Next lesson: ${esc(nxt.title)}</a>`:`<a class="btn" href="#/path">Back to the path</a>`}</div></div>`;
}

setVoice(VOICE);
route();
