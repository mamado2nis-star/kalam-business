inquiry and introduction emails (p. 155–158)", "src": "audio/ch2/book-em_155.mp3", "lines": [{"k": "h", "s": "Inquiry email"}, {"k": "p", "s": "Subject: Inquiry about ___", "t": 0.0}, {"k": "p", "s": "Dear ___,", "t": 0.0}, {"k": "p", "s": "I hope this email finds you well. My name is ___, and I am at ___. We recently discovered your ___ and are interested in gathering more information to help us evaluate its suitability for our needs.", "t": 22.82}, {"k": "p", "s": "To assist us in our assessment, could you kindly provide the following information:", "t": 24.75}, {"k": "p", "s": "1. A comprehensive overview of the product/service, including its primary features and advantages.", "t": 35.4}, {"k": "p", "s": "2. Pricing details, including any available discounts, packages or special offers for bulk purchases.", "t": 42.62}, {"k": "p", "s": "3. Estimated delivery or implementation time frames, as well as any associated shipping or set-up costs.", "t": 51.05}, {"k": "p", "s": "4. Information regarding warranty, support and maintenance services, if applicable.", "t": 59.17}, {"k": "p", "s": "We appreciate your prompt attention to this matter and look forward to hearing back from you soon. If you require any additional information from us, please do not hesitate to ask.", "t": 60.05}, {"k": "p", "s": "Thank you for your time and assistance.", "t": 71.34}, {"k": "p", "s": "Best regards,", "t": 71.34}, {"k": "h", "s": "Introduction email"}, {"k": "p", "s": "Subject: Introduction from ___", "t": 71.34}, {"k": "p", "s": "Dear ___,", "t": 71.34}, {"k": "p", "s": "I hope this email finds you well. My name is ___, and I am ___ at ___. I recently came across your company, and I wanted to take a moment to introduce myself and our business.", "t": 93.02}, {"k": "p", "s": "We specialize in ___. We have been in the industry for ___ and pride ourselves on our commitment to ___.", "t": 102.52}, {"k": "p", "s": "In reviewing your company's offerings, I believe there may be potential synergies between our organizations. It would be a pleasure to learn more about your business and explore possible ways we could collaborate or support each other.", "t": 104.48}, {"k": "p", "s": "If you're interested in discussing this further, I would be more than happy to arrange a phone call or a meeting at your convenience. Please feel free to reach out to me directly at ___.", "t": 120.83}, {"k": "p", "s": "Thank you for taking the time to read my email, and I look forward to the opportunity to connect with you.", "t": 128.58}, {"k": "p", "s": "Best regards,", "t": 128.58}]}, "em_159": {"title": "Templates, part 2: follow-up and quotation emails (p. 159–162)", "src": "audio/ch2/book-em_159.mp3", "lines": [{"k": "h", "s": "Follow-up email"}, {"k": "p", "s": "Subject: Follow-up on our ___ regarding ___", "t": 0.0}, {"k": "p", "s": "Dear ___,", "t": 0.0}, {"k": "p", "s": "I hope you're doing well. I wanted to follow up on our ___ that took place on ___. During our conversation, we discussed ___.", "t": 21.38}, {"k": "p", "s": "To keep the momentum going, I would like to propose the following next steps: ___.", "t": 25.0}, {"k": "p", "s": "Please let me know if you have any additional suggestions or if any adjustments are needed to the proposed plan. Additionally, if you require any further information or clarification on any of the points we discussed, please don't hesitate to reach out. I'm more than happy to assist you.", "t": 27.65}, {"k": "p", "s": "Thank you for your time and attention, and I'm looking forward to our continued cooperation.", "t": 47.37}, {"k": "p", "s": "Best regards,", "t": 47.37}, {"k": "h", "s": "Quotation or proposal email"}, {"k": "p", "s": "Subject: Quotation/proposal for ___", "t": 47.37}, {"k": "p", "s": "Dear ___,", "t": 47.37}, {"k": "p", "s": "I hope you're doing well. Thank you for your interest in ___. As per our recent discussion, I am pleased to provide you with a quotation/proposal for ___ that we offer at ___: pricing, terms, e your feedback.", "t": 81.8}, {"k": "p", "s": "Please take a moment to share your thoughts on ___ by replying to this email or completing our short survey at ___. Your input is invaluable in helping us enhance our ___ and serve you better.", "t": 88.74}, {"k": "p", "s": "If you have any questions, please feel free to reach out to us at ___.", "t": 98.77}, {"k": "p", "s": "Thank you for your time and support.", "t": 100.46}, {"k": "p", "s": "Best regards,", "t": 100.46}]}, "em_166": {"title": "Templates, part 4: payment reminder and product update emails (p. 166–168)", "src": "audio/ch2/book-em_166.mp3", "lines": [{"k": "h", "s": "Invoice or payment reminder email"}, {"k": "p", "s": "Subject: Friendly payment reminder: invoice ___", "t": 0.0}, {"k": "p", "s": "Dear ___,", "t": 0.0}, {"k": "p", "s": "I hope this email finds you well. This is a gentle reminder that your invoice ___ remains unpaid as of ___.", "t": 23.45}, {"k": "p", "s": "Here are the details of the outstanding invoice: invoice number, invoice date, due date, amount due.", "t": 27.11}, {"k": "p", "s": "Please kindly arrange for the payment at your earliest convenience. You can make the payment via ___. If you have already made the payment or have any questions, please feel free to contact us at ___.", "t": 36.98}, {"k": "p", "s": "We appreciate your prompt attention to this matter. Thank you for your business.", "t": 50.51}, {"k": "p", "s": "Best regards,", "t": 50.51}, {"k": "h", "s": "Product or service update email"}, {"k": "p", "s": "Subject: Exciting updates from ___", "t": 57.48}, {"k": "p", "s": "Dear ___,", "t": 57.48}, {"k": "p", "s": "We hope you're doing well. We wanted to share some exciting updates from ___ that we believe will interest you and improve your experience with ___.", "t": 64.19}, {"k": "p", "s": "Here's a quick overview of what's new: ___. For more information on these updates and how they may benefit you, please visit our website at ___ or check out our latest blog post at ___.", "t": 68.95}, {"k": "p", "s": "We appreciate your continued support and welcome any feedback you may have. If you have any questions or need assistance, please don't hesitate to contact us at ___.", "t": 80.72}, {"k": "p", "s": "Wishing you a great day.", "t": 88.32}, {"k": "p", "s": "Best regards,", "t": 88.32}]}, "em_169": {"title": "Templates, part 5: event invitation, deadline reminder, job application and cover letter (p. 169–174)", "src": "audio/ch2/book-em_169.mp3", "lines": [{"k": "h", "s": "Event invitation email"}, {"k": "p", "s": "Subject: You're invited to ___", "t": 0.0}, {"k": "p", "s": "Dear ___,", "t": 0.0}, {"k": "p", "s": "We're excited to invite you to our upcoming event, ___, taking place on ___. This special occasion promises to be both informative and entertaining, with highlights including ___.", "t": 21.64}, {"k": "p", "s": "We'd be delighted to have you join us and take part in this unique experience. To RSVP, please click on the following link: ___. If you have any questions or require additional information, feel free to reach out to us at ___.", "t": 24.92}, {"k": "p", "s": "Looking forward to seeing you at ___.", "t": 42.11}, {"k": "p", "s": "Warm regards,", "t": 42.11}, {"k": "h", "s": "Deadline reminder email"}, {"k": "p", "s": "Subject: Friendly reminder: deadline approaching for ___", "t": 61.82}, {"k": "p", "s": "Dear ___,", "t": 61.82}, {"k": "p", "s": "I hope this email finds you well. This is just a friendly reminder that the deadline for ___ is fast approaching on ___. We're looking forward to receiving your ___ by that date.", "t": 61.82}, {"k": "p", "s": "If you have any questions or concerns, or if you need assistance, please feel free to reach out to me or another member of the team. We're here to help and ensure a smooth process.", "t": 70.62}, {"k": "p", "s": "Thank you for your attention to this matter, and we appreciate your timely submission.", "t": 78.69}, {"k": "p", "s": "Warm regards,", "t": 78.69}, {"k": "h", " ons.", "t": 168.59}, {"k": "p", "s": "Skills and qualifications: I'm confident that my experience in creating and executing social media strategies, along with my strong communication and analytical skills, make me a valuable addition to the ABC Marketing Solutions team.", "t": 201.75}, {"k": "p", "s": "Enthusiasm for the role: I am particularly excited about the opportunity to work with a diverse range of clients and contribute to the growth of their online presence.", "t": 218.22}, {"k": "p", "s": "Conclusion, appreciation and contact information: Thank you for considering my application. I would love the opportunity to discuss my qualifications further and demonstrate how my skills can benefit ABC Marketing Solutions. Please feel free to contact me at ___ to schedule a conversation.", "t": 229.08}]}, "em_175": {"title": "Templates, part 6: acknowledgment and networking emails (p. 175–177)", "src": "audio/ch2/book-em_175.mp3", "lines": [{"k": "h", "s": "Acknowledgment email"}, {"k": "p", "s": "Subject: ___", "t": 0.0}, {"k": "p", "s": "Dear ___,", "t": 0.0}, {"k": "p", "s": "Thank you for your email regarding ___. I wanted to acknowledge receipt of your message and let you know that I'm currently looking into the matter. I'll get back to you with more information or a resolution as soon as possible, no later than ___.", "t": 16.69}, {"k": "p", "s": "In the meantime, if you have any further questions or concerns, please don't hesitate to reach out.", "t": 24.38}, {"k": "p", "s": "Thank you for your patience and understanding.", "t": 30.16}, {"k": "p", "s": "Sincerely,", "t": 30.16}, {"k": "h", "s": "Networking email"}, {"k": "p", "s": "Subject: Connecting with a fellow ___ professional", "t": 43.12}, {"k": "p", "s": "Dear ___,", "t": 43.12}, {"k": "p", "s": "I hope this email finds you well. My name is ___, and I am a ___. I came across your profile on ___ and was impressed by your background and ___.", "t": 53.57}, {"k": "p", "s": "I'm always looking to expand my const SAY={"l1":{"em1":{"Mahmoud is the security-systems technician at a big hotel in Hurghada. He looks after 180 cameras and four NVRs.":[0.0,11.07],"One morning, the manager asked for video from the car park. A guest's car had been damaged.":[11.52,18.4],"Mahmoud opened the NVR. There was no footage for the last three days.":[18.85,23.91],"He checked the hard disks. One disk in the RAID had failed, and after a firmware update, the NVR had stopped recording.":[24.36,33.59],"He needed an expert. A friend at another hotel gave him the name of the supplier's senior engineer, Mr. Adel.":[34.04,42.99],"Mahmoud wrote the email carefully. First, he made sure the subject line was clear: \"NVR stopped recording after firmware update — urgent\".":[43.44,54.39],"\"Dear Mr. Adel, I hope this email finds you well. I was referred to you by Hassan Fathy at the Sunrise Hotel.\"":[54.84,64.15],"\"The purpose of this email is to address a recording failure on two of our NVRs.\"":[64.6,70.68],"\"I'm also reaching out to you today to ask a quick question: can the missing footage be recovered from the failed disk?\"":[71.13,79.35],"\"I have attached the logs and photos. I look forward to hearing back from you soon.\"":[79.8,85.35],"Mr. Adel replied in one hour. The footage was lost, but he sent a fix for the firmware — and Mahmoud added an alarm that tells him when any camera stops recording.":[85.8,98.36],"CCTV":[98.81,100.18],"NVR (network video recorder)":[100.63,103.38],"hard disk / RAID":[103.83,105.65],"footage":[106.1,106.92],"firmware update":[107.37,108.71],"Where does Mahmoud work?":[109.16,110.71],"At a big hotel in Hurghada.":[111.16,113.22],"How many cameras does he look after?":[113.67,115.95],"180 cameras and four NVRs.":[116.4,119.59],"What video did the manager want?":[120.04,122.24],"Video from the car park — a guest's car was damaged.":[122.69,126.63],"How much footage was missing?":[127.08,128.98],"The last three days.":[129.43,130.91],"What had failed?":[131.36,13 re having a great day! I'm reaching out to ask a quick question about the deadline.":[243.48,250.53],"Jane, answer me.":[250.98,252.51],"Dear Sir or Madam,":[252.96,254.46],"(Step 3) Close the email.":[254.91,257.06],"I appreciate your help, and I look forward to hearing back from you soon. Best regards,":[257.51,263.88],"Reply fast.":[264.33,265.69],"Bye bye":[266.14,267.13]},"em2":{"Omar is the IT support lead at a factory in 10th of Ramadan City. He looks after 300 laptops, 40 printers and the whole network.":[0.0,11.76],"One Monday at 8:05, nobody could open the ERP system. The helpdesk received sixty tickets in ten minutes.":[12.21,22.24],"Omar ran to the server room. The core switch was dead — its power supply had failed over the weekend.":[22.69,30.49],"As you may recall, Omar had asked for a spare switch last year. The request was never approved.":[30.94,38.04],"He moved the key servers to a backup switch, and by 9:30 the ERP was back online.":[38.49,45.67],"Then he emailed the managers: \"Please find attached the incident report for your review.\"":[46.12,52.67],"The finance manager replied angrily: \"Why did IT shut down our system on a busy Monday?\"":[53.12,60.53],"Omar stayed polite: \"There seems to have been a misunderstanding. The outage was caused by a hardware fault, not a planned shutdown.\"":[60.98,71.09],"He added: \"I apologize for the disruption, and I am committed to making things right. We will install a redundant switch with two power supplies.\"":[71.54,82.95],"\"We're on track to finish the upgrade by Thursday. Please approve the purchase order at your earliest convenience.\"":[83.4,91.23],"The next morning, the CEO wrote back: \"Thank you for bringing this matter to our attention. Approved.\"":[91.68,98.79],"core switch":[99.24,100.37],"power supply (PSU)":[100.82,102.82],"helpdesk ticket":[103.27,104.72],"outage":[105.17,106.08],"redundant":[106.53,107.63],"purchase order (PO)":[108.08,109.68],"Is Omar a sales manager?":[110.13,112.2],"No, he isn't. He's the IT support lead at a factory.":[112.65,117.08],"How many laptops does he look after?":[117.53,119.89],"Three hundred laptops — and forty printers and the whole network.":[120.34,124.62],"What happened at 8:05 on Monday?":[125.07,128.25],"Nobody could open the ERP system.":[128.7,131.49],"How many tickets did the helpdesk get?":[131.94,134.4],"Sixty tickets in ten minutes!":[134.85,137.01],"What was dead?":[137.46,138.51],"The core switch. Its power supply had failed over the weekend.":[138.96,143.42],"Did Omar ask for a spare switch before?":[143.87,146.55],"Yes. As you may recall, he asked last year, but it was never approved.":[147.0,152.1],"When was the ERP back online?":[152.55,155.0],"By 9:30 — he moved the key servers to a backup switch.":[155.45,159.88],"What did he attach to his email?":[160.33,162.32],"The incident report. \"Please find attached the incident report for your review.\"":[162.77,168.57],"Did IT shut down the system on purpose?":[169.02,171.98],"No! There seems to have been a misunderstanding — it was a hardware fault.":[172.43,177.49],"How does Omar promise to make things right?":[177.94,180.67],"He's committed to making things right with a redundant switch with two power supplies.":[181.12,187.09],"Is the upgrade late?":[187.54,189.2],"No. They're on track to finish by Thursday.":[189.65,192.55],"When should the manager approve the PO?":[193.0,195.62],"At his earliest convenience — as soon as he can.":[196.07,199.42],"What did the CEO say?":[199.87,201.52],"\"Thank you for bringing this matter to our attention. Approved.\"":[201.97,205.98],"Please find attached for your review.":[206.43,208.76],"As you may recall, we previously discussed":[209.21,212.33],"We're on track to meet the project's objectives.":[212.78,215.96],"at your earliest convenience":[216.41,218.33],"There seems to have been a misunderstanding.":[218.78,221.44],"I apologize for my mistake, and I am committed to making things right.":[221.89,227.23],"Thank you for bringing this matter to our attention.":[227.68,230.59],"Call me now.":[231.04,232.0],"Could we schedule a call at your earliest convenience?":[232.45,235.91],"I need a call ASAP!!!":[236.36,238.39],"Please find attached the updated budget for your review.":[238.84,242.78],"We're on track to meet the project's objectives":[243.23,246.41],"It's not our fault.":[246.86,248.2],"Calm down.":[248.65,249.65],"You misunderstood me.":[250.1,251.77],"There seems to have been a misunderstanding about the date, and I wanted to clarify.":[252.22,257.72],"Read my email again.":[258.17,259.92],"milestone":[260.37,261.51],"recap":[261.96,262.84],"authorize":[263.29,264.4],"clarify":[264.85,265.88],"clause":[266.33,267.18],"dissatisfaction":[267.63,269.05],"(Step 1) How do you open your reply?":[269.5,272.16],"Thank you for bringing this matter to our attention. Please know that we take your concerns very seriously.":[272.61,279.89],"We are not responsible for shipping.":[280.34,282.64],"OK.":[283.09,283.96],"(Step 2) Apologize and commit to a fix.":[284.41,287.87],"I apologize for the delay, and I am committed to making things right. The shipment will arrive on Monday.":[288.32,296.31],"Sorry, these things happen.":[296.76,298.69],"Maybe it will come.":[299.14,300.52],"(Step 3) Close the email.":[300.97,303.12],"Please let me know if there's anything else we can do to make things right. Best regards,":[303.57,309.22],"Don't complain again.":[309.67,311.2],"Bye.":[311.65,312.38]},"em3":{"Heba is the IT security officer at a pharmaceutical company in 6th of October City.":[0.0,7.15],"On Sunday morning, twelve employees received a fake email. It looked like it came from IT: \"Your password expires today. Click here.\"":[7.6,17.95],"It was phishing. Two people clicked the link and typed their passwords.":[18.4,22.8],"Heba acted fast. She reset both passwords and checked the servers for ransomware. Nothing was encrypted — the backups were safe.":[23.25,33.34],"Then she wrote to all staff: \"It's important to note that IT will never ask for your password by email.\"":[33.79,40.94],"\"As a result of this attack, we will turn on multi-factor authentication for every account.\"":[41.39,48.24],"\"All laptops must install the new security patch by EOD today.\"":[48.69,53.69],"\"Please don't hesitate to reach out if you have any questions.\" And she ended with \"Best regards, Heba\".":[54.14,61.3],"Next, she wrote a formal letter to the company's bank, because one of the two users worked in finance.":[61.75,68.81],"\"Could you please confirm that you've received this message?\" she wrote. This time, she ended with \"Sincerely\".":[69.26,76.75],"The bank confirmed in twenty minutes. No money moved, and on Monday, every employee had a two-minute training on how to spot phishing.":[77.2,87.08],"phishing":[87.53,88.35],"ransomware":[88.8,89.93],"backup":[90.38,91.26],"patch":[91.71,92.5],"MFA (multi-factor authentication)":[92.95,96.18],"What is Heba's job?":[96.63,98.16],"IT security officer at a pharmaceutical company.":[98.61,102.83],"What did the fake email say?":[103.28,105.18],"\"Your password expires today. Click here.\"":[105.63,108.63],"What kind of attack was it?":[109.08,110.73],"Phishing.":[111.18,112.0],"How many people typed their passwords?":[112.45,114.86],"Two people.":[115.31,116.35],"Were the backups safe?":[116.8,118.3],"Yes, nothing was encrypted — the backups were safe.":[118.75,122.5],"Will IT ever ask for your password by email?":[122.95,126.27],"Never. It's important to note that.":[126.72,129.12],"What will happen as a result of the attack?":[129.57,132.36],"Multi-factor authentication for every account.":[132.81,136.62],"When must the patch be installed?":[137.07,139.01],"By EOD — by the end of the day today.":[139.46,141.93],"How did she close the email to staff?":[142.38,144.78],"\"Best regards\" — friendly but professional.":[145.23,148.31],"Why did she write to the bank?":[148.76,150.45],"Because one of the two users worked in finance.":[150.9,154.03],"What did she ask the bank?":[154.48,156.11],"\"Could you please confirm that you've received this message?\"":[156.56,160.18],"How did she close the formal letter?":[160.63,162.75],"\"Sincerely\" — more formal.":[163.2,165.28],"Did any money move?":[165.73,167.08],"No. And on Monday everyone had phishing training.":[167.53,170.88],"Best regards,":[171.33,172.66],"Sincerely,":[173.11,174.18],"Please don't hesitate to reach out if you have any questions.":[174.63,178.59],"Could you please confirm that you've received this message?":[179.04,182.63],"EOD — end of day":[183.08,184.39],"It's important to note that":[184.84,186.64],"As a result,":[187.09,188.33],"For your information":[188.78,190.21],"Finish your items":[190.66,192.16],"Fix your issue":[192.61,193.83],"Cheers,":[194.28,195.15],"See you later,":[195.6,196.76],"The shipment was late. As a result, we missed the deadline.":[197.21,201.42],"Please don't hesitate to reach out":[201.87,204.21],"ASAP":[204.66,205.88],"EOD":[206.33,207.06],"FYI":[207.51,208.55],"TBD":[209.0,210.11],"OOO":[210.56,211.3],"ETA":[211.75,212.5],"(1) He's emailing a new client for the first time. Which closing?":[212.95,217.66],"Cheers mate,":[218.11,219.25],"Later,":[219.7,220.6],"(2) He wants the report today before he leaves. Which line?":[221.05,225.23],"Could you please send the report by EOD?":[225.68,228.49],"Send it NOW.":[228.94,229.96],"Send it sometime.":[230.41,231.73],"(3) He wants to connect two ideas: the supplier was late, so the launch moved.":[232.18,238.03],"The supplier was late. As a result, we moved the launch.":[238.48,242.44],"The supplier was late. For instance, we moved the launch.":[242.89,246.68],"The supplier was late. Similarly, we moved the launch.":[247.13,250.8]},"em4":{"Ziad sells solar systems to farms in Minya. The farmers love free power in the day, but at night their pumps still run on diesel.":[0.0,10.32],"Ziad found a company that makes battery energy storage systems — big lithium batteries in a container.":[10.77,18.68],"He wrote to their sales director: \"I wanted to take a moment to introduce myself. I'm Ziad, and my company has installed solar on sixty farms.\"":[19.13,30.69],"\"I believe there may be potential synergies between our organizations: we have the farms, and you have the batteries.\"":[31.14,39.3],"They met in Cairo. The director liked the idea, and they agreed on a pilot farm.":[39.75,46.11],"The next day, Ziad wrote again: \"I wanted to follow up on our meeting. As per our recent discussion, we will start with one farm: 200 kWh of storage and a hybrid inverter.\"":[46.56,61.35],"\"To keep the momentum going, I'd like to propose the following next steps: a site visit next week, then a price offer.\"":[61.8,70.95],"\"Could you kindly provide the following information? The cycle life of the batteries, the warranty, and the delivery time.\"":[71.4,80.3],"\"We appreciate your prompt attention to this matter.\"":[80.75,83.92],"Three months later, the pilot farm ran its pumps all night on solar energy stored in the batteries.":[84.37,91.44],"The farmer saved 60% on diesel — and his neighbours started calling Ziad.":[91.89,97.83],"BESS (battery energy storage system)":[98.28,101.11],"kWh":[101.56,102.93],"hybrid inverter":[103.38,104.84],"cycle life":[105.29,106.52],"diesel savings":[106.97,108.36],"Where are Ziad's customers?":[108.81,110.77],"On farms in Minya.":[111.22,112.8],"What runs the pumps at night?":[113.25,115.12],"Diesel — the sun is gone.":[115.57,117.45],"What does the other company make?":[117.9,119.83],"Battery energy storage systems.":[120.28,122.69],"How did Ziad start his first email?":[123.14,125.73],"\"I wanted to take a moment to introduce myself.\"":[126.18,129.47],"What synergies did he see?":[129.92,131.77],"He has the farms, and they have the batteries.":[132.22,135.18],"What did they agree in Cairo?":[135.63,137.46],"A pilot farm.":[137.91,139.26],"How much storage for the pilot?":[139.71,141.79],"200 kWh, with a hybrid inverter.":[142.24,145.9],"How did he write about the meeting?":[146.35,148.17],"\"I wanted to follow up on our meeting. As per our recent discussion…\"":[148.62,153.33],"Why did he propose next steps?":[153.78,155.83],"To keep the momentum going.":[156.28,158.22],"What information did he ask for?":[158.67,160.84],"Cycle life, warranty and delivery time.":[161.29,164.4],"What did he appreciate?":[164.85,166.37],"Their prompt attention to this matter.":[166.82,169.05],"How much diesel did the farmer save?":[169.5,171.95],"Could you kindly provide the following information?":[172.4,175.62],"We appreciate your prompt attention to this matter.":[176.07,179.14],"I wanted to take a moment to introduce myself.":[179.59,182.75],"There may be potential synergies between our organizations.":[183.2,187.38],"I wanted to follow up on our meeting.":[187.83,189.97],"To keep the momentum going, I'd like to propose the following next steps.":[190.42,195.61],"As per our recent discussion":[196.06,198.04],"Send prices.":[198.49,199.83],"What's the price, man?":[200.28,201.81],"As per our recent discussion, please find the quotation attached.":[202.26,206.99],"I wanted to follow up on our meeting":[207.44,209.59],"Answer quickly.":[210.04,211.3],"Whatever.":[211.75,212.62],"inquiry":[213.07,214.0],"quotation":[214.45,215.58],"proposal":[216.03,217.06],"follow up":[217.51,218.5],"bulk purchase":[218.95,220.22],"warranty":[220.67,221.65],"(Step 1) Open the follow-up email.":[222.1,224.93],"I hope you're doing well. I wanted to follow up on our meeting on Monday.":[225.38,229.98],"Did you forget me?":[230.43,231.83],"Why didn't you call?":[232.28,233.59],"(Step 2) Suggest what happens next.":[234.04,236.96],"Tell me what to do.":[237.41,238.76],"Let's wait.":[239.21,240.26],"(Step 3) Mention the quotation.":[240.71,243.24],"As per our recent discussion, please find the detailed quotation attached.":[243.69,249.19],"Price is in file.":[249.64,251.18],"Look at the attachment.":[251.63,253.24]},"em5":{"Salma is the service coordinator at a company that maintains UPS systems. She manages sixty annual maintenance contracts.":[0.0,10.26],"A bank's UPS needs new batteries. To replace them safely, the UPS must go to maintenance bypass for four hours.":[10.71,20.2],"Nobody likes a shutdown, so Salma wrote carefully: \"Here are my proposed dates and times: Friday the 10th from 6 a.m., or Saturday the 11th from 10 p.m.\"":[20.65,34.52],"\"Please let me know which option works best for you.\" The bank chose Friday morning.":[34.97,40.39],"The battery replacement went perfectly. The team finished in three hours.":[40.84,46.01],"The next week, Salma sent an email to all customers: \"We're excited to announce our new 24/7 hotline for UPS emergencies.\"":[46.46,57.9],"She also added a short survey: \"Your input is invaluable. Tell us how we can serve you better.\"":[58.35,65.35],"But one customer, a plastics factory, had not paid for its preventive maintenance visit two months ago.":[65.8,73.37],"Salma didn't get angry. She wrote: \"This is a gentle reminder that your invoice remains unpaid.\"":[73.82,81.36],"\"Please kindly arrange for the payment by the end of the month.\"":[81.81,85.72],"She ended with \"Thank you for your business.\" The payment arrived four days later.":[86.17,91.52],"AMC (annual maintenance contract)":[91.97,94.5],"preventive maintenance (PM)":[94.95,97.37],"battery replacement":[97.82,99.39],"maintenance bypass":[99.84,101.57],"24/7 hotline":[102.02,104.54],"What does Salma's company maintain?":[104.99,107.13],"UPS systems — sixty annual contracts.":[107.58,111.07],"What does the bank's UPS need?":[111.52,113.63],"New batteries.":[114.08,115.31],"How long must the UPS be on bypass?":[115.76,118.49],"Four hours.":[118.94,120.05],"Did Salma choose the date herself?":[120.5,122.83],"No, she sent proposed dates and times.":[123.28,126.17],"What did she ask the bank?":[126.62,128.25],"Which option works best f e for a 15–20 minute call next week?":[217.7,221.78],"Call me now.":[222.23,223.19],"RSVP":[223.64,224.93],"deadline":[225.38,226.36],"cover letter":[226.81,227.78],"résumé":[228.23,229.22],"networking":[229.67,230.77],"acknowledge":[231.22,232.28],"(Step 1) First sentence.":[232.73,234.67],"I am writing to express my interest in the Social Media Coordinator position advertised on LinkedIn.":[235.12,243.17],"I saw your job. I want it.":[243.62,245.72],"Hello, are you hiring?":[246.17,247.81],"(Step 2) Show why you fit.":[248.26,250.35],"In my previous role, I increased engagement by 25%, so I believe I would be a great fit for the role.":[250.8,259.31],"I use Facebook every day.":[259.76,261.81],"I'm the best.":[262.26,263.39],"(Step 3) Close.":[263.84,265.34],"Please find my résumé attached. Thank you for considering my application. Sincerely,":[265.79,272.7],"Waiting your call.":[273.15,274.47],"Thanks bye":[274.92,276.01]},"ex1":{"Sherif is interviewing for director of engineering at a large telecom company.":[0.0,5.89],"The CEO began, \"I've heard great things about your work on the Smart Village data centre.\"":[6.34,12.65],"\"Thank you,\" said Sherif. \"I started as a site electrician twenty years ago, and I worked my way up to my current role.\"":[13.1,21.49],"\"I have a diverse background in the industry: power, cooling, networks — and a few years in sales.\"":[21.94,29.43],"Then he told the story. The data centre was a Tier III project, and the client wanted it running in forty days.":[29.88,38.31],"It was a complex project with many moving parts: two generators, four UPS modules, six chillers, fire suppression and three hundred racks.":[38.76,50.45],"Every supplier had a different schedule. The generators arrived late, and the chillers arrived early with no place to put them.":[50.9,60.11],"Sherif held a stand-up meeting every morning at seven. Every problem had an owner and a deadline.":[60.56,68.04],"For commissioning, his team tested everything with load banks: they cut the utility power again and again and watched the UPS and generators take over.":[68.49,80.33],"The handover was on day thirty-nine. The client signed two more sites, and it had a significant impact on the company's bottom line.":[80.78,90.73],"\"In the same year, I led my team to exceed sales targets by thirty percent.\"":[91.18,96.85],"At the end, Sherif said, \"I'd like to reiterate my enthusiasm for the role. I'd love to build your next ten sites.\"":[97.3,106.1],"Tier III":[106.55,107.87],"commissioning":[108.32,109.32],"fire suppression":[109.77,111.16],"load bank":[111.61,112.7],"handover":[113.15,114.15],"What role is Sherif interviewing for?":[114.6,116.92],"Director of engineering at a telecom company.":[117.37,120.93],"What has the CEO heard?":[121.38,123.12],"Great things about his work on the Smart Village data centre.":[123.57,127.74],"How did Sherif start?":[128.19,129.78],"As a site electrician. He worked his way up.":[130.23,133.63],"Is his background narrow?":[134.08,135.83],"No, it's diverse: power, cooling, networks and sales.":[136.28,140.55],"How many days did the client give him?":[141.0,143.29],"Forty days.":[143.74,144.87],"Was it a simple project?":[145.32,147.32],"No. It was a complex project with many moving parts.":[147.77,151.81],"Which equipment arrived late?":[152.26,154.32],"The generators.":[154.77,156.07],"When was the daily meeting?":[156.52,158.35],"Every morning at seven.":[158.8,160.45],"What did they test with during commissioning?":[160.9,163.3],"Load banks — they cut the power again and again.":[163.75,166.96],"When was the handover?":[167.41,169.0],"On day thirty-nine — one day early.":[169.45,172.13],"What was the impact on the company?":[172.58,174.75],"A significant impact on the bottom line — two more sites.":[175.2,179.24],"What did he want to reiterate?":[179.69,181.54],"His enthusiasm for the role.":[181.99,184.23],"I've heard great things about your work.":[184.68,186.92],"I worked my way up to my started shutting down every afternoon at about 3 p.m.":[8.7,16.89],"The software team said, \"It's the hardware.\" The hardware vendor said, \"It's your software.\" Everyone was angry.":[17.34,25.24],"Nour stayed calm and composed. She avoided getting defensive or personal and said, \"Let's find the root cause first.\"":[25.69,34.65],"She checked the server logs. Every shutdown had the same message: thermal shutdown — CPU over temperature.":[35.1,43.91],"So it wasn't the software. The servers were overheating.":[44.36,48.15],"She measured the air in front of the rack: 38°C. It should be below 27.":[48.6,54.99],"The root cause was simple. The empty spaces in the rack had no blanking panels, so hot air from the back came round to the front. And one server fan had failed.":[55.44,68.03],"Nour explained it clearly, both verbally in the meeting and in writing, in a short report with photos.":[68.48,75.96],"Then she proposed a win-win solution: the vendor replaced the fan under warranty, facilities installed blanking panels and cold-aisle containment, and the software team moved its heavy batch job to 2 a.m.":[76.41,93.48],"In one week, the project was back on track. There were no shutdowns for ninety days — and her manager called her a natural leader.":[93.93,103.0],"rack":[103.45,104.21],"thermal shutdown":[104.66,106.0],"blanking panel":[106.45,107.76],"cold-aisle containment":[108.21,109.94],"under warranty":[110.39,111.71],"batch job":[112.16,113.39],"Where does Nour work?":[113.84,115.09],"In the data centre of a bank in Cairo.":[115.54,118.4],"When did the servers shut down?":[118.85,120.81],"Every afternoon at about 3 p.m.":[121.26,124.08],"Did the teams agree?":[124.53,126.0],"No. The software team blamed the hardware, and the vendor blamed the software.":[126.45,132.0],"Did Nour get angry too?":[132.45,134.13],"No. She stayed calm and composed.":[134.58,137.08],"Did she get personal?":[137.53,139.06],"No, she avoided getting defensive or personal.":[139.51,143.12],"What did she want to find first?":[143.57,145.4],"The root cause.":[145.85,147.07],"What did the logs say?":[147.52,148.92],"Thermal shutdown — CPU over temperature.":[149.37,152.86],"Was it a software problem?":[153.31,155.2],"No. The servers were overheating.":[155.65,158.2],"How hot was the air in front of the rack?":[158.65,161.12],"38°C — it should be below 27.":[161.57,165.42],"Why was hot air coming to the front?":[165.87,168.15],"Because there were no blanking panels in the empty spaces.":[168.6,172.43],"How did she explain it?":[172.88,174.48],"Clearly, both verbally in the meeting and in writing, with photos.":[174.93,179.5],"Who paid for the new fan?":[179.95,181.6],"Nobody — the vendor replaced it under warranty. A win-win solution.":[182.05,187.29],"When does the batch job run now?":[187.74,189.86],"At 2 a.m., when the servers are cooler and less busy.":[190.31,194.39],"What did her manager call her?":[194.84,196.63],"A natural leader — the project was back on track in one week.":[197.08,201.53],"I consider myself a natural leader.":[201.98,204.69],"I can express myself clearly, both verbally and in writing.":[205.14,209.6],"I try to understand the root cause of the problem.":[210.05,213.25],"I try to stay calm and composed.":[213.7,215.99],"I avoid getting defensive or personal.":[216.44,219.26],"I always strive for a win-win solution.":[219.71,222.41],"We were able to get the project back on track.":[222.86,225.7],"I ignore him.":[226.15,227.36],"I try to understand his perspective, stay professional, and look for a win-win solution.":[227.81,234.37],"I complain to the manager immediately.":[234.82,237.48],"I avoid getting defensive or personal":[237.93,240.75],"I told him he was wrong.":[241.2,242.91],"I listened carefully and empathized with his situation.":[243.36,247.52],"I hung up.":[247.97,248.99],"root cause":[249.44,250.57],"composed":[251.02,252.06],"defensive":[252.51,253.57],"win-win":[254.02,254.94],"stakeholders":[255.39,256.63],"back on track":[257.08,258.32],"How would you describe yourself?":[258.77,260.74],"I consider myself a natural leader. I can express myself clearly, both verbally and in writing, and I'm highly organized.":[261.19,271.04],"I'm a nice guy.":[271.49,272.88],"Ask my friends.":[273.33,274.7],"How do you handle a project that's behind schedule?":[275.15,278.21],"I stay calm, find the root cause, and set clear goals and weekly meetings to get the project back on track.":[278.66,286.51],"I panic.":[286.96,287.98],"I blame the team.":[288.43,289.83],"And if you disagree with your manager?":[290.28,292.55],"I try to understand their perspective, avoid getting defensive or personal, and look for a win-win solution.":[293.0,301.23],"I do it my way anyway.":[301.68,303.51],"I quit.":[303.96,304.88]},"ex3":{"Youssef is the O&M manager at a 50 MW solar plant in Benban, near Aswan. His team keeps 150,000 panels and 20 inverters running.":[0.0,14.24],"In April, the plant produced 18% less energy than planned. The owners wanted answers — fast.":[14.69,22.49],"Youssef didn't guess. He took a data-driven approach and compared every inverter and every string in the monitoring system.":[22.94,31.7],"The data showed three problems. First, a sandstorm had covered the panels with dust.":[32.15,38.65],"Second, twelve strings were producing zero current. Their fuses had blown.":[39.1,44.69],"Third, inverter 14 kept tripping with an insulation fault. Water had got into a DC junction box, and a cable was damaged.":[45.14,55.42],"There were too many jobs, so he analyzed the urgency and importance of each task.":[55.87,61.79],"He focused on the 20% of tasks that had the greatest impact. Inverter 14 came first, because one inverter is 5% of the whole plant.":[62.24,74.03],"He also implemented a daily check-in meeting: fifteen minutes at 7 a.m., before the sun gets too hot.":[74.48,82.88],"Youssef stays current by reading industry news and publications, so he knew about robots that clean panels without water. He proposed a pilot.":[83.33,94.47],"He keeps an eye on the market, too. Panel prices were falling, so replacing the damaged modules was cheap.":[94.92,103.31],"By the end of May, the plant was back to 99% of its target.":[103.76,108.6],"O&M":[109.05,110.01],"inverter":[110.46,111.37],"string":[111.82,112.64],"insulation fault":[113.09,114.62],"junction box":[115.07,116.48],"SCADA / monitoring":[116.93,118.83],"Where is Youssef's plant?":[119.28,121.01],"In Benban, near Aswan.":[121.46,123.39],"How big is it?":[123.84,125.04],"50 MW — 150,000 panels and 20 inverters.":[125.49,131.34],"How much less energy did it produce in April?":[131.79,135.01],"18% less than planned.":[135.46,137.63],"Did Youssef guess the problem?":[138.08,140.3],"No. He took a data-driven approach.":[140.75,143.41],"What covered the panels?":[143.86,145.47],"Dust from a sandstorm.":[145.92,147.44],"Why were twelve strings producing zero current?":[147.89,150.94],"Because their fuses had blown.":[151.39,153.51],"What fault did inverter 14 show?":[153.96,156.38],"An insulation fault — water had got into a DC junction box.":[156.83,161.7],"Did he do every job at the same time?":[162.15,164.73],"No. He analyzed the urgency and importance of each task.":[165.18,169.53],"Why did inverter 14 come first?":[169.98,172.5],"Because it had the greatest impact — one inverter is 5% of the plant.":[172.95,178.34],"When is the daily check-in meeting?":[178.79,181.14],"At 7 a.m., for fifteen minutes, before the sun gets too hot.":[181.59,186.23],"How does he stay current?":[186.68,188.34],"By reading industry news and publications.":[188.79,192.2],"What do the new robots clean with?":[192.65,194.68],"No water at all — they clean panels dry.":[195.13,198.26],"Why was replacing the modules cheap?":[198.71,201.18],"He keeps an eye on the market — panel prices were falling.":[201.63,205.74],"Where was the plant by the end of May?":[206.19,208.47],"Back to 99% of its target.":[208.92,211.69],"I stay current by reading industry news and publications.":[212.14,216.41],"I keep an eye on the market.":[216.86,218.84],"I took a data-driven approach.":[219.29,221.58],"I implemented a daily check-in meeting.":[222.03,224.72],"I analyze the urgency and importance of each task.":[225.17,229.0],"I focus on the 20% of tasks that have the greatest impact.":[229.45,234.42],"My long-term goal is to advance to a leadership position.":[234.87,239.03],"I don't need to.":[239.48,240.75],"I read industry news, attend webinars, and follow key influencers on social media.":[241.2,248.09],"My friends tell me.":[248.54,250.01],"I took a data-driven approach":[250.46,252.75],"I set clear goals and regular check-ins.":[253.2,256.02],"I work alone.":[256.47,257.68],"I extend every deadline.":[258.13,260.14],"stay current":[260.59,261.79],"webinar":[262.24,263.24],"newsletter":[263.69,264.69],"data-driven":[265.14,266.32],"priority":[266.77,267.76],"check-in":[268.21,269.11],"How do you keep up to date with changes in the industry?":[269.56,272.87],"I stay current by reading industry news, attending webinars and conferences, and staying active in my professional network.":[273.32,282.54],"Google.":[282.99,283.78],"I don't have time.":[284.23,285.56],"How do you handle competing priorities?":[286.01,288.64],"I analyze the urgency and importance of each task, make a plan, and keep my team and stakeholders informed.":[289.09,297.8],"I do whatever my boss says first.":[298.25,300.48],"I work until midnight.":[300.93,302.72],"What are your long-term career goals?":[303.17,305.35],"My long-term goal is to advance to a leadership position, and this role lets me take on more responsibility.":[305.8,313.67],"To have your job.":[314.12,315.5],"I'll see.":[315.95,316.94]},"ff1":{"Ahmed majored in electronics and communications. Today he repairs control cards at a maintenance company in Alexandria.":[0.0,10.11],"One morning, a juice factory called. Their filling line had stopped. The main control card was dead, and every hour cost them 50,000 pounds.":[10.56,22.0],"The manufacturer said, \"That card is discontinued. A new controller takes twelve weeks and costs 4,000 dollars.\"":[22.45,31.62],"Ahmed went to the factory. Before he touched anything, he asked, \"Do you mind if I take notes while we're speaking?\"":[32.07,39.74],"The operators told him everything: the card had failed right after a power cut.":[40.19,46.03],"Ahmed really enjoys analyzing situations and solving problems. Back at the lab, he checked the card under a microscope.":[46.48,56.42],"He found two swollen capacitors in the power section and a burnt optocoupler on an input channel. A voltage spike had hit the card.":[56.87,67.09],"The factory had no drawings, so it was up to him to adapt the repair to the parts he could find in the market.":[67.54,75.13],"He replaced the parts and tested the card for 24 hours on a test bench. The line was running again in two days — not twelve weeks.":[75.58,85.86],"But Ahmed always keeps an eye on the big picture: \"If we don't fix the cause, the card will fail again.\" So he suggested a surge protector and a small UPS for the control panel.":[86.31,100.27],"Then he told the factory manager, \"There's something else I can bring to the table: I can repair and test a spare card, so you always have one on the shelf.\"":[100.72,111.96],"For Ahmed, this is the best part of the job — putting his knowledge into practice.":[112.41,118.19],"control card / PCB":[118.64,121.04],"discontinued":[121.49,122.83],"capacitor":[123.28,124.35],"optocoupler":[124.8,126.11],"voltage spike / surge":[126.56,128.72],"test bench":[129.17,130.35],"What did Ahmed major in?":[130.8,132.65],"He majored in electronics and communications.":[133.1,136.56],"What kind of factory called?":[137.01,138.8],"A juice factory — its filling line had stopped.":[139.25,142.54],"How much did every hour cost?":[142.99,145.14],"50,000 pounds every hour!":[145.59,148.12],"Could they buy a new card?":[148.57,150.3 eader,\" she added. \"I read manuals for fun!\"":[68.18,74.1],"Then the manager asked, \"Tell me about a mistake.\"":[74.55,77.89],"\"On a tower site, I labelled two battery cables the wrong way round. My supervisor found it before power-up.\"":[78.34,86.58],"\"I didn't hide it. I told the team, fixed the labels and made a checklist. I learned how to take ownership of my actions.\"":[87.03,95.94],"The manager wrote one word in his notes: honest.":[96.39,99.91],"transformer":[100.36,101.44],"oil test":[101.89,102.99],"telecom tower site":[103.44,105.12],"rectifier":[105.57,106.72],"solar water pump":[107.17,108.64],"What did Laila study?":[109.09,110.65],"Electrical power engineering, in Assiut.":[111.1,114.14],"Are her grades excellent?":[114.59,116.33],"Good, but not excellent.":[116.78,118.54],"Are grades everything?":[118.99,120.59],"No. They're not necessarily a good indication of what she can achieve.":[121.04,125.78],"How many internships does she have under her belt?":[126.23,129.23],"Two internships.":[129.68,131.07],"What did she do in the transformer workshop?":[131.52,134.23],"She helped with oil tests.":[134.68,136.62],"What did she check on the tower sites?":[137.07,139.34],"Rectifiers, batteries and small generators.":[139.79,143.24],"Why does she volunteer?":[143.69,145.31],"It allows her to serve her community.":[145.76,148.13],"What did her team install?":[148.58,150.22],"A solar water pump for a village school.":[150.67,153.15],"Was it easy?":[153.6,154.72],"No, it was not an easy feat — no money, no crane. But they managed to succeed.":[155.17,161.17],"What does she read for fun?":[161.62,163.28],"Manuals! She's a voracious reader.":[163.73,166.53],"What was her mistake?":[166.98,168.36],"She labelled two battery cables the wrong way round.":[168.81,172.21],"Did she hide the mistake?":[172.66,174.28],"No. She told the team and made a checklist — she took ownership of her actions.":[174.73,180.06],"What word did the manager write?":[180.51,182.63], a lot to the table.":[0.0,9.94],"He's a fast learner and very keen to acquire new skills, so he took a course in thermal imaging.":[10.39,17.45],"One Tuesday, he pointed his thermal camera at the main switchboard. One breaker was 95°C. The others were 40.":[17.9,28.08],"It was a hot spot — a loose cable connection. If nobody fixed it, it could start a fire.":[28.53,35.12],"His manager said, \"Just tighten it now. Don't stop the production line.\"":[35.57,40.74],"But the panel was live. Tamer always plays by the rules and follows company guidelines: never work on a live panel.":[41.19,49.88],"\"I'm sorry,\" he said. \"I've learned that it's OK to say no. Let's shut it down safely on Friday, when the line stops.\"":[50.33,59.07],"Until Friday, he checked the breaker every two hours with the camera.":[59.52,64.13],"On Friday, the team followed LOTO: switch off, lock, tag, test. Then Tamer tightened the cable to the correct torque.":[64.58,73.78],"The next scan showed 42°C. Problem solved — and nobody got hurt.":[74.23,80.38],"Tamer can be quite critical of himself. \"I should have scanned that panel months ago,\" he said. So he made a monthly thermal-scan schedule for every panel in the factory.":[80.83,92.96],"Now he wants to be the go-to person for solving problems — and he'd be interested in further job progression, maybe to reliability engineer.":[93.41,104.46],"main switchboard":[104.91,106.33],"circuit breaker":[106.78,108.08],"thermal camera":[108.53,109.72],"hot spot":[110.17,111.31],"LOTO (lock-out/tag-out)":[111.76,114.29],"torque":[114.74,115.53],"How long has Tamer worked at the factory?":[115.98,118.58],"Six months. He's a fresh graduate.":[119.03,121.56],"What course did he take?":[122.02,123.63],"Thermal imaging — he's keen to acquire new skills.":[124.08,127.72],"How hot was the bad breaker?":[128.17,130.26],"95°C. The others were 40.":[130.71,134.18],"What caused the hot spot?":[134.63,136.35],"A loose cable connection.":[136.8,138.68],"What could happen if nobody fixed it?":[139.13,141.58],"It could start a fire.":[142.03,143.57],"What did his manager want?":[144.02,145.85],"To tighten it now, without stopping production.":[146.3,149.62],"Did Tamer work on the live panel?":[150.07,152.49],"No. He plays by the rules — never work on a live panel.":[152.94,157.22],"What has Tamer learned?":[157.67,159.09],"That it's OK to say no.":[159.54,161.35],"What did he do until Friday?":[161.8,163.79],"He checked the breaker every two hours with the camera.":[164.24,167.63],"What is LOTO?":[168.08,169.24],"Switch off, lock, tag and test — before you touch anything.":[169.69,173.8],"What was the temperature after the fix?":[174.25,176.63],"42°C. Problem solved.":[177.08,180.16],"Is Tamer easy on himself?":[180.61,182.53],"No. He can be quite critical of himself.":[182.98,185.69],"What does he want to be?":[186.14,187.55],"The go-to person for solving problems.":[188.0,190.84],"As a fresh graduate, I bring a lot to the table.":[191.29,194.86],"I always play by the rules and follow company guidelines.":[195.31,199.48],"I want to be the go-to person for solving problems.":[199.93,203.67],"I'd be interested in further job progression.":[204.12,207.47],"I'm a fast learner and very keen to acquire new skills.":[207.92,211.8],"I can be quite critical of myself.":[212.25,214.59],"I've learned that it's OK to say no.":[215.04,217.44],"I have no weaknesses.":[217.89,219.63],"I'm a perfectionist, and I've learned to finish things within the time available.":[220.08,225.06],"I'm always late and I don't care.":[225.51,227.63],"I always play by the rules":[228.08,230.01],"In your chair.":[230.46,231.57],"Mastering this role and, if the opportunity comes, growing into a leadership role.":[232.02,237.95],"I don't know.":[238.4,239.36],"fresh graduate":[239.81,241.18],"strength":[241.63,242.53],"weakness":[242.98,243.92],"procrastination":[244.37,245.87],"perfectionist":[246.32,247.59],"progression":[248.04,249.06],"Why should we hire you instead of someone with more experience?":[249.51,253.58],"As a fresh graduate, I bring a lot to the table. I'm a fast learner, and my internship taught me how to work in a team.":[254.03,262.81],"Because I need the money.":[263.26,264.82],"You shouldn't, maybe.":[265.27,266.6],"What is your greatest weakness?":[267.05,269.03],"I can be quite critical of myself, so now I track my goals and celebrate small achievements.":[269.48,276.14],"I work too hard.":[276.59,278.02],"I hate people.":[278.47,279.87],"And where do you see yourself in five years?":[280.32,282.81],"I want to master this role and be the go-to person for solving problems. If the opportunity comes, I'd like to lead a small team.":[283.26,292.86],"Running my own company.":[293.31,295.09],"Retired on a beach.":[295.54,297.15]},"in1":{"Rania works at a company that makes UPS systems. She is in charge of managing the creation and release of new products.":[0.0,9.57],"Her latest product is a small battery sensor. You put one on every battery in a UPS, and it measures voltage, temperature and internal resistance.":[10.02,21.95],"When a battery starts to get weak, its internal resistance goes up. The sensor sees it months before the battery fails.":[22.4,31.07],"Her days are usually quite varied. On Monday, she talks to the engineers about the firmware. On Tuesday, she visits a data centre for a field test.":[31.52,42.76],"Every morning, she has a short call with the factory to ensure they stay on schedule.":[43.21,48.96],"The launch was a success. Three banks bought the sensors in the first month, and one found forty weak batteries before a power cut.":[49.41,58.93],"But after four years, Rania feels she has reached a plateau in her growth.":[59.38,64.48],"Now the company wants a new operations manager for the monitoring centre — a room with big screens and a dashboard for every customer's batteries.":[64.93,76.15],"In her internal interview, Rania said, \"In this role, I would oversee the day-to-day operations of the monitoring centre.\"":[76.6,85.61],"\"I built this product, so I'm eager to leverage my expertise to make the service even better.\"":[86.06,92.47],"\"And honestly, this role aligns perfectly with my career goals.\"":[92.92,97.65],"battery monitoring system":[98.1,99.97],"internal resistance":[100.42,102.15],"sensor":[102.6,103.48],"dashboard":[103.93,104.94],"firmware":[105.39,106.22],"field test":[106.67,107.82],"What is Rania in charge of?":[108.27,110.43],"Managing the creation and release of new products.":[110.88,114.74],"What is her latest product?":[115.19,117.12],"A small sensor for every battery in a UPS.":[117.57,121.09],"What does the sensor measure?":[121.54,123.24],"Voltage, temperature and internal resistance.":[123.69,127.23],"What happens to internal resistance when a battery gets weak?":[127.68,132.01],"It goes up.":[132.46,133.48],"Are her days all the same?":[133.93,135.75],"No, they're usually quite varied.":[136.2,138.31],"Why does she call the factory every morning?":[138.76,141.33],"To ensure they stay on schedule.":[141.78,143.98],"How many banks bought the sensors in the first month?":[144.43,147.46],"Three banks.":[147.91,149.04],"How many weak batteries did one bank find?":[149.49,152.29],"Forty — before a power cut!":[152.74,154.87],"How does Rania feel after four years?":[155.32,158.0],"She feels she has reached a plateau in her growth.":[158.45,161.51],"What is the new role?":[161.96,163.41],"Operations manager for the monitoring centre.":[163.86,167.52],"What would she do in that role?":[167.97,169.68],"Oversee the day-to-day operations of the monitoring centre.":[170.13,174.45],"Why is she eager?":[174.9,176.2],"She built the product, so she's eager to leverage her expertise.":[176.65,180.96],"Does the role fit her plans?":[181.41,183.32],"Yes — it aligns perfectly with her career goals.":[183.77,187.37],"I'm in charge of managing the creation and release of new products.":[187.82,192.64],"My days are usually quite varied.":[ ing results.":[10.44,17.82],"One accomplishment that stands out in his mind is a farm in Wadi El Natrun. Its ten irrigation pumps started at full speed with star-delta starters.":[18.27,30.13],"Every start hit the pipes like a hammer — water hammer — and two pipes burst in one summer. The electricity bill was huge, too.":[30.58,39.94],"Hany installed a VFD on each pump. Now the pumps start slowly and keep the pressure constant.":[40.39,47.87],"When a pump runs 20% slower, it uses about half the power. The farm's bill fell by 35%, and no pipe burst again.":[48.32,59.19],"The project was completed on time and under budget, and it generated a 25% increase in orders from other farms nearby.":[59.64,69.75],"Then a hospital called. The VFDs on its chillers and big air-handling units kept tripping at night with an overvoltage fault.":[70.2,79.63],"Hany read the fault log. The drives were stopping the huge fans too quickly, so the motors were pushing energy back into the drives.":[80.08,89.76],"He set a longer deceleration time, added a braking resistor, and cleaned the drives' cooling fans, which were full of dust.":[90.21,99.7],"The trips stopped, and the operating theatres stayed cool all summer. That year, his team exceeded its sales targets by 20%.":[100.15,110.02],"Hany believes new ideas are crucial for growth. His next idea: remote monitoring for every drive, so faults are fixed before they stop a pump.":[110.47,121.94],"His experience and skills align very well with the new role.":[122.39,126.85],"VFD (variable frequency drive)":[127.3,130.29],"star-delta starter":[130.74,132.3],"water hammer":[132.75,133.89],"overvoltage trip":[134.34,135.98],"deceleration time":[136.43,138.11],"braking resistor":[138.56,140.09],"chiller / AHU":[140.54,142.36],"What does Hany work with?":[142.81,144.44],"VFDs — variable frequency drives for big motors.":[144.89,149.16],"What role is he going for?":[149.61,151.42],"Service manager — it's a promotion.":[151.87,154.45],"Does he have of ten, and the project was completed on time and under budget.":[274.68,280.38],"I was there when the project happened.":[280.83,283.15],"The launch exceeded sales targets by 20%.":[283.6,287.35],"I have a proven track record":[287.8,289.88],"The team is fine.":[290.33,291.72],"I have experience with agile methods, and I think using them could speed up our development.":[292.17,298.36],"Ask my manager.":[298.81,300.28],"track record":[300.73,301.91],"on time":[302.36,303.36],"under budget":[303.81,305.06],"exceed":[305.51,306.47],"revamp":[306.92,307.82],"align with":[308.27,309.32],"How do your experience and skills align with this role?":[309.77,313.39],"I have eight years in marketing and a proven track record: my last campaign generated a 25% increase in website traffic.":[313.84,324.0],"I think they align.":[324.45,325.9],"You tell me.":[326.35,327.4],"Tell me about a notable achievement.":[327.85,330.27],"One accomplishment that stands out in my mind is a new product line I launched. It exceeded sales targets by 20%.":[330.72,340.28],"I never missed a day.":[340.73,342.28],"The team did everything.":[342.73,344.47],"Any fresh ideas for the team?":[344.92,347.08],"I believe new ideas are crucial for growth. I'd like to start a customer feedback program to find areas for improvement.":[347.53,356.4],"No, everything is perfect.":[356.85,359.01],"Fire half the team.":[359.46,360.99]},"jargon":{"circle back":[0.0,1.14],"Let's circle back on the budget after lunch.":[1.59,4.39],"loop someone in":[4.84,6.13],"Can you loop in Sara from finance?":[6.58,8.88],"touch base":[9.33,10.47],"Let's touch base on Thursday.":[10.92,13.0],"heads-up":[13.45,14.37],"Just a heads-up: the client is coming at 10.":[14.82,18.11],"ping":[18.56,19.29],"Ping me when the file is ready.":[19.74,21.68],"bandwidth":[22.13,23.15],"I don't have the bandwidth for this project this week.":[23.6,26.61],"action items":[27.06,28.39],"I'll send the action items after the call.":[28.84,31.51],"deliverables":[31.96,33.03],"The deliverables are due on Friday.":[33.48,35.91],"EOD":[36.36,37.1],"Can you send it by EOD?":[37.55,39.48],"OOO":[39.93,40.67],"I'm OOO until Sunday.":[41.12,43.06],"on my radar":[43.51,44.8],"The invoice issue is on my radar.":[45.25,47.83],"take it offline":[48.28,49.65],"Good point — let's take it offline.":[50.1,52.49],"quick win":[52.94,53.94],"Fixing the signup form is a quick win.":[54.39,57.3],"low-hanging fruit":[57.75,59.19],"Let's start with the low-hanging fruit.":[59.64,62.0],"a hard stop":[62.45,63.73],"I have a hard stop at 3.":[64.18,66.13],"sync":[66.58,67.36],"Can we have a quick sync tomorrow?":[67.81,69.89],"get the ball rolling":[70.34,71.75],"Let's get the ball rolling on the new website.":[72.2,74.93],"ballpark figure":[75.38,76.69],"Can you give me a ballpark figure for the project?":[77.14,80.16],"on the same page":[80.61,82.02],"Let's make sure we're all on the same page.":[82.47,85.08],"follow up":[85.53,86.52],"I'll follow up with the supplier tomorrow.":[86.97,89.68]},"pi1":{"Mostafa is a generator technician. He looks after twenty standby generators in shopping malls and office towers in New Cairo.":[0.0,10.67],"One evening, the power went off in a big mall. The generator was supposed to start in ten seconds. It didn't.":[11.12,19.24],"Mostafa was standing in the dark generator room when his phone rang. It was a recruiter from an energy company.":[19.69,27.85],"\"I'm a little tied up just now,\" he said. \"Is it OK if I call you back in an hour?\"":[28.3,34.08],"He is very detail-oriented, so he checked everything, step by step. The fuel was full. The ATS was fine.":[34.53,43.31],"Then he found it: a loose, dirty terminal on the starting battery. The generator couldn't get enough current to start.":[43.76,52.12],"He cleaned and tightened the terminal. The engine started, the ATS transferred the load, and the lights came back on.":[52.57,61.5],"An hour later, he called the recruiter back. \"Can you tell me a little about yourself?\" she asked.":[61.95,68.03],"\"I thrive on new challenges,\" Mostafa said. \"Tonight, for example, a generator failed to start during a blackout.\"":[68.48,77.47],"\"I'm also a self-starter. Nobody asked me, but I created a monthly load test for all twenty generators.\"":[77.92,86.17],"\"I'm goal-oriented and ambitious. My goal this year is zero failed starts.\"":[86.62,92.29],"The recruiter smiled. \"Tonight wasn't zero,\" she said. \"But it sounds like you're the right person to get there.\"":[92.74,100.64],"standby generator":[101.09,102.79],"ATS (automatic transfer switch)":[103.24,105.54],"starting battery":[105.99,107.27],"battery terminal":[107.72,109.09],"load test":[109.54,110.67],"What does Mostafa look after?":[111.12,113.24],"Twenty standby generators in malls and office towers.":[113.69,117.92],"What happened in the mall?":[118.37,119.92],"The power went off, and the generator didn't start.":[120.37,123.67],"How fast was the generator supposed to start?":[124.12,127.4],"In ten seconds.":[127.85,129.32],"Who called him?":[129.77,130.95],"A recruiter from an energy company.":[131.4,133.81],"Could he talk right then?":[134.26,135.91],"No. He was a little tied up, so he asked to call her back.":[136.36,140.13],"Was the fuel tank empty?":[140.58,142.44],"No, the fuel was full. And the ATS was fine.":[142.89,146.63],"What was the real problem?":[147.08,148.98],"A loose, dirty terminal on the starting battery.":[149.43,152.6],"How did he find it?":[153.05,154.5],"He's detail-oriented — he checked everything, step by step.":[154.95,159.4],"Did he call the recruiter back?":[159.85,161.65],"Yes, an hour later.":[162.1,163.69],"What does he thrive on?":[164.14,165.6],"He thrives on new challenges.":[166.05,168.32],"Did someone ask him to create the load test?":[168.77,171.78],"No! He's a self-starter — nobody asked him.":[172.23,175.43],"What's his goal this year?":[175.88,177.5],"Zero failed starts. He's goal-oriented and ambitious.":[177.95,1 ],"Then he emailed the managers: \"Please find attached the incident report for your review.\"":[41.8,47.4],"The finance manager replied angrily: \"Why did IT shut down our system on a busy Monday?\"":[47.85,54.26],"Omar stayed polite: \"There seems to have been a misunderstanding. The outage was caused by a hardware fault, not a planned shutdown.\"":[54.71,63.88],"He added: \"I apologize for the disruption, and I am committed to making things right. We will install a redundant switch with two power supplies.\"":[64.33,74.39],"\"We're on track to finish the upgrade by Thursday. Please approve the purchase order at your earliest convenience.\"":[74.84,81.69],"The next morning, the CEO wrote back: \"Thank you for bringing this matter to our attention. Approved.\"":[82.14,88.65],"core switch":[89.1,90.09],"power supply (PSU)":[90.54,92.28],"helpdesk ticket":[92.73,94.02],"outage":[94.47,95.24],"redundant":[95.69,96.71],"purchase order (PO)":[97.16,98.65],"Is Omar a sales manager?":[99.1,101.02],"No, he isn't. He's the IT support lead at a factory.":[101.47,105.43],"How many laptops does he look after?":[105.88,108.16],"Three hundred laptops — and forty printers and the whole network.":[108.61,112.57],"What happened at 8:05 on Monday?":[113.02,115.98],"Nobody could open the ERP system.":[116.43,119.03],"How many tickets did the helpdesk get?":[119.48,121.62],"Sixty tickets in ten minutes!":[122.07,123.98],"What was dead?":[124.43,125.48],"The core switch. Its power supply had failed over the weekend.":[125.93,130.07],"Did Omar ask for a spare switch before?":[130.52,132.96],"Yes. As you may recall, he asked last year, but it was never approved.":[133.41,138.1],"When was the ERP back online?":[138.55,140.73],"By 9:30 — he moved the key servers to a backup switch.":[141.18,145.23],"What did he attach to his email?":[145.68,147.54],"The incident report. \"Please find attached the incident report for your review.\"":[147.99,153.06],"Did IT shut down the system on purpose?":
