<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalam Business</title>
<meta name="description" content="Kalam Business: Business English for Arabic speakers. Read and listen to the book, learn the phrases, practise, and role-play real work situations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#18233F; --ink-2:#4A5673; --muted:#7A849B;
  --paper:#F5F6FA; --card:#FFFFFF; --line:#E2E5EE;
  --cobalt:#3552C9; --cobalt-soft:#E6EAFB;
  --mint:#2FA88E; --mint-soft:#DDF3EC;
  --saffron:#E9A93A; --saffron-soft:#FBF0DA;
  --rose:#D9677B; --rose-soft:#FBE6EA;
  --good:#23915B; --good-soft:#DDF3E6; --bad:#C2413A; --bad-soft:#F9E1DF;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-lg:26px; --r-md:16px; --r-sm:11px;
  --lift:0 1px 2px rgba(24,35,63,.05),0 10px 30px -12px rgba(24,35,63,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E9ECF5;--ink-2:#B7BFD3;--muted:#8C95AC;--paper:#0F1424;--card:#171E33;--line:#27304A;
  --cobalt:#7F96FF;--cobalt-soft:#1E2850;--mint:#4FD0B3;--mint-soft:#133A33;--saffron:#F2C064;--saffron-soft:#3A2F17;
  --rose:#F08A9C;--rose-soft:#3D1F27;--good:#54CE8C;--good-soft:#143524;--bad:#F07B72;--bad-soft:#3F1E1C;
  --lift:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--ink:#E9ECF5;--ink-2:#B7BFD3;--muted:#8C95AC;--paper:#0F1424;--card:#171E33;--line:#27304A;
  --cobalt:#7F96FF;--cobalt-soft:#1E2850;--mint:#4FD0B3;--mint-soft:#133A33;--saffron:#F2C064;--saffron-soft:#3A2F17;
  --rose:#F08A9C;--rose-soft:#3D1F27;--good:#54CE8C;--good-soft:#143524;--bad:#F07B72;--bad-soft:#3F1E1C;
  --lift:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
[hidden]{display:none!important}

/* nav */
.nav{position:sticky;top:10px;z-index:20;margin:10px auto 0;max-width:1120px;padding-inline:16px}
.nav-in{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 14px;box-shadow:var(--lift)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.links{display:flex;gap:2px;margin-inline:auto}
.links a{text-decoration:none;font-weight:600;font-size:15px;color:var(--ink-2);padding:7px 13px;border-radius:999px}
.links a[aria-current="page"]{background:var(--cobalt-soft);color:var(--cobalt)}
.stats{display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:5px 11px;border-radius:999px;background:var(--paper);font-variant-numeric:tabular-nums}
.stat.x{color:var(--saffron)} .stat.s{color:var(--mint)}
.stat svg{width:15px;height:15px}
@media (max-width:760px){.links{display:none}.stats{margin-inline-start:auto}}
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
  .tabbar a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--cobalt);background:var(--cobalt-soft)}
  body{padding-bottom:78px}
}

/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--paper)}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.chip.lv{background:var(--mint-soft);border-color:transparent;color:var(--mint)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding-block:48px 28px}
.hero h1{font-size:clamp(38px,6.2vw,68px);font-weight:800}
.hero h1 .l2{display:block;color:var(--cobalt)}
.hero .sub{font-size:19px;color:var(--ink-2);margin:18px 0 6px;max-width:34ch}
.hero .sub-ar{color:var(--muted);font-size:17px;margin:0 0 26px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-art{position:relative}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:28px}.hero-art{order:-1;max-width:420px;margin-inline:auto}}

/* dive-in cards */
.sec{padding-block:36px}
.sec-head{text-align:center;max-width:620px;margin:0 auto 26px}
.sec-head h2{font-size:clamp(28px,4vw,40px)}
.sec-head p{color:var(--ink-2);margin:10px 0 0}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.way{position:relative;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:6px;min-height:230px;overflow:hidden}
.way .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.way .ic svg{width:24px;height:24px}
.way h3{font-size:24px}
.way p{margin:0;color:var(--ink-2);font-size:15px}
.way .ar{color:var(--muted);font-size:14px}
.way .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:14px}
.way:hover{border-color:currentColor}
.t-cobalt{color:var(--cobalt)} .t-mint{color:var(--mint)} .t-saffron{color:var(--saffron)} .t-rose{color:var(--rose)}
.way h3,.way p{color:var(--ink)}
.way p{color:var(--ink-2)}

/* page head */
.phead{padding-block:34px 18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin-bottom:18px}
.phead h1{font-size:clamp(34px,5vw,54px);font-weight:800}
.phead p{color:var(--ink-2);max-width:56ch;margin:12px 0 0;font-size:17px}
.phead .ar{color:var(--muted);margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* lesson cards */
.group{margin-top:26px}
.group-h{display:flex;align-items:baseline;gap:10px;border-inline-start:4px solid var(--mint);padding-inline-start:10px;margin-bottom:14px}
.group-h b{font-family:var(--display);font-size:22px}
.group-h span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.lcard .art{aspect-ratio:16/10;position:relative}
.lcard .art svg{width:100%;height:100%;display:block}
.lcard .badge{position:absolute;top:12px;padding:3px 10px;border-radius:999px;background:var(--card);font-weight:700;font-size:12px}
.lcard .badge.l{left:12px;color:var(--mint)} .lcard .badge.n{right:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.lcard h3{font-size:21px}
.lcard .ar{color:var(--muted);font-size:15px}
.lcard p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.lcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;font-size:14px;color:var(--muted)}
.lcard .go{font-weight:700;color:var(--cobalt);background:var(--cobalt-soft);padding:6px 14px;border-radius:999px}
.lcard.done .go{background:var(--good-soft);color:var(--good)}
.lcard.soon{opacity:.7}
.lcard.soon .go{background:var(--paper);color:var(--muted)}

/* path */
.path{position:relative;max-width:760px;margin:10px auto 0}
.path::before{content:"";position:absolute;inset:0 auto 0 27px;border-inline-start:2px dashed var(--line)}
.stage-h{position:relative;display:inline-flex;align-items:center;gap:8px;margin:26px 0 12px 58px;font-weight:700;font-size:14px;color:var(--saffron);background:var(--saffron-soft);padding:5px 12px;border-radius:999px}
.step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.step .dot{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink-2)}
.step.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.step.next .dot{border-color:var(--cobalt);color:var(--cobalt)}
.step .box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;text-decoration:none}
.step .box small{color:var(--muted);display:block;font-weight:600;font-size:13px}
.step .box b{font-family:var(--display);font-size:18px}
.step.soon .box{opacity:.6}

/* lesson page */
.lhero{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:center;padding-block:28px 12px}
.lhero .art{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10}
.lhero .art svg{width:100%;height:100%;display:block}
@media (max-width:760px){.lhero{grid-template-columns:1fr}.lhero .art{display:none}.ltabs{top:70px}.player{top:122px}}
.ltabs{position:sticky;top:78px;z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--paper);padding-block:10px;margin-bottom:6px;scrollbar-width:none}
.ltabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.ltabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ltabs button .ok{color:var(--good)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:24px}
@media (max-width:560px){.panel{padding:16px}}

/* read & listen */
.player{position:sticky;top:142px;z-index:4;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:10px 14px;margin-bottom:18px}
.player .pp{width:44px;height:44px;border-radius:50%;border:0;background:var(--saffron);color:#1b1405;display:grid;place-items:center}
.player .pp svg{width:20px;height:20px}
.player .ttl{font-weight:700;font-size:15px;line-height:1.3}
.player .bar{height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:6px;cursor:pointer;position:relative}
.player .bar i{position:absolute;inset:0 auto 0 0;background:var(--saffron);border-radius:9px}
.player .tm{font-size:13px;font-variant-numeric:tabular-nums;opacity:.8}
.player .sp{border:1px solid rgba(255,255,255,.3);background:none;color:inherit;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.tracks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tracks button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;font-size:14px;text-align:start}
.tracks button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.reader{font-size:18px;line-height:1.75;max-width:70ch}
.reader h4{font-family:var(--display);font-size:20px;margin:26px 0 8px}
.reader .ln{display:block;padding:6px 10px;margin-inline:-10px;border-radius:10px;cursor:pointer;transition:background .2s}
.reader .ln:hover{background:var(--paper)}
.reader .ln.now{background:var(--saffron-soft);box-shadow:inset 3px 0 0 var(--saffron)}
.reader .ln .who{font-weight:700;color:var(--cobalt);margin-inline-end:4px}
.reader .blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--muted);height:1em;vertical-align:-2px}
.reader .note{color:var(--muted);font-size:15px}
.hint{display:flex;gap:10px;background:var(--mint-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:15px;margin-bottom:16px}

/* practice player (learn / quiz / match / talk) */
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .35s}
.kicker{font-size:14px;color:var(--muted);font-weight:600}
.phrase{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 4px}
.phrase h2{font-size:clamp(26px,4.4vw,36px);font-weight:650}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--saffron-soft);color:var(--saffron);display:grid;place-items:center}
.say svg{width:22px;height:22px}
.meaning{font-size:20px;font-weight:600;margin-bottom:14px}
.example{background:var(--paper);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.example mark{background:var(--saffron-soft);color:inherit;border-radius:4px;padding:0 3px}
.tip{border-inline-start:3px solid var(--mint);padding-inline-start:12px;color:var(--ink-2);font-size:15px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.q{font-size:20px;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:13px 16px;text-align:left;font-size:17px}
.opt.arx{text-align:right;direction:rtl;font-family:var(--ar)}
.opt:hover:not(:disabled){border-color:var(--cobalt)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.gap{display:inline-block;min-width:72px;border-bottom:2px solid var(--cobalt);text-align:center;color:var(--cobalt)}
.built{min-height:56px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.w{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-size:16px}
.w:disabled{opacity:.25}
.fb{border-radius:var(--r-md);padding:12px 14px;margin-top:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:12px;min-height:54px;font-size:16px;transition:opacity .25s,transform .25s}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.96)}
.tile.shake{animation:sh .3s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-weight:800;color:var(--saffron);font-variant-numeric:tabular-nums}
.scene{background:var(--paper);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px}
.chat{display:grid;gap:10px;margin-bottom:6px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:17px}
.msg small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.them{justify-self:start;background:var(--paper);border-top-left-radius:4px}
.msg.you{justify-self:end;background:var(--cobalt);color:#fff;border-top-right-radius:4px}
.msg.you small{color:inherit;opacity:.8}
.done-box{text-align:center;display:grid;justify-items:center;gap:10px;padding-block:10px}
.done-box h2{font-size:32px}
.score{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.score div{background:var(--paper);border-radius:var(--r-md);padding:10px 18px;min-width:110px}
.score b{display:block;font-family:var(--display);font-size:26px}
.score span{font-size:13px;color:var(--muted)}

/* phrasebook */
.pb{display:grid;gap:10px}
.pbrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px}
.pbrow b{font-size:17px;font-weight:600}
.empty{text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:40px 16px}

.ltabs .new{font-size:10px;font-weight:800;background:var(--saffron);color:#1b1405;border-radius:999px;padding:1px 6px;margin-inline-end:6px;vertical-align:1px}
.bank-all{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.bank-all summary{cursor:pointer;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank-list{display:grid;gap:6px;margin-top:12px}
.bank-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:16px;padding:6px 0;border-bottom:1px dashed var(--line)}
.say.sm{width:34px;height:34px}.say.sm svg{width:16px;height:16px}
.spot-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.spot-head h2{font-size:clamp(30px,5vw,42px);font-weight:800}
.lvl{font-size:13px;font-weight:700;color:var(--cobalt);background:var(--cobalt-soft);padding:3px 10px;border-radius:999px}
.spot-def{font-size:18px;margin:4px 0}.spot-ar{color:var(--muted);margin:0 0 14px}
.book-line{background:var(--saffron-soft);border-radius:var(--r-md);padding:12px 14px;margin-bottom:16px}
.uses{display:grid;gap:8px;margin:8px 0 16px}
.use{display:grid;gap:2px;border-radius:14px;padding:10px 14px;background:var(--paper);border-inline-start:4px solid var(--line)}
.use b{font-size:13px;color:var(--muted)}
.u-email{border-color:var(--cobalt)}.u-chat{border-color:var(--mint)}.u-meeting{border-color:var(--rose)}
.goes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dd>div{border-radius:var(--r-md);padding:12px 14px;font-size:15px}.dd b{display:block;margin-bottom:4px}
.dont{background:var(--bad-soft)}.dont b{color:var(--bad)}.do{background:var(--good-soft)}.do b{color:var(--good)}
@media (max-width:560px){.dd{grid-template-columns:1fr}}
.story-hero h2{font-size:clamp(26px,4vw,34px);margin:6px 0 4px}
.story{font-size:19px;line-height:1.8;max-width:65ch;margin:14px 0}
.story p{margin:0 0 10px;padding:4px 8px;margin-inline:-8px;border-radius:10px;cursor:pointer;transition:background .2s}
.story p.on{background:var(--saffron-soft)}
.story-play{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px}.story-play .btn svg{width:16px;height:16px;vertical-align:-2px}
.spk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);vertical-align:middle;margin-inline-start:6px;cursor:pointer;flex:none}
.spk svg{width:15px;height:15px}.spk.big{width:48px;height:48px}.spk.big svg{width:22px;height:22px}
.spk:hover,.spk:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.vpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.vpick .kicker{width:100%}
.vpick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.vpick button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.vbtn{border:0;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
@media (max-width:520px){.vbtn span{display:none}}
@media (max-width:430px){.stat.s{display:none}}
.wrap.narrow{max-width:760px}
.season{margin:26px 0}.season-h{display:flex;gap:14px;align-items:flex-start}.season-h h2{margin:0;font-size:22px}.season-h p{margin:2px 0}.season-h .chip{margin-inline-start:auto;flex:none}
.sdesc{font-size:14px;color:var(--muted)}
.eps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.ep{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:inherit}
.ep>span:nth-child(2){display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.ep .ar{font-size:13px;color:var(--muted)}
.epn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;font-size:14px}
.ep.done .epn{background:var(--mint-soft);color:var(--mint)}.epf{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.epf{display:none}}
.thread{display:grid;gap:14px;margin-top:18px}
.mail{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px 18px;scroll-margin-top:80px}
.mail.new{animation:pop .35s ease}@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mail.sent{border-color:color-mix(in srgb,var(--mint) 45%,var(--line));background:color-mix(in srgb,var(--mint-soft) 45%,var(--card))}
.mail header{display:flex;gap:10px;align-items:center}.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--saffron-soft);color:var(--saffron);font-weight:800;font-size:13px}
.mail.sent .av{background:var(--mint-soft);color:var(--mint)}
.mh{display:flex;flex-direction:column;min-width:0}.mh b{font-size:15px}.mh span{font-size:12px;color:var(--muted)}
.subj{font-weight:700;margin:10px 0 6px}.mbody p{margin:0 0 10px;line-height:1.65}
.mfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.btn.sm{padding:8px 14px;font-size:14px}
.task{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--cobalt-soft)}.task .ar{margin:4px 0}.re{font-size:13px;color:var(--muted)}
.bank.sent .w,.built.sent .w{display:block;width:100%;text-align:start;white-space:normal;line-height:1.45}
.rightord{margin:8px 0 0;padding-inline-start:20px}.kit{margin-top:18px}.kit h3{margin:18px 0 4px}
.plist{display:grid;gap:8px;margin-top:8px}.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.prow>span{display:flex;flex-direction:column;gap:2px}.prow .ar{font-size:13px;color:var(--muted)}
.say-note{font-size:13px;color:var(--muted);margin:4px 0 0}
.msg small .spk{width:24px;height:24px}.msg small .spk svg{width:12px;height:12px}
.techw{margin-top:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;background:var(--cobalt-soft);font-size:14px}
.chip b{color:var(--cobalt)}.chip .ar{font-size:13px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.scard{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .15s}
.scard:hover{transform:translateY(-2px)}.scard h3{margin:0;font-size:20px;text-wrap:balance}.scard p{margin:0}
.sico{font-size:30px;line-height:1}.sl{font-size:14px;color:var(--muted)}.smeta{margin-top:auto;font-size:13px;font-weight:600;color:var(--cobalt)}
.opts.two{grid-template-columns:1fr 1fr}
.plain{background:var(--paper);border-radius:var(--r-md);padding:14px 16px;margin:8px 0 12px}
.bad-say{font-size:20px;font-weight:600;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.jar{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.jcard{display:grid;gap:6px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-height:150px;align-content:start}
.jcard .jt{font-family:var(--display);font-size:24px;font-weight:800}
.jcard .jm,.jcard .ja{display:none}.jcard .je{color:var(--ink-2);font-style:italic}
.jcard .jhint{font-size:13px;color:var(--muted);margin-top:auto}
.jcard[aria-expanded="true"]{border-color:var(--mint);background:var(--mint-soft)}
.jcard[aria-expanded="true"] .jm,.jcard[aria-expanded="true"] .ja{display:block}.jcard[aria-expanded="true"] .jm{font-weight:700}
.jcard[aria-expanded="true"] .jhint{display:none}
footer{margin-top:40px;border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

/* ============================================================

   ============================================================ */
const KEY="kalam-business-v1";
let S={xp:0,done:{},read:{},streak:0,last:null};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const day=d=>new Date(d).toISOString().slice(0,10);
function bump(){const t=day(Date.now()); if(S.last===t)return; S.streak=S.last===day(Date.now()-864e5)?S.streak+1:1; S.last=t}
function stats(){const ok=S.last===day(Date.now())||S.last===day(Date.now()-864e5);
  document.getElementById("s-streak").textContent=ok?S.streak:0; document.getElementById("s-xp").textContent=S.xp}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
let CLIP=null;
/* ---------- pronunciation audio (natural voice, one file per lesson) ---------- */
const sclean=s=>String(s).replace(/<[^>]+>/g,"").replace(/[\u200e\u200f]/g,"").replace(/\s+/g," ").trim();
const SAYA={}; let SAYCUR=null;
const VOICES=[["l1","🐢","Slow & clear","بطيء وواضح — Heart 🇺🇸"],["l2","🎧","Normal","سرعة عادية — Michael 🇺🇸"],["l3","🇬🇧","Real-life","سرعة الشغل الحقيقي — George 🇬🇧"]];
let VOICE="l1"; try{VOICE=localStorage.getItem("kalam-voice")||"l1"}catch(e){}
function setVoice(v){VOICE=v; try{localStorage.setItem("kalam-voice",v)}catch(e){} document.querySelectorAll("[data-voice]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.voice===v)); const vb=document.getElementById("vbtn"); if(vb){const x=VOICES.find(y=>y[0]===v); vb.innerHTML=`${x[1]} <span>${x[2]}</span>`}}
const voicePick=()=>typeof SAY==="undefined"?"":`<div class="vpick" role="group" aria-label="Listening level"><span class="kicker">Listening level</span>${VOICES.filter(v=>SAY[v[0]]).map(v=>`<button data-voice="${v[0]}" aria-pressed="${v[0]===VOICE}" title="${v[3]}">${v[1]} ${v[2]}</button>`).join("")}</div>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-voice]"); if(b){setVoice(b.dataset.voice); const s=b.closest("[data-demo]"); sayPlay(s?s.dataset.demo:"")}});
function sayFind(t){ if(typeof SAY==="undefined")return null; const c=sclean(t), c2=sclean(String(t).replace(/…/g,""));
  const lvs=[VOICE].concat(Object.keys(SAY).filter(x=>x!==VOICE)), gid=(typeof L!=="undefined"&&L)?L.id:null;
  for(const lv of lvs){ const S2=SAY[lv]; if(!S2)continue; for(const k of [gid].concat(Object.keys(S2))){ const m=k&&S2[k]; if(m&&(m[c]||m[c2])) return [lv+"/"+k].concat(m[c]||m[c2]) } } return null }
function stopSay(){ if(SAYCUR){SAYCUR.pause();SAYCUR.ontimeupdate=null} }
function sayPlay(t,onend){ const f=sayFind(t); if(!f){ onend&&onend(); return false }
  stopSay(); if(CLIP){CLIP.pause();CLIP=null} if(typeof SEG!=="undefined"&&SEG){SEG.pause()}
  const a=SAYA[f[0]]||(SAYA[f[0]]=Object.assign(new Audio("audio/say/"+f[0]+".mp3"),{preload:"auto"})); SAYCUR=a;
  const go=()=>{ a.currentTime=f[1]; a.play().catch(()=>{}); a.ontimeupdate=()=>{ if(a.currentTime>=f[2]){ a.pause(); a.ontimeupdate=null; onend&&onend() } } };
  if(a.readyState>=1) go(); else a.addEventListener("loadedmetadata",go,{once:true}); return true }
const spk=(t,cls="")=>sayFind(t)?`<span role="button" tabindex="0" class="spk ${cls}" data-say="${esc(sclean(String(t).replace(/…/g,"")))}" aria-label="Listen" title="Listen">${SPK}</span>`:"";
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]"); if(b){e.stopPropagation();e.preventDefault();sayPlay(b.dataset.say)}},true);
document.addEventListener("keydown",e=>{const b=e.target.closest&&e.target.closest("[data-say]"); if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sayPlay(b.dataset.say)}});
function play(card){ if(CLIP){CLIP.pause();CLIP=null} if(card&&card.clip){CLIP=new Audio(card.clip);CLIP.play().catch(()=>{})} }
const chapter=id=>CHAPTERS.find(c=>c.id===id);
const real=()=>LESSONS.filter(l=>!l.soon);

const app=document.getElementById("app");
function route(){
  stopAudio(); clearInterval(tick);
  const h=location.hash.replace(/^#\/?/,"").split("/");
  const page=h[0]||"";
  document.querySelectorAll(".links a,.tabbar a").forEach(a=>{
    const p=a.getAttribute("href").replace(/^#\/?/,"").split("/")[0];
    a.toggleAttribute("aria-current",p===page||(page==="lesson"&&p==="lessons")); if(a.hasAttribute("aria-current"))a.setAttribute("aria-current","page")});
  if(page==="lessons") lessons(h[1]);
  else if(page==="path") pathPage();
  else if(page==="phrases") phrases();
  else if(page==="decoder") decoder();
  else if(page==="stories") storiesPage();
  else if(page==="email") (h[1]?emailCase(h[1]):emailHome());
  else if(page==="lesson") lesson(h[1],h[2]);
  else home();
  window.scrollTo(0,0); stats();
}
addEventListener("hashchange",route);

const ALL_TABS=[["read","Read & listen"],["learn","Learn"],["words","Word spotlight"],["story","Mini story"],["quiz","Practise"],["upgrade","Say it like a pro"],["match","Match game"],["talk","Role-play"]];
let TABS=ALL_TABS;
function tabsFor(l){return ALL_TABS.filter(([k])=>k==="words"?WORDS[l.id]:k==="story"?STORY[l.id]:k==="upgrade"?UPGRADE[l.id]:true)}
let L,tab,tick;
function lesson(id,t){
  L=LESSONS.find(l=>l.id===id&&!l.soon); if(!L){location.hash="#/lessons";return}
  TABS=tabsFor(L);
  tab=TABS.some(x=>x[0]===t)?t:"read";
  const c=chapter(L.chapter), n=LESSONS.indexOf(L)+1;
  app.innerHTML=`<div class="wrap">
   <section class="lhero"><div>
     <a class="back" href="#/lessons">← Lessons</a>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="chip lv">${c.level}</span><span class="chip">Chapter ${c.n} · ${c.title}</span><span class="chip">Lesson ${n}</span></div>
     <h1 style="font-size:clamp(30px,4.6vw,46px);font-weight:800">${esc(L.title)}</h1>
     <p class="ar" style="color:var(--muted);font-size:18px;margin:6px 0 0">${esc(L.ar)}</p>
     <p style="color:var(--ink-2);margin:10px 0 0">${esc(L.desc)}</p>
   </div><div class="art">${art(L.art)}</div></section>
   <div class="ltabs" role="tablist">${TABS.map(([k,e])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${["words","story","upgrade"].includes(k)?'<span class="new">New</span>':""}${e}${k==="read"&&S.read[L.id]||k==="talk"&&S.done[L.id]?' <span class="ok">✓</span>':""}</button>`).join("")}</div>
   <div class="panel" id="panel"></div></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{history.replaceState(null,"",`#/lesson/${L.id}/${b.dataset.t}`);setTab(b.dataset.t)});
  setTab(tab);
}
function setTab(t){
  tab=t; stopAudio(); clearInterval(tick);
  app.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  const sel=app.querySelector(`[data-t="${t}"]`); if(sel&&sel.scrollIntoView) sel.scrollIntoView({inline:"center",block:"nearest"});
  const p=document.getElementById("panel");
  ({read:readTab,learn:learnTab,words:wordsTab,story:storyTab,quiz:quizTab,upgrade:upgradeTab,match:matchTab,talk:talkTab})[t](p);
}
function nextTab(){const i=TABS.findIndex(x=>x[0]===tab); if(i<TABS.length-1){history.replaceState(null,"",`#/lesson/${L.id}/${TABS[i+1][0]}`);setTab(TABS[i+1][0]);document.querySelector(".ltabs").scrollIntoView({block:"start"})}}

/* ---------- read & listen ---------- */
let AUD=null, rafId=0;
function stopAudio(){ stopSay(); if(AUD){AUD.pause();AUD=null} cancelAnimationFrame(rafId); if(CLIP){CLIP.pause();CLIP=null} if(typeof SEG!=="undefined"&&SEG){SEG.pause();SEG=null} }
const fmt=s=>isFinite(s)?`${s/60|0}:${String(s%60|0).padStart(2,"0")}`:"0:00";
function readTab(p){
  let cur=0;
  const draw=()=>{
    const R=L.reading[cur];
    p.innerHTML=`<div class="hint"><span>🎧</span><span>Press play and follow the text. The line being read lights up; tap any line to jump to it.<br><span class="ar">دوس تشغيل وتابع النص. السطر اللي بيتقري بيتلوّن، واضغط على أي سطر تروحله.</span></span></div>
     <div class="tracks">${L.reading.map((r,i)=>`<button data-k="${i}" aria-pressed="${i===cur}">Part ${i+1}: ${esc(r.title.replace(/^\d+\.\s*/,""))}</button>`).join("")}</div>
     <div class="player"><button class="pp" id="pp" aria-label="Play">${PLAY}</button>
      <div><div class="ttl">${esc(R.title.replace(/^\d+\.\s*/,""))}</div><div class="bar" id="bar"><i id="fill" style="width:0"></i></div></div>
      <div style="display:grid;gap:4px;justify-items:end"><span class="tm" id="tm">0:00</span><button class="sp" id="sp">1×</button></div></div>
     <div class="reader" id="reader">${R.lines.map((l,i)=>l.k==="h"?`<h4>${esc(l.s)}</h4>`:`<span class="ln" data-i="${i}" ${l.t!=null?`data-t="${l.t}"`:""}>${fmtLine(l.s)}</span>`).join("")}</div>
     <div class="actions"><button class="btn" id="go">Next: learn the phrases</button></div>`;
    stopAudio(); const A=new Audio(R.src); AUD=A; A.preload="metadata";
    const pp=p.querySelector("#pp"), fill=p.querySelector("#fill"), tm=p.querySelector("#tm"), lines=[...p.querySelectorAll(".ln[data-t]")];
    let lastNow=null;
    const loop=()=>{ if(AUD!==A)return; const t=A.currentTime, d=A.duration||1;
      fill.style.width=(t/d*100)+"%"; tm.textContent=`${fmt(t)} / ${fmt(A.duration)}`;
      let now=null; for(const el of lines){ if(+el.dataset.t<=t+.25) now=el; else break }
      if(now!==lastNow){ lastNow&&lastNow.classList.remove("now"); if(now){now.classList.add("now"); const r=now.getBoundingClientRect(); if(r.top<200||r.bottom>innerHeight-40) now.scrollIntoView({block:"center",behavior:"smooth"})} lastNow=now }
      rafId=requestAnimationFrame(loop)};
    A.onplay=()=>{pp.innerHTML=PAUSE;pp.setAttribute("aria-label","Pause");loop()};
    A.onpause=()=>{pp.innerHTML=PLAY;pp.setAttribute("aria-label","Play");cancelAnimationFrame(rafId)};
    A.onended=()=>{S.read[L.id]=true;save(); if(cur<L.reading.length-1){cur++;draw();AUD&&AUD.play().catch(()=>{})}};
    A.onloadedmetadata=()=>tm.textContent=`0:00 / ${fmt(A.duration)}`;
    pp.onclick=()=>A.paused?A.play().catch(()=>{}):A.pause();
    const rates=[1,.85,.75,1.15]; let ri=0;
    p.querySelector("#sp").onclick=e=>{ri=(ri+1)%rates.length;A.playbackRate=rates[ri];e.target.textContent=rates[ri]+"×"};
    p.querySelector("#bar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); if(A.duration)A.currentTime=(e.clientX-r.left)/r.width*A.duration};
    lines.forEach(el=>el.onclick=()=>{A.currentTime=Math.max(0,+el.dataset.t-.2);A.play().catch(()=>{})});
    p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    p.querySelector("#go").onclick=()=>{S.read[L.id]=true;save();nextTab()};
  };
  draw();
}

}
function mailCard(m,sent){
  return `<article class="mail ${sent?"sent":""}"><header><div class="av">${sent?"You":esc(m.from.replace(/^(Mr\.|Ms\.|Eng\.|Dr\.)\s*/,"").slice(0,1))}</div><div class="mh"><b>${esc(m.from)}</b><span>${esc(m.date||"")}</span></div></header>
   <div class="subj">${esc(m.subject)}</div><div class="mbody">${m.body.map(b=>`<p>${para(b)} ${spk(b)}</p>`).join("")}</div>
   ${sent?`<div class="mfoot"><button class="btn alt sm" data-copy>Copy this reply</button><span class="ar" style="color:var(--muted);font-size:13px">انسخه وعدّل الأسماء والأرقام</span></div>`:""}</article>`;
}
function emailCase(id){
  const c=EMAILS.find(x=>x.id===id); if(!c){emailHome();return} L=null;
  const cs=EMAILS.filter(x=>x.season===c.season), ix=cs.indexOf(c), nxt=cs[ix+1]||EMAILS[EMAILS.indexOf(c)+1];
  let mi=0, si=0, good=0, total=0; const shown=[];
  app.innerHTML=`<div class="wrap narrow"><section class="phead"><a class="back" href="#/email">← Email Lab</a>
    <span class="kicker">${c.icon} ${esc(c.field)} · Episode ${ix+1} of ${cs.length}</span><h1>${esc(c.title)}</h1><p class="ar" style="color:var(--muted)">${esc(c.ar)}</p>
    <div class="scene"><span class="kicker">The situation</span><div>${esc(c.scene)} ${spk(c.scene)}</div><div class="ar" style="margin-top:6px">${esc(c.sceneAr)}</div></div>${voicePick()}</section>
    <div id="thr" class="thread"></div><div id="work"></div></div>`;
  const thr=app.querySelector("#thr"), work=app.querySelector("#work");
  const bindCopy=()=>thr.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const txt=[...b.closest(".mail").querySelectorAll(".mbody p")].map(p=>p.innerText.trim()).join("\n\n");
     const done=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy this reply",1500)};
     try{navigator.clipboard.writeText(txt).then(done,()=>{sel(b)})}catch(e){sel(b)} });
  const sel=b=>{const r=document.createRange();r.selectNodeContents(b.closest(".mail").querySelector(".mbody"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected — press copy"};
  const paint=()=>{thr.innerHTML=shown.map(m=>mailCard(m,m.dir==="out")).join(""); bindCopy()};
  const step=()=>{
    if(mi>=c.thread.length){ return finishCase() }
    const m=c.thread[mi];
    if(m.dir==="in"){ shown.push(m); paint(); const el=thr.lastElementChild; el.classList.add("new"); el.scrollIntoView({behavior:"smooth",block:"start"});
      work.innerHTML=`<div class="actions"><button class="btn" id="go">${c.thread[mi+1]&&c.thread[mi+1].dir==="out"?"Write your reply":"Next email"}</button></div>`;
      work.querySelector("#go").onclick=()=>{mi++;si=0;step()}; return }
    // out: build the reply
    if(si>=m.steps.length){ shown.push(m); paint(); const el=thr.lastElementChild; el.classList.add("new"); el.scrollIntoView({behavior:"smooth",block:"start"});
      work.innerHTML=`<div class="hint"><span>✉️</span><span>This is a model reply. Listen to it, then read it aloud once.<br><span class="ar">ده نموذج للرد. اسمعه وبعدين اقراه بصوت عالي مرة.</span></span></div><div class="actions"><button class="btn" id="go">${mi<c.thread.length-1?"Continue the thread":"Finish"}</button></div>`;
      work.querySelector("#go").onclick=()=>{mi++;si=0;step()}; return }
    const s=m.steps[si]; total++;
    const head=`<div class="task"><span class="kicker">Your reply · step ${si+1} of ${m.steps.length}</span><div class="ar">${esc(m.task)}</div><div class="re">RE: ${esc(m.subject.replace(/^RE:\s*/i,""))}</div></div>`;
    const fin=(ok,extra)=>{ if(ok)good++; const f=work.querySelector("#fb"); f.hidden=false; f.className="fb "+(ok?"good":"bad"); f.innerHTML=`<b>${ok?"Good choice":"Not quite"}</b><span class="ar">${esc(s.why||"")}</span>${extra||""}`;
      const g=work.querySelector("#go"); g.hidden=false; g.focus(); g.onclick=()=>{si++;step()} };
    if(s.type==="order"){ let built=[]; const bank=shuffle(s.parts.map((w,k)=>({w,k})));
      work.innerHTML=`${head}<p class="q">Put the sentences in the right order</p><div class="built sent" id="bt"></div><div class="bank sent" id="bk"></div><div id="fb" hidden></div><div class="actions"><button class="btn" id="ck" disabled>Check</button><button class="btn" id="go" hidden>Next</button></div>`;
      const d=()=>{work.querySelector("#bt").innerHTML=built.map((b,j)=>`<button class="w" data-j="${j}">${esc(b.w)}</button>`).join("");
        work.querySelector("#bk").innerHTML=bank.map(b=>`<button class="w" data-k="${b.k}" ${built.includes(b)?"disabled":""}>${esc(b.w)}</button>`).join("");
        work.querySelectorAll("#bt .w").forEach(x=>x.onclick=()=>{built.splice(+x.dataset.j,1);d()});
        work.querySelectorAll("#bk .w").forEach(x=>x.onclick=()=>{built.push(bank.find(b=>b.k==x.dataset.k));d()});
        work.querySelector("#ck").disabled=built.length!==s.parts.length};
      d(); work.querySelector("#ck").onclick=function(){this.hidden=true;work.querySelectorAll(".w").forEach(w=>w.disabled=true);const ok=built.every((b,j)=>b.k===j);
        fin(ok, ok?"":`<ol class="rightord">${s.parts.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`)}; return }
    const prompt=s.type==="gap"?`<p class="q">${esc(s.sentence).replace(/_{2,}/,'<span class="gap">?</span>')}</p>`:`<p class="q">${esc(s.q)}</p>`;
    work.innerHTML=`${head}${prompt}<div class="opts">${s.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb" hidden></div><div class="actions"><button class="btn" id="go" hidden>Next</button></div>`;
    work.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===s.a;
      work.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===s.a)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
      let full=s.type==="gap"?s.sentence.replace(/_{2,}/,s.opts[s.a]):s.opts[s.a];
      if(s.type==="gap") work.querySelector(".gap").textContent=s.opts[s.a];
      fin(ok, spk(full)); sayPlay(full)});
  };
  const finishCase=()=>{ const first=!EDONE()[c.id]; EDONE()[c.id]=1; if(first){S.xp+=15+good*3; bump(); save(); stats()}
    work.innerHTML=`<div class="done-box"><h2>Thread complete ✉️</h2><p>${good} / ${total} steps right${first?` · +${15+good*3} XP`:""}</p></div>
     <section class="kit"><h3>Phrases to reuse</h3><p class="ar" style="color:var(--muted)">عبارات تنفعك في أي إيميل شبه ده</p>
      <div class="plist">${c.phrases.map(([e,a])=>`<div class="prow"><span><b>${esc(e)}</b><span class="ar">${esc(a)}</span></span>${spk(e)}</div>`).join("")}</div>
      <h3>Words for this situation</h3><div class="chips">${c.glossary.map(([e,a])=>`<span class="chip"><b>${esc(e)} ${spk(e)}</b><span class="ar">${esc(a)}</span></span>`).join("")}</div></section>
     <div class="actions" style="justify-content:center"><a class="btn alt" href="#/email">All threads</a>${nxt?`<a class="btn" href="#/email/${nxt.id}">Next: ${esc(nxt.title)}</a>`:""}</div>`;
    work.scrollIntoView({behavior:"smooth",block:"start"}) };
  step();
}

/* ---------- stories from your field ---------- */
function storyCards(n){return Object.entries(STORY).slice(0,n||99).map(([id,st])=>{const l=LESSONS.find(x=>x.id===id); if(!l)return "";
  return `<a class="scard" href="#/lesson/${id}/story"><span class="sico">${st.icon||"📖"}</span><span class="kicker">${esc(st.field||"")}</span><h3>${esc(st.title)}</h3><p class="ar">${esc(st.ar)}</p>
   <p class="sl">Words from: <b>${esc(l.title)}</b></p><span class="smeta">${st.qa.length} quick questions · ${S.done[id]?"✓ lesson done":"hero: "+esc(st.hero||"")}</span></a>`}).join("")}
function storiesPage(){
  app.innerHTML=`<div class="wrap"><section class="phead"><a class="back" href="#/">← Home</a><h1>Stories from your field</h1>
   <p>Short stories from real technical work — UPS, servers, solar plants, control cards and VFDs. Each one reuses the phrases of a book lesson, then asks lots of quick questions so the words stick (the AJ Hoge mini-story method).</p>
   <p class="ar">قصص قصيرة من شغلك الحقيقي. كل قصة فيها عبارات درس من الكتاب، وبعدها أسئلة سريعة كتير عشان الكلمات تثبت.</p>${voicePick()}</section>
   <div class="sgrid">${storyCards()}</div></div>`;
}

/* ---------- office talk decoder ---------- */
function decoder(){
  let f="all";
  const draw=()=>{const list=JARGON.filter(j=>f==="all"||j.ch===f);
   app.innerHTML=`<div class="wrap"><section class="phead"><a class="back" href="#/">← Home</a><h1>Office talk</h1>
    <p>The English people really use at work today — in chats, emails and meetings — and what it actually means.</p><p class="ar">الكلام اللي بيتقال في الشركات فعلًا، ومعناه الحقيقي بالمصري.</p>${voicePick()}
    <div class="filters">${[["all","All"],["chat","💬 Chat"],["email","✉️ Email"],["meeting","👥 Meeting"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${k===f}">${t}</button>`).join("")}</div></section>
    <div class="jar">${list.map(j=>`<button class="jcard" aria-expanded="false"><span class="jt">${esc(j.t)} ${spk(j.t)}</span><span class="jm">${esc(j.m)}</span><span class="ja ar">${esc(j.ar)}</span><span class="je">“${esc(j.eg)}” ${spk(j.eg)}</span><span class="jhint">Tap to see the meaning</span></button>`).join("")}</div></div>`;
   app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;draw()});
   app.querySelectorAll(".jcard").forEach(b=>b.onclick=()=>b.setAttribute("aria-expanded",b.getAttribute("aria-expanded")==="true"?"false":"true"));
  }; draw();
}

function finish(p,good,total){
  const first=!S.done[L.id], gain=20+(SC.quiz||0)*5+good*5+((SC.time||99)<20?10:0);
  S.xp+=gain; S.done[L.id]=true; bump(); save(); stats();
  const nxt=real().find(l=>!S.done[l.id]);
  p.innerHTML=`<div class="done-box"><h2>Lesson complete 🎉</h2><p class="ar">برافو! خلّصت «${esc(L.ar)}»${first?"، والعبارات اتضافت لـ My phrases.":"."}</p>
   <div class="score"><div><b>+${gain}</b><span>XP</span></div><div><b>${SC.quiz??"–"}/${L.quiz.length}</b><span>Practice</span></div><div><b>${SC.time?SC.time.toFixed(1)+"s":"–"}</b><span>Match game</span></div><div><b>${good}/${total}</b><span>Role-play</span></div></div>
   <div class="actions" style="justify-content:center">${nxt?`<a class="btn" href="#/lesson/${nxt.id}">Next lesson: ${esc(nxt.title)}</a>`:`<a class="btn" href="#/path">Back to the path</a>`}</div></div>`;
}

setVoice(VOICE);
route();
</script>
